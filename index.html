/* ---------- light glass: only these few surfaces blur what is behind them ---------- */
*,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.shell.home .hx-nav,.shell.home .composer,.shell.home .main.in-chat .topbar{-webkit-backdrop-filter:blur(20px) saturate(1.6)!important;backdrop-filter:blur(20px) saturate(1.6)!important}

/* ---------- motion: short, compositor-only, nothing keeps running ---------- */
.hx-greet,.hx-title,.shell.home .hero-slot,.hx-quick,.hx-grid{animation:hxIn .9s cubic-bezier(.16,1,.3,1) backwards}
.hx-title{animation-delay:.05s}.shell.home .hero-slot{animation-delay:.1s}.hx-quick{animation-delay:.16s}.hx-grid{animation-delay:.24s}
@keyframes hxIn{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
.hx-nav{animation:hxNav .8s cubic-bezier(.16,1,.3,1) backwards}
@keyframes hxNav{from{opacity:0;transform:translate3d(0,-10px,0)}to{opacity:1;transform:none}}
.hx-card{transition:transform .4s var(--spring),box-shadow .3s}
@media (hover:hover){.hx-card:hover{transform:translateY(-2px);box-shadow:var(--hx-shadow-lg)}}
.hx-icon svg,#themeBtn svg{animation:iconIn .5s cubic-bezier(.34,1.4,.64,1)}
@keyframes iconIn{from{opacity:0;transform:rotate(-60deg) scale(.6)}to{opacity:1;transform:none}}
.shell.home .send:not(:disabled){animation:sendReady .4s var(--spring)}
@keyframes sendReady{from{transform:scale(.85)}to{transform:none}}
.shell.home .send:active:not(:disabled){transform:scale(.9)}
.tp-now,.tp-opts button,.tp-phases{animation:tpIn .4s cubic-bezier(.16,1,.3,1) backwards}
.tp-opts button:nth-child(1){animation-delay:.04s}.tp-opts button:nth-child(2){animation-delay:.07s}.tp-opts button:nth-child(3){animation-delay:.1s}.tp-phases{animation-delay:.13s}
.theme-pop.still *{animation:none!important}
@keyframes tpIn{from{opacity:0;transform:translate3d(0,5px,0)}to{opacity:1;transform:none}}
.shell.home .msg.user{animation:userIn .45s cubic-bezier(.34,1.25,.64,1) backwards;transform-origin:100% 100%}
@keyframes userIn{from{opacity:0;transform:translate3d(10px,10px,0) scale(.95)}to{opacity:1;transform:none}}
.shell.home .msg.ai,.shell.home .msg.card{animation:aiIn .5s cubic-bezier(.16,1,.3,1) backwards}
@keyframes aiIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.shell.home .msg.still{animation:none}
.thread:not([hidden]){animation:threadIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes threadIn{from{opacity:0}to{opacity:1}}
/* theme change: View Transitions (circle from the button, or a short crossfade) */
html.vt-circle::view-transition-old(root),html.vt-circle::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-circle::view-transition-new(root){z-index:2}

/* keep long chats cheap */
.thread{contain:strict}
.thread .msg{contain:layout style;content-visibility:auto;contain-intrinsic-size:auto 160px}

.modal,.menu,.palette,.theme-pop,.toast{--accent:var(--hx-accent);--accent-soft:var(--hx-accent-soft);--surface:var(--hx-bg);--surface-2:var(--hx-bg);--line:var(--hx-line);--line-2:var(--hx-line2);--ink:var(--hx-ink);--muted:var(--hx-ink3);--faint:var(--hx-ink3)}

/* ===================== sky and mountains (real time) =====================
   Painted from a few CSS variables that change once a minute; one layer, no animation loop. */
.aura{display:none}
.sky{position:absolute;inset:0;overflow:hidden;contain:strict;
  --mh:clamp(230px,44vh,500px);--hz:calc(100% - var(--mh) * .6);--sun-sz:clamp(46px,5.2vw,82px);--peak:11%}
.sky-grad{position:absolute;inset:0;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 48%,var(--s3) calc(var(--hz) + 4%),var(--s3) 100%)}
.sky-stars{position:absolute;left:0;top:0;width:100%;height:100%;opacity:var(--stars,0)}
.sky-glow{position:absolute;left:var(--glow-x,50%);top:var(--hz);width:130vmax;height:70vmin;transform:translate(-50%,-58%);
  background:radial-gradient(closest-side,var(--glow-c),transparent);opacity:var(--glow-o,0);pointer-events:none}
.sky-sun,.sky-moon{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.sky-sun{left:var(--sun-x);top:calc(var(--hz) - var(--sun-alt) * (var(--hz) - var(--peak)));width:var(--sun-sz);height:var(--sun-sz);opacity:var(--sun-o,0);
  background:radial-gradient(circle at 50% 50%,#FFFFFF 0%,#FFFBEF 38%,var(--sun-c) 70%);
  box-shadow:0 0 40px 10px color-mix(in srgb,var(--sun-c) 65%,transparent),0 0 140px 50px color-mix(in srgb,var(--sun-c) 30%,transparent)}
.sky-moon{left:var(--moon-x);top:calc(var(--hz) - var(--moon-alt) * (var(--hz) - var(--peak)));width:calc(var(--sun-sz) * .74);height:calc(var(--sun-sz) * .74);opacity:var(--moon-o,0);
  background:radial-gradient(circle at 38% 36%,#FFFFFF 0%,#F2EFE4 46%,#D9D6CC 100%);
  box-shadow:inset -6px -4px 0 rgba(170,170,190,.18),0 0 34px 6px rgba(200,210,255,.32),0 0 120px 40px rgba(150,165,255,.14)}
.sky-mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:var(--mh)}
.sky-mtn .m1{fill:var(--m1)}.sky-mtn .m2{fill:var(--m2)}.sky-mtn .m3{fill:var(--m3)}.sky-mtn .m4{fill:var(--m4)}
/* readability on top of the sky */
.welcome .hx-title{text-shadow:0 1px 28px rgba(255,255,255,.35)}
html[data-theme="dark"] .welcome .hx-title{text-shadow:0 2px 30px rgba(0,0,0,.35)}
.hx-greet{padding:6px 14px 6px 12px;border-radius:14px;background:var(--hx-glass);border:1px solid var(--hx-line)}
.hx-foot{width:auto;max-width:calc(100% - 32px);margin:auto auto calc(16px + env(safe-area-inset-bottom,0px));padding:10px 18px;border-radius:16px;
  background:var(--hx-glass-strong);border:1px solid var(--hx-line);box-shadow:var(--hx-shadow)}
.main.in-chat .scene-veil{opacity:1}
@media (max-width:640px){
  .sky{--sun-sz:40px;--peak:10%;--mh:clamp(200px,36vh,360px)}
  .hx-hero{padding-top:max(150px,19vh)}
}
/* real photo on top of the drawn sky; the drawn sky only shows if the photo can't load */
.sky-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s var(--ease)}
.sky-photo.in{opacity:1}
.sky.has-photo .sky-sun,.sky.has-photo .sky-moon,.sky.has-photo .sky-glow,.sky.has-photo .sky-stars{visibility:hidden}
.sky-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 22%),rgba(6,8,20,var(--shade,0));opacity:0}
.sky.has-photo .sky-shade{opacity:1}
/* keep the headline readable over any photo */
html[data-theme="light"] .sky.has-photo + .scene-veil{opacity:0}
.sky.has-photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 46% at 50% 30%,var(--hx-scrim,rgba(255,255,255,.34)),transparent 72%)}
html[data-theme="dark"] .sky.has-photo::after{--hx-scrim:rgba(4,6,16,.32)}
.hx-credit{color:var(--hx-ink3);text-decoration:none}
.hx-credit:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){.sky-photo{transition:none}}
/* over a real photo the lower half can be dark or busy: cards and chips get a little more body */

/* the sunset photo is very bright near the horizon: a deeper scrim and shadow keep the headline readable */

.set-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start;min-height:360px}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.set-nav button{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:none;
  color:var(--hx-ink2);font:500 14.5px var(--hx-font);text-align:left;transition:background .2s,color .2s}
.set-nav button svg{width:18px;height:18px;flex:none;color:var(--hx-ink3);transition:color .2s}
.set-nav button:hover{background:var(--hx-hover);color:var(--hx-ink)}
.set-nav button[aria-selected="true"]{background:var(--hx-accent-soft);color:var(--hx-ink);font-weight:600}
.set-nav button[aria-selected="true"] svg{color:var(--hx-accent)}
.set-body{min-width:0}
.set-sec{display:flex;flex-direction:column;gap:16px;animation:setIn .35s cubic-bezier(.16,1,.3,1) backwards}
.set-sec[hidden]{display:none}
.set-sec > h3:first-child{margin-top:0}
.sheet .set-sec h3{font:700 19px/1.2 var(--hx-font);letter-spacing:-.015em;text-transform:none;color:var(--hx-ink)}
.sheet .set-sec h3:not(:first-child){font-size:15px;margin-top:10px}
@keyframes setIn{from{opacity:0;transform:translateY(6px)}}
@media (max-width:640px){
  .set-layout{grid-template-columns:minmax(0,1fr);gap:16px;min-height:0}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px;gap:6px}
  .set-nav::-webkit-scrollbar{display:none}
  .set-nav button{width:auto;flex:none;height:38px;border-radius:19px;padding:0 14px 0 12px;font-size:14px;border:1px solid var(--hx-line)}
  .set-nav button[aria-selected="true"]{border-color:transparent}
}
@media (prefers-reduced-motion:reduce){.set-sec{animation:none}}

/* ---------- 5. chat readability ---------- */
.shell.home .msg.ai .body{max-width:70ch;font-size:16.5px;line-height:1.72;letter-spacing:-.003em}
.shell.home .msg.ai .md p{margin:0 0 .9em}
.shell.home .msg.ai .md > :last-child{margin-bottom:0}
.shell.home .md h1,.shell.home .md h2,.shell.home .md h3{font-family:var(--hx-font);letter-spacing:-.015em;line-height:1.3;margin:1.3em 0 .5em}
.shell.home .md h1{font-size:1.35em}.shell.home .md h2{font-size:1.2em}.shell.home .md h3{font-size:1.06em}
.shell.home .md ul,.shell.home .md ol{padding-left:1.35em;margin:.2em 0 .9em}
.shell.home .md li{margin:.28em 0}
.shell.home .md li::marker{color:var(--hx-ink3)}
.shell.home .md blockquote{margin:.6em 0 1em;padding:.2em 0 .2em 1em;border-left:3px solid var(--hx-accent-soft);color:var(--hx-ink2)}
.shell.home .md a{color:var(--hx-accent);text-underline-offset:3px}
.shell.home .md :not(pre) > code{background:var(--hx-hover);border:0;padding:.14em .42em;border-radius:7px;font-size:.86em;color:var(--hx-ink)}
.shell.home .codeblock{border-radius:16px;overflow:hidden;margin:.6em 0 1.1em}
.shell.home .codeblock pre{font-size:13.5px;line-height:1.6}
.shell.home .table-wrap{border:1px solid var(--hx-line2);border-radius:16px;margin:.7em 0 1.1em;background:var(--hx-card)}
.shell.home .md table{border:0;font-size:14.5px}
.shell.home .md th{background:var(--hx-hover);font-weight:600;color:var(--hx-ink)}
.shell.home .md th,.shell.home .md td{padding:10px 14px;border:0;border-bottom:1px solid var(--hx-line)}
.shell.home .md tr:last-child td{border-bottom:0}
.shell.home .md tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--hx-hover) 45%,transparent)}
.shell.home .msg-actions{gap:4px;margin-top:6px}
.shell.home .msg-actions .icon-btn{width:36px;height:36px;border-radius:12px;color:var(--hx-ink2)}
.shell.home .msg-actions .icon-btn svg{width:18px;height:18px}
.shell.home .msg-actions .icon-btn[aria-pressed="true"]{color:var(--hx-accent);background:var(--hx-accent-soft)}
.shell.home .msg.user .bubble{font-size:16px;line-height:1.55}
/* time separators */
.t-sep{display:flex;align-items:center;gap:14px;font:500 12.5px var(--hx-font);color:var(--hx-ink3);margin:6px 0 -6px;font-variant-numeric:tabular-nums}
.t-sep::before,.t-sep::after{content:"";flex:1;height:1px;background:var(--hx-line)}

/* ---------- 6. icon sizes, one scale ---------- */
.shell.home .tool svg,.hx-icon svg,.shell.home .topbar .icon-btn svg{width:20px;height:20px}
.hx-chip svg,.smart button svg{width:17px;height:17px}

/* ---------- 8. empty, loading and error states ---------- */
.skel{display:grid;gap:11px;max-width:min(520px,100%);padding:10px 0 4px 30px}
.skel i{position:relative;display:block;height:12px;border-radius:6px;background:var(--hx-hover);overflow:hidden}
.skel i:nth-child(1){width:94%}.skel i:nth-child(2){width:82%}.skel i:nth-child(3){width:58%}
.skel i::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:skelSweep 1.5s ease-in-out infinite}
html[data-theme="dark"] .skel i::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent)}
.skel i:nth-child(2)::after{animation-delay:.12s}.skel i:nth-child(3)::after{animation-delay:.24s}
@keyframes skelSweep{to{transform:translateX(100%)}}
@media (max-width:640px){.skel{padding-left:0}}
@media (prefers-reduced-motion:reduce){.skel i::after{animation:none;display:none}}
.shell.home .status-note.err{align-items:center;gap:12px;padding:12px 12px 12px 12px;border-radius:18px;font-size:14px;
  background:var(--hx-card);border:1px solid color-mix(in srgb,#E5484D 28%,var(--hx-line));color:var(--hx-ink2);box-shadow:var(--hx-shadow)}
.status-note .sn-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,#E5484D 12%,transparent);color:#D93A40}
html[data-theme="dark"] .status-note .sn-ic{color:#FF7B80}
.status-note .sn-ic svg{width:19px;height:19px}
.status-note.err .grow b{display:block;font-weight:600;color:var(--hx-ink);margin-bottom:1px}
.status-note.err .grow span{color:var(--hx-ink3);font-size:13.5px}
.status-note.err .btn{border-radius:12px}
.hx-empty{align-items:center;padding:14px 8px 8px;gap:14px}
.hx-empty-ic{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;background:var(--hx-accent-soft)}
.hx-empty .hx-empty-ic svg{margin:0;width:22px;height:22px}
.hx-empty #hStart{margin-top:10px}
.hx-empty .hx-empty-ic{display:grid;margin:0}
.hx-empty #hStart{margin:8px 0 0 -8px}
.shell.home .msg.user .msg-actions{margin-top:2px}
.shell.home .msg.user .msg-actions .icon-btn{width:30px;height:30px}
.shell.home .msg.user .msg-actions .icon-btn svg{width:16px;height:16px}
.shell.home .brand-word{text-transform:none}

/* =====================================================================
   Liquid Glass: clear tinted glass + bright specular rim + inner light.
   Blur only on small or fixed pieces (nav, composer, chat bar, pills);
   big cards and sheets get the same rim and tint without blur (iPad-friendly).
   ===================================================================== */
:root{
  --lg-tint:rgba(255,255,255,.34);--lg-tint-strong:rgba(255,255,255,.56);--lg-card:rgba(255,255,255,.62);
  --lg-sheen:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 55%,rgba(255,255,255,.12));
  --lg-rim:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.18) 28%,rgba(255,255,255,0) 50%,rgba(255,255,255,.14) 72%,rgba(255,255,255,.7));
  --lg-inset:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 1px rgba(255,255,255,.3),inset 0 0 22px rgba(255,255,255,.18);
  --lg-drop:0 1px 1px rgba(20,20,40,.06),0 14px 34px -16px rgba(20,24,60,.32);
  --lg-blur:blur(16px) saturate(1.9) brightness(1.04);
}
html[data-theme="dark"]{
  --lg-tint:rgba(26,26,34,.36);--lg-tint-strong:rgba(26,26,34,.58);--lg-card:rgba(24,24,32,.6);
  --lg-sheen:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 55%,rgba(255,255,255,.04));
  --lg-rim:linear-gradient(140deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 28%,rgba(255,255,255,0) 50%,rgba(255,255,255,.06) 72%,rgba(255,255,255,.32));
  --lg-inset:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 1px rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.05);
  --lg-drop:0 1px 2px rgba(0,0,0,.3),0 16px 40px -18px rgba(0,0,0,.7);
  --lg-blur:blur(16px) saturate(1.7) brightness(.96);
}

/* the glass pieces */
.hx-greet,.hx-chip,.hx-card,.hx-foot,.shell.home .composer{position:relative}
.hx-nav,.shell.home .composer,.shell.home .main.in-chat .topbar,.hx-greet,.hx-chip,.hx-cue,.hx-foot,.shell.home .to-bottom{
  background:var(--lg-sheen),var(--lg-tint);border-color:transparent;box-shadow:var(--lg-inset),var(--lg-drop)}
.shell.home .hx-nav,.shell.home .composer,.shell.home .main.in-chat .topbar,
.shell.home .hx-greet,.shell.home .hx-chip,.shell.home .hx-cue,.shell.home .hx-foot,.shell.home .to-bottom{
  -webkit-backdrop-filter:var(--lg-blur)!important;backdrop-filter:var(--lg-blur)!important}
.shell.home .composer{background:var(--lg-sheen),var(--lg-tint-strong)}
.shell.home .composer:focus-within{background:var(--lg-sheen),var(--lg-tint-strong);border-color:transparent;box-shadow:var(--lg-inset),var(--hx-halo)}
.hx-chip:hover,.hx-cue:hover{background:var(--lg-sheen),var(--lg-tint-strong);border-color:transparent}
html.has-photo[data-theme] .hx-greet,html.has-photo[data-theme] .hx-chip{background:var(--lg-sheen),var(--lg-tint-strong)}

/* big surfaces: same glass language, no blur */
.hx-card,html.has-photo .hx-card{background:var(--lg-sheen),var(--lg-card);border-color:transparent;box-shadow:var(--lg-inset),var(--lg-drop)}
html.has-photo[data-theme="light"] .hx-card{background:var(--lg-sheen),rgba(255,255,255,.7)}
html.has-photo[data-theme="dark"] .hx-card{background:var(--lg-sheen),rgba(20,20,28,.66)}
.sheet,.menu,.theme-pop,.smart,.shell.home .palette{box-shadow:var(--lg-inset),var(--hx-shadow-lg);border-color:transparent}

/* specular rim: a 1px gradient edge, brighter at the top-left and bottom-right like light through a lens */
.hx-nav::after,.shell.home .composer::after,.shell.home .main.in-chat .topbar::after,.hx-greet::after,.hx-chip::after,.hx-cue::after,.hx-foot::after,
.hx-card::after,.shell.home .to-bottom::after,.menu::after,.theme-pop::after,.smart::after,.shell.home .palette::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;background:var(--lg-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.shell.home .composer:focus-within::after{background:linear-gradient(140deg,rgba(255,255,255,.95),color-mix(in srgb,var(--hx-accent) 55%,transparent) 40%,rgba(255,255,255,.1) 60%,rgba(255,255,255,.75))}

/* people who ask the system for less transparency get solid panels */
@media (prefers-reduced-transparency:reduce){
  .hx-nav,.shell.home .composer,.shell.home .main.in-chat .topbar,.hx-greet,.hx-chip,.hx-cue,.hx-foot,.hx-card,.shell.home .to-bottom{
    background:var(--hx-solid)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
/* iPad: the glass re-blurs every frame while the photo moves, so the photo stays still there */
@media (hover:none) and (min-width:700px){.sky-photo.in{animation:none}}
/* AI chat titles */
.switch-row .sw-h{display:block;margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--hx-ink3);font-weight:400}
.switch-row{align-items:flex-start;gap:14px}
#chatTitleText.ai-titled{animation:aiTitled .7s cubic-bezier(.16,1,.3,1)}
@keyframes aiTitled{from{opacity:0;transform:translateY(4px);filter:blur(3px)}}
@media (prefers-reduced-motion:reduce){#chatTitleText.ai-titled{animation:none}}

/* ---------- math (native MathML) ---------- */
.md math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",math;font-size:1.1em;color:var(--hx-ink,inherit)}
.math-inline math{display:inline-block;vertical-align:-.12em}
.math-block{display:block;overflow-x:auto;overflow-y:hidden;margin:.55em 0 .8em;padding:.6em .4em;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.math-block math{font-size:1.22em;margin:0 auto}
.md mfrac{padding:0 .1em}
.math-raw{white-space:pre-wrap}

/* ---------- Mode Guru ---------- */
.guru-pill{display:inline-flex;align-items:center;gap:6px;height:32px;margin:3px 2px 3px 4px;padding:0 8px 0 10px;border-radius:16px;border:0;
  background:var(--hx-accent-soft);color:var(--hx-accent);font:600 13px var(--hx-font);white-space:nowrap;transition:background .2s,transform .3s var(--spring)}
.guru-pill[hidden]{display:none}
.guru-pill svg{width:16px;height:16px}
.guru-pill svg:last-child{width:13px;height:13px;opacity:.7}
.guru-pill:hover{background:color-mix(in srgb,var(--hx-accent) 22%,transparent)}
.guru-pill:active{transform:scale(.95)}
@media (max-width:640px){.guru-pill span{display:none}.guru-pill{padding:0 8px}}

/* =====================================================================
   Accent that follows the sky (default) — lavender stays available
   ===================================================================== */
html[data-accent="sky"][data-phase="pagi"]{--hx-accent:#B8501F;--hx-accent-ink:#FFFFFF;--hx-accent-soft:rgba(184,80,31,.11);--hx-grad:linear-gradient(100deg,#B8501F,#E07A5F)}
html[data-accent="sky"][data-phase="siang"]{--hx-accent:#2563D9;--hx-accent-ink:#FFFFFF;--hx-accent-soft:rgba(37,99,217,.1);--hx-grad:linear-gradient(100deg,#2563D9,#5B8DEF)}
html[data-accent="sky"][data-phase="sore"]{--hx-accent:#FFB07A;--hx-accent-ink:#1E1410;--hx-accent-soft:rgba(255,176,122,.15);--hx-grad:linear-gradient(100deg,#FFB07A,#F58BA8)}
html[data-accent="sky"][data-phase="malam"]{--hx-accent:#A9B8FF;--hx-accent-ink:#12131F;--hx-accent-soft:rgba(169,184,255,.14);--hx-grad:linear-gradient(100deg,#A9B8FF,#C9B6FF)}

/* =====================================================================
   Own wallpaper: a veil keeps the UI readable whatever the photo
   ===================================================================== */
html.wp[data-theme="light"].wp-dark .sky.has-photo .sky-shade{background:rgba(255,255,255,.3)}
html.wp[data-theme="light"]:not(.wp-dark):not(.wp-light) .sky.has-photo .sky-shade{background:rgba(255,255,255,.18)}
html.wp[data-theme="dark"].wp-light .sky.has-photo .sky-shade{background:rgba(8,8,16,.5)}
html.wp[data-theme="dark"]:not(.wp-dark):not(.wp-light) .sky.has-photo .sky-shade{background:rgba(8,8,16,.28)}
.wp-row{display:flex;align-items:center;gap:14px}
.wp-thumb{width:88px;height:60px;flex:none;border-radius:14px;background:#ccc center/cover no-repeat;box-shadow:var(--lg-inset),0 6px 16px -10px rgba(0,0,0,.4)}
.wp-thumb.sky{background-image:linear-gradient(180deg,#5C8FD8,#A9C6EA 55%,#4F6B8F 56%,#2E4560)!important}
html[data-phase="malam"] .wp-thumb.sky{background-image:linear-gradient(180deg,#0B1030,#2A2F6B 55%,#1A1F3A 56%,#0E1124)!important}
.wp-info b{display:block;font:600 14.5px var(--hx-font);color:var(--hx-ink)}
.wp-info small{display:block;font-size:12.5px;line-height:1.4;color:var(--hx-ink3);margin-top:2px}
.set-note{display:block;margin:-8px 0 2px;font-size:12.5px;color:var(--hx-ink3)}

/* =====================================================================
   Halloween 🎃 (html[data-season="halloween"]) — on/off in Appearance
   ===================================================================== */
.hw-only,.sky-hw{display:none}
html[data-season="halloween"] .hw-only{display:inline-flex}
html[data-season="halloween"] .sky-hw{display:block;position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* palette */
html[data-season="halloween"][data-theme="dark"]{
  --hx-bg:#120C18;--hx-solid:#1C1424;--hx-ink:#F7F0FA;--hx-ink2:rgba(244,234,250,.8);--hx-ink3:rgba(220,204,232,.58);
  --hx-accent:#FF9A3D;--hx-accent-ink:#1B0E04;--hx-accent-soft:rgba(255,154,61,.16);--hx-grad:linear-gradient(100deg,#FF9A3D,#C77DFF);
  --hx-glass:rgba(32,18,42,.58);--hx-glass-strong:rgba(32,18,42,.86);--hx-card:rgba(30,18,40,.62);
  --lg-tint:rgba(36,18,48,.38);--lg-tint-strong:rgba(36,18,48,.6);--lg-card:rgba(30,16,40,.62);
  --hx-halo:-16px -4px 42px -18px rgba(199,125,255,.5),16px -4px 42px -18px rgba(255,140,50,.5),0 18px 44px -20px rgba(255,120,40,.45),0 -14px 40px -20px rgba(160,90,255,.5);
  --tl0:#12081C;--tl1:#4A1D6E;--tl2:#C2501C;--tl3:#FF9A3D;--tls0:#FFF1C9;--tls1:#FFB347;--tls2:#F0641A;
}
html[data-season="halloween"][data-theme="light"]{
  --hx-accent:#C2410C;--hx-accent-ink:#FFFFFF;--hx-accent-soft:rgba(194,65,12,.1);--hx-grad:linear-gradient(100deg,#C2410C,#8B3FD9);
  --tl0:#2A1240;--tl1:#6A2C8F;--tl2:#E0682A;--tl3:#FFB25C;--tls0:#FFF1C9;--tls1:#FFB347;--tls2:#F0641A;
}
html.has-photo[data-season="halloween"][data-theme="dark"] .hx-card{background:var(--lg-sheen),rgba(26,14,34,.7)}
/* grading over the photo */
.hw-grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,8,64,.52) 0%,rgba(38,8,64,.18) 42%,rgba(255,104,20,.12) 78%,rgba(255,110,30,.3) 100%)}
html[data-theme="light"] .hw-grade{background:linear-gradient(180deg,rgba(120,60,170,.16),rgba(255,140,60,.08) 60%,rgba(255,120,40,.2))}
/* the moon */
.hw-moon{position:absolute;right:11%;top:13%;width:clamp(96px,13vw,210px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#FFF9EA 0%,#FFE9BC 34%,#F8C37A 70%,#E8954A 100%);
  box-shadow:0 0 40px 10px rgba(255,190,110,.35),0 0 140px 50px rgba(255,140,60,.18),inset -10px -12px 24px rgba(190,100,40,.35)}
.hw-moon i{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 62% 30%,rgba(200,130,60,.28) 0 7%,transparent 8%),radial-gradient(circle at 34% 64%,rgba(200,130,60,.24) 0 10%,transparent 11%),radial-gradient(circle at 70% 66%,rgba(200,130,60,.2) 0 6%,transparent 7%)}
html[data-theme="light"] .hw-moon{opacity:.55;box-shadow:0 0 30px 8px rgba(255,190,110,.25)}
@media (max-width:640px){.hw-moon{right:7%;top:9%;width:84px}}
/* cobwebs in the top corners, under the nav */
.hw-web{position:absolute;top:70px;width:clamp(90px,10vw,150px);height:auto;color:rgba(255,255,255,.34)}
.hw-web-l{left:0}.hw-web-r{right:0}
html[data-theme="light"] .hw-web{color:rgba(40,20,60,.22)}
@media (max-width:640px){.hw-web{top:64px;width:78px}.hw-web-r{display:none}}
/* bats: one at a time, transform only */
.bat{position:absolute;left:0;width:calc(46px * var(--bs,1));color:#120818;animation:batFly 8s linear forwards;will-change:transform}
html[data-theme="light"] .bat{color:#2A1638}
.bat i{display:block;animation:batBob 1.6s ease-in-out infinite alternate}
.bat svg{display:block;width:100%;height:auto;animation:batFlap .22s steps(2,jump-none) infinite alternate;transform-origin:50% 40%}
.bat.rtl{animation-name:batFlyRtl}
@keyframes batFly{from{transform:translate3d(-80px,0,0)}to{transform:translate3d(calc(100vw + 80px),-60px,0)}}
@keyframes batFlyRtl{from{transform:translate3d(calc(100vw + 80px),0,0) scaleX(-1)}to{transform:translate3d(-80px,-50px,0) scaleX(-1)}}
@keyframes batBob{to{transform:translate3d(0,14px,0)}}
@keyframes batFlap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
.main.in-chat .sky-hw .bat{display:none}
@media (prefers-reduced-motion:reduce){.bat{display:none}}
/* bits of UI */
html[data-season="halloween"] .hx-dot{background:var(--hx-accent);box-shadow:0 0 0 4px var(--hx-accent-soft),0 0 12px 2px color-mix(in srgb,var(--hx-accent) 60%,transparent)}
.hx-hw-note{color:var(--hx-accent);font-weight:600}
html[data-season="halloween"] .hx-chip.hw-only svg{color:var(--hx-accent)}
html[data-season="halloween"][data-theme="dark"] .welcome .hx-title .l2{--hx-title2:#FFB677}
html[data-season="halloween"][data-theme="light"] .welcome .hx-title .l2{--hx-title2:#9A3412}
/* theme popover: season switch */
.tp-season{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:10px 12px;border:0;border-radius:14px;text-align:left;
  background:var(--hx-hover);color:var(--hx-ink);font:500 14px var(--hx-font);transition:background .2s}
.tp-season > svg{width:20px;height:20px;flex:none;color:var(--hx-accent)}
.tp-season span{flex:1;min-width:0}
.tp-season b{display:block;font:600 14px/1.2 var(--hx-font)}
.tp-season small{display:block;font-size:12px;color:var(--hx-ink3);margin-top:2px}
.tp-sw{position:relative;width:40px;height:24px;flex:none;border-radius:12px;background:var(--hx-line2);transition:background .25s}
.tp-sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.tp-season[aria-checked="true"]{background:var(--hx-accent-soft)}
.tp-season[aria-checked="true"] .tp-sw{background:var(--hx-accent)}
.tp-season[aria-checked="true"] .tp-sw::after{transform:translateX(16px)}
.ph-hw i,.tp-now.ph-hw::before{background:linear-gradient(135deg,#12081C,#4B1D6B 55%,#E8641B)}
.main.in-chat .sky-hw .hw-moon,.main.in-chat .sky-hw .hw-web{display:none}

/* =====================================================================
   Weather 🌤️
   ===================================================================== */
.hx-wx{display:inline-flex;align-items:center;gap:5px;margin-left:4px;padding:2px 8px 2px 6px;border:0;border-radius:10px;background:var(--hx-hover);
  color:var(--hx-ink);font:600 13.5px var(--hx-font);font-variant-numeric:tabular-nums;cursor:pointer}
.hx-wx[hidden]{display:none}
.hx-wx svg{width:16px;height:16px;color:var(--hx-accent)}
.hx-weather .hx-card-head h2{min-width:0}
.wx-place{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-weather .hx-card-head .hx-meta{margin-left:auto;white-space:nowrap}
.wx-refresh{width:32px;height:32px;margin:-6px -6px -6px 0;border-radius:10px;color:var(--hx-ink3)}
.wx-refresh svg{width:16px;height:16px}
.wx-refresh.spin svg{animation:wxSpin .8s linear infinite}
@keyframes wxSpin{to{transform:rotate(360deg)}}
.wx-setup{margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--hx-ink2)}
.wx-actions{display:flex;flex-wrap:wrap;gap:8px}
.wx-actions .btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:12px;font:600 13.5px var(--hx-font)}
.wx-actions .btn svg{width:16px;height:16px}
.wx-privacy{display:block;margin-top:10px;font-size:12px;line-height:1.45;color:var(--hx-ink3)}
.wx-cancel{margin-top:4px}
.wx-search{margin-top:12px}
.wx-search input{width:100%;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--hx-line2);background:var(--hx-bg);color:var(--hx-ink);font:400 15px var(--hx-font)}
.wx-results{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px;max-height:230px;overflow:auto}
.wx-results button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:none;color:var(--hx-ink);text-align:left}
.wx-results button:hover{background:var(--hx-hover)}
.wx-results svg{width:16px;height:16px;color:var(--hx-accent);flex:none}
.wx-results b{display:block;font:600 14px var(--hx-font)}
.wx-results small{display:block;font-size:12px;color:var(--hx-ink3)}
.wx-results .none{padding:8px 10px;font-size:13.5px;color:var(--hx-ink3)}
.wx-now{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.wx-ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--hx-accent-soft);color:var(--hx-accent)}
.wx-ic svg{width:28px;height:28px}
.wx-ic.wx-clear,.wx-ic.wx-mostly,.wx-ic.wx-partly{background:rgba(255,186,73,.18);color:#E39A12}
html[data-theme="dark"] .wx-ic.wx-clear,html[data-theme="dark"] .wx-ic.wx-mostly,html[data-theme="dark"] .wx-ic.wx-partly{color:#FFC861}
.wx-ic.wx-rain,.wx-ic.wx-drizzle,.wx-ic.wx-storm{background:rgba(70,140,230,.16);color:#3B82F6}
html[data-theme="dark"] .wx-ic.wx-rain,html[data-theme="dark"] .wx-ic.wx-drizzle,html[data-theme="dark"] .wx-ic.wx-storm{color:#7DB4FF}
.wx-temp{font:700 40px/1 var(--hx-font);letter-spacing:-.03em;color:var(--hx-ink);font-variant-numeric:tabular-nums}
.wx-temp sup{font-size:.4em;font-weight:600;vertical-align:1.15em;margin-left:2px;color:var(--hx-ink3)}
.wx-desc{min-width:0}
.wx-desc b{display:block;font:600 15px/1.25 var(--hx-font);color:var(--hx-ink)}
.wx-desc small{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--hx-ink3)}
.wx-tip{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:12px;background:var(--hx-hover);font-size:13.5px;line-height:1.45;color:var(--hx-ink2)}
.wx-tip svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--hx-accent)}
.wx-hours{list-style:none;display:flex;gap:4px;margin:12px -4px 0;padding:0 4px 4px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.wx-hours::-webkit-scrollbar{display:none}
.wx-hours li{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:12px}
.wx-hours li:first-child{background:var(--hx-hover)}
.wx-hours svg{width:19px;height:19px;color:var(--hx-ink2)}
.wh-t{font-size:12px;color:var(--hx-ink3);font-variant-numeric:tabular-nums}
.wx-hours b{font:600 14px var(--hx-font);color:var(--hx-ink)}
.wx-hours small{font-size:11px;font-weight:600;color:#3B82F6;min-height:13px}
html[data-theme="dark"] .wx-hours small{color:#7DB4FF}
.wx-hours small.dim{color:var(--hx-ink3);opacity:.6}
.wx-days{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:0}
.wx-days li{display:grid;grid-template-columns:minmax(64px,1fr) 22px 40px auto;align-items:center;gap:10px;padding:7px 2px;border-top:1px solid var(--hx-line);font-size:14px;color:var(--hx-ink)}
.wx-days svg{width:19px;height:19px;color:var(--hx-ink2)}
.wd-n{font-weight:500}
.wd-p{font-size:12px;font-weight:600;color:#3B82F6;text-align:right}
html[data-theme="dark"] .wd-p{color:#7DB4FF}
.wd-r{display:flex;gap:8px;justify-content:flex-end;font-variant-numeric:tabular-nums;min-width:66px}
.wd-r b{font-weight:600}.wd-r small{font-size:14px;color:var(--hx-ink3)}
.wx-foot{display:flex;justify-content:space-between;margin-top:8px}
.wx-skel{padding-left:0;margin-top:6px}
/* weather card inside chat (/cuaca) */
.wx-card{min-width:min(420px,100%)}
.wx-card-h{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:14px}
.wx-card-h svg{width:16px;height:16px;color:var(--hx-accent)}
/* settings */
.wx-loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--hx-hover)}
.wx-loc > svg{width:18px;height:18px;color:var(--hx-accent);flex:none}
.wx-loc b{display:block;font:600 14.5px var(--hx-font);color:var(--hx-ink)}
.wx-loc small{display:block;font-size:12.5px;color:var(--hx-ink3)}
/* phone: weather first in "For you" */
@media (max-width:900px){.hx-grid{display:flex;flex-direction:column;align-items:stretch}.hx-side{display:contents}.hx-weather{order:-1}.hx-grid > *,.hx-side > *{min-width:0;max-width:100%}}
/* the sky follows the weather (static veils, no animation) */
.sky-wx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease)}
html[data-wx] .sky.has-photo .sky-wx{opacity:1}
html[data-wx=""] .sky .sky-wx{opacity:0}
html[data-wx="cloud"] .sky-wx,html[data-wx="fog"] .sky-wx{background:linear-gradient(180deg,rgba(90,100,118,.38),rgba(90,100,118,.12) 70%)}
html[data-wx="fog"] .sky-wx{background:linear-gradient(180deg,rgba(200,205,212,.3),rgba(200,205,212,.45) 75%)}
html[data-wx="drizzle"] .sky-wx,html[data-wx="rain"] .sky-wx,html[data-wx="storm"] .sky-wx{
  background:repeating-linear-gradient(104deg,transparent 0 9px,rgba(220,230,245,.07) 9px 10px,transparent 10px 23px),linear-gradient(180deg,rgba(52,62,82,.5),rgba(52,62,82,.18) 75%)}
html[data-wx="storm"] .sky-wx{background:repeating-linear-gradient(104deg,transparent 0 8px,rgba(220,230,245,.09) 8px 9px,transparent 9px 19px),linear-gradient(180deg,rgba(28,30,52,.62),rgba(28,30,52,.25) 75%)}
html[data-wx="snow"] .sky-wx{background:linear-gradient(180deg,rgba(235,240,250,.3),rgba(235,240,250,.12))}
html.wp .sky-wx,html[data-season="halloween"] .sky-wx{display:none}

/* new Wayyuh AI mark in the remaining places */
.shell.home .who .dot{width:22px;height:22px;background:none;border:0;padding:0}
.who .dot .tile{width:22px;height:22px;border-radius:7px;box-shadow:none}
.sheet.about .tile{width:64px;height:64px;border-radius:16px}
.brand .tile{border-radius:8px}

/* =====================================================================
   Wayyuh AI 2.5
   ===================================================================== */
/* ---------- brand typography: Plus Jakarta Sans for display text ---------- */
:root{--hx-display:"Plus Jakarta Sans",var(--hx-font)}
.welcome .hx-title,.hx-brand span,.hx-section,.shell.home .lib-h,.sheet h2,.sheet .set-sec h3,.hx-card h2,.wx-temp,.ex-hero b,.fb-time,.pf-head b,.cc-head b,.splash-word,.shell.home .topbar .title,.off-txt b{font-family:var(--hx-display)}
.welcome .hx-title{letter-spacing:-.04em;font-weight:800}
.hx-brand span{font-weight:800;letter-spacing:-.03em}

/* ---------- living logo ---------- */
.shell.home .think-logo{width:24px;height:24px;flex:none}
.think-logo .tile{width:24px;height:24px;border-radius:7px;box-shadow:0 0 0 0 color-mix(in srgb,var(--hx-accent) 40%,transparent);animation:thinkGlow 1.8s ease-in-out infinite}
@keyframes thinkGlow{50%{box-shadow:0 0 14px 2px color-mix(in srgb,var(--hx-accent) 45%,transparent)}}
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;align-content:center;gap:16px;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 45%,#2B1F72 0%,#120C32 70%);animation:splashOut .45s ease .95s forwards}
.splash-mark .tile{width:112px;height:112px;border-radius:26px;box-shadow:0 30px 80px -20px rgba(120,90,255,.7);animation:splashPop .7s cubic-bezier(.34,1.4,.64,1) backwards}
.splash-word{color:#fff;font-size:26px;font-weight:800;letter-spacing:-.03em;animation:splashWord .6s cubic-bezier(.16,1,.3,1) .35s backwards}
@keyframes splashPop{from{transform:scale(.7);opacity:0}}
@keyframes splashWord{from{opacity:0;transform:translateY(8px)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* ---------- seasons: generic bits ---------- */
html[data-season]:not([data-season=""]) .hw-only{display:inline-flex}
html[data-season="halloween"] .hw-only{display:inline-flex}
.sky-ss{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.main.in-chat .sky-ss{display:none}
.ph-ss-natal i,.tp-now.ph-ss-natal::before{background:linear-gradient(135deg,#0B2A1F,#1E6B45 55%,#C93A3A)}
.ph-ss-tahunbaru i,.tp-now.ph-ss-tahunbaru::before{background:linear-gradient(135deg,#0B0C1E,#2B2F7A 55%,#C9A7FF)}
.ph-ss-merdeka i,.tp-now.ph-ss-merdeka::before{background:linear-gradient(135deg,#B3122B,#E2334B 50%,#F3F3F3)}
.ph-ss-ramadan i,.tp-now.ph-ss-ramadan::before{background:linear-gradient(135deg,#06302E,#0F766E 55%,#E0A93B)}
.ph-ss-halloween i,.tp-now.ph-ss-halloween::before{background:linear-gradient(135deg,#12081C,#4B1D6B 55%,#E8641B)}
.tp-season:disabled{opacity:.55;cursor:default}
/* Christmas */
html[data-season="natal"][data-theme="light"]{--hx-accent:#1E7A46;--hx-accent-ink:#fff;--hx-accent-soft:rgba(30,122,70,.11);--tl0:#0B2A1F;--tl1:#1E6B45;--tl2:#C93A3A;--tl3:#FFD27A;--tls0:#FFFFFF;--tls1:#FFE3A3;--tls2:#F0B24A}
html[data-season="natal"][data-theme="dark"]{--hx-accent:#7EE0A1;--hx-accent-ink:#0B1A12;--hx-accent-soft:rgba(126,224,161,.14);--tl0:#0B2A1F;--tl1:#1E6B45;--tl2:#C93A3A;--tl3:#FFD27A;--tls0:#FFFFFF;--tls1:#FFE3A3;--tls2:#F0B24A}
.flake{position:absolute;top:-12px;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.85;box-shadow:0 0 6px rgba(255,255,255,.6);
  animation:snow var(--d) linear var(--dl) infinite;will-change:transform}
@keyframes snow{from{transform:translate3d(0,-2vh,0)}to{transform:translate3d(var(--dx),104vh,0)}}
/* New Year */
html[data-season="tahunbaru"][data-theme="dark"]{--hx-accent:#FFD166;--hx-accent-ink:#1A1405;--hx-accent-soft:rgba(255,209,102,.15);--tl0:#0B0C1E;--tl1:#2B2F7A;--tl2:#C9A7FF;--tl3:#FFD166;--tls0:#FFFFFF;--tls1:#FFE7A8;--tls2:#FFC24D}
html[data-season="tahunbaru"][data-theme="light"]{--hx-accent:#8A5A00;--hx-accent-ink:#fff;--hx-accent-soft:rgba(138,90,0,.1)}
.fw{position:absolute;width:0;height:0}
.fw i{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);
  animation:fwBurst 1.3s cubic-bezier(.12,.8,.3,1) forwards;transform:rotate(var(--a)) translateY(0)}
@keyframes fwBurst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateY(-110px) scale(.4);opacity:0}}
/* Independence Day */
html[data-season="merdeka"][data-theme="light"]{--hx-accent:#C8102E;--hx-accent-ink:#fff;--hx-accent-soft:rgba(200,16,46,.1);--tl0:#7A0C1C;--tl1:#C8102E;--tl2:#F4F4F4;--tl3:#FFFFFF;--tls0:#FFFFFF;--tls1:#FFFFFF;--tls2:#F1D3D7}
html[data-season="merdeka"][data-theme="dark"]{--hx-accent:#FF5A6E;--hx-accent-ink:#22060B;--hx-accent-soft:rgba(255,90,110,.15);--tl0:#7A0C1C;--tl1:#C8102E;--tl2:#F4F4F4;--tl3:#FFFFFF;--tls0:#FFFFFF;--tls1:#FFFFFF;--tls2:#F1D3D7}
.ss-bunting{position:absolute;left:0;right:0;top:74px;width:100%;height:clamp(40px,6vw,72px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
/* Ramadan */
html[data-season="ramadan"][data-theme="light"]{--hx-accent:#0F766E;--hx-accent-ink:#fff;--hx-accent-soft:rgba(15,118,110,.1);--tl0:#06302E;--tl1:#0F766E;--tl2:#E0A93B;--tl3:#FFE6A8;--tls0:#FFFFFF;--tls1:#FFE6A8;--tls2:#E0A93B}
html[data-season="ramadan"][data-theme="dark"]{--hx-accent:#F5C66B;--hx-accent-ink:#1C1405;--hx-accent-soft:rgba(245,198,107,.15);--tl0:#06302E;--tl1:#0F766E;--tl2:#E0A93B;--tl3:#FFE6A8;--tls0:#FFFFFF;--tls1:#FFE6A8;--tls2:#E0A93B}
.ss-crescent{position:absolute;right:13%;top:14%;width:clamp(60px,7vw,110px);aspect-ratio:1;border-radius:50%;box-shadow:16px -8px 0 0 #FFE6A8;filter:drop-shadow(0 0 18px rgba(255,220,140,.55));transform:rotate(-20deg)}
html[data-theme="light"] .ss-crescent{opacity:.6}
.ss-lanterns{position:absolute;left:5%;top:58px;display:flex;gap:clamp(14px,3vw,40px)}
.ss-lanterns span{display:block;width:clamp(26px,3vw,40px);transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px rgba(255,200,110,.55))}
.ss-lanterns span:nth-child(2){animation-delay:-1.4s;margin-top:18px}.ss-lanterns span:nth-child(3){animation-delay:-2.6s}
.ss-lanterns svg{display:block;width:100%;height:auto}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media (max-width:640px){.ss-lanterns{left:3%;top:62px}.ss-lanterns span:nth-child(3){display:none}.ss-crescent{right:7%;top:10%}}
@media (prefers-reduced-motion:reduce){.ss-lanterns span,.flake,.fw{animation:none}}

/* ---------- emoji per chat ---------- */
.hx-row-ic.emo{font-size:19px;line-height:1;background:var(--hx-hover)}

/* ---------- long answers ---------- */
.toc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;padding-left:30px}
.toc-h{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--hx-font);color:var(--hx-ink3);margin-right:2px}
.toc-h svg{width:15px;height:15px}
.toc button{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--hx-line2);background:var(--hx-card);color:var(--hx-ink2);font:500 12.5px var(--hx-font);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc button:hover{color:var(--hx-ink);border-color:color-mix(in srgb,var(--hx-accent) 40%,transparent)}
.toc .toc-fold{display:inline-flex;align-items:center;gap:5px;color:var(--hx-accent);margin-left:auto}
.toc .toc-fold svg{width:14px;height:14px}
.msg.ai.folded .body{max-height:340px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
@media (max-width:640px){.toc{padding-left:0}}

/* ---------- reactions + small delights ---------- */
.react-chip{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:30px;margin:6px 0 0 30px;padding:0 9px;border-radius:15px;
  border:1px solid var(--hx-line2);background:var(--hx-card);font-size:16px;line-height:1;box-shadow:var(--hx-shadow)}
.react-chip.pop{animation:reactPop .45s cubic-bezier(.34,1.6,.64,1)}
@keyframes reactPop{from{transform:scale(.4)}}
.react-pop{display:flex;gap:2px;padding:6px;border-radius:24px}
.react-pop button{width:40px;height:40px;border:0;border-radius:20px;background:none;font-size:22px;line-height:1;transition:transform .25s var(--spring),background .2s}
.react-pop button:hover,.react-pop button:focus-visible{transform:scale(1.22) translateY(-3px);background:var(--hx-hover)}
.react-pop button.on{background:var(--hx-accent-soft)}
@media (max-width:640px){.react-chip{margin-left:0}}
.icon-btn.copied{color:#1F9D55!important}
html[data-theme="dark"] .icon-btn.copied{color:#6EE7A0!important}
.icon-btn.copied svg{animation:reactPop .4s cubic-bezier(.34,1.6,.64,1)}
.msg-actions .icon-btn[aria-pressed="true"] svg{animation:reactPop .45s cubic-bezier(.34,1.6,.64,1)}
.shell.home .send svg{transition:transform .35s var(--spring)}
.shell.home .send.stop svg{animation:sendMorph .4s cubic-bezier(.34,1.5,.64,1)}
@keyframes sendMorph{from{transform:rotate(-90deg) scale(.4)}}

/* ---------- parallax: the sky layer is a little taller so it can move ---------- */
.sky{will-change:transform;bottom:-80px!important;top:-12px!important;left:-12px!important;right:-12px!important;transition:transform .5s cubic-bezier(.16,1,.3,1)}
@media (prefers-reduced-motion:reduce){.sky{transition:none}}

/* ---------- Explore, App Store style ---------- */
.ex-hero{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;margin:2px 0 14px;padding:20px 22px;border:0;border-radius:22px;text-align:left;overflow:hidden;
  color:#fff;background:linear-gradient(135deg,var(--tl0,#1D1452),var(--tl1,#5B41D4) 60%,var(--tl2,#F39AB4));box-shadow:0 18px 40px -22px rgba(60,40,160,.7)}
.ex-hero-k{font:700 11.5px var(--hx-font);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.ex-hero b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ex-hero > span:not(.ex-hero-art){max-width:70%;font-size:14px;line-height:1.45;opacity:.92}
.ex-hero-go{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.2);font:600 13px var(--hx-font)}
.ex-hero-go svg{width:15px;height:15px}

/* ===================== Wayyuh Pulse · identity layer =====================
   Emerald + amber on ink (dark) or mint paper (light). Pill shapes, a living mesh background,
   a cursor spotlight, a spinning focus ring on the composer and spotlight cards. Pure CSS plus a few
   lines of pointer tracking. Everything animated is disabled under prefers-reduced-motion. */
@property --wy-a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--wy-display:"Bricolage Grotesque","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;--wy-body:"DM Sans","Inter",ui-sans-serif,system-ui,sans-serif;--mx:50vw;--my:30vh;
  --hx-font:var(--wy-body);--hx-display:var(--wy-display)}
html:root[data-theme="light"]{
  --hx-bg:#F1F6F0;--hx-ink:#0B1A13;--hx-ink2:#364A3F;--hx-ink3:#6A7D71;
  --hx-line:rgba(11,26,19,.09);--hx-line2:rgba(11,26,19,.16);
  --hx-glass:rgba(255,255,255,.72);--hx-glass-strong:rgba(255,255,255,.92);--hx-card:rgba(255,255,255,.8);--hx-solid:#FFFFFF;
  --hx-hover:rgba(11,26,19,.05);--hx-press:rgba(11,26,19,.09);
  --hx-accent:#0A8F62;--hx-accent-ink:#FFFFFF;--hx-accent-soft:rgba(10,143,98,.11);
  --hx-grad:linear-gradient(95deg,#0A8F62 0%,#5FB233 52%,#E39A0B 100%);
  --hx-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 12px 30px -18px rgba(11,60,40,.28);
  --hx-shadow-lg:0 2px 6px rgba(11,26,19,.06),0 32px 70px -30px rgba(11,60,40,.38);
  --hx-veil:linear-gradient(180deg,rgba(241,246,240,.55),rgba(241,246,240,.86));
  --wy-m1:rgba(46,204,140,.34);--wy-m2:rgba(255,196,70,.30);--wy-m3:rgba(70,170,210,.22);--wy-dot:rgba(11,26,19,.13);
  --tl0:#0B3D2E;--tl1:#0A8F62;--tl3:#B6F35A}
html:root[data-theme="dark"]{
  --hx-bg:#060C0A;--hx-ink:#EAF5EE;--hx-ink2:rgba(224,240,231,.78);--hx-ink3:rgba(184,208,194,.55);
  --hx-line:rgba(190,255,225,.08);--hx-line2:rgba(190,255,225,.15);
  --hx-glass:rgba(14,26,21,.62);--hx-glass-strong:rgba(14,26,21,.9);--hx-card:rgba(14,26,21,.66);--hx-solid:#0D1814;
  --hx-hover:rgba(190,255,225,.07);--hx-press:rgba(190,255,225,.12);
  --hx-accent:#4DEFB0;--hx-accent-ink:#04140D;--hx-accent-soft:rgba(77,239,176,.13);
  --hx-grad:linear-gradient(95deg,#4DEFB0 0%,#B6F25A 52%,#FFC857 100%);
  --hx-shadow:0 1px 0 rgba(190,255,225,.05) inset,0 16px 40px -20px rgba(0,0,0,.75);
  --hx-shadow-lg:0 2px 8px rgba(0,0,0,.4),0 36px 80px -30px rgba(0,0,0,.85);
  --hx-veil:linear-gradient(180deg,rgba(6,12,10,.42),rgba(6,12,10,.8));
  --wy-m1:rgba(32,201,135,.30);--wy-m2:rgba(255,184,64,.16);--wy-m3:rgba(40,140,200,.22);--wy-dot:rgba(190,255,225,.13);
  --tl0:#052A1F;--tl1:#0E9F6E;--tl3:#B6F35A}
html:root[data-theme] body,html:root[data-theme] .shell.home .main{background:var(--hx-bg)}

/* ---- living background: drifting mesh + dot grid + cursor spotlight (replaces the sky scene) ---- */
.sky:not(.has-photo){background:var(--hx-bg)}
.sky:not(.has-photo) > :not(.sky-hw){display:none!important}
.sky:not(.has-photo)::before{content:"";position:absolute;inset:-25%;
  background:radial-gradient(38% 34% at 22% 26%,var(--wy-m1),transparent 70%),radial-gradient(34% 32% at 78% 22%,var(--wy-m2),transparent 70%),
    radial-gradient(40% 36% at 62% 82%,var(--wy-m3),transparent 70%);
  animation:wyDrift 26s ease-in-out infinite alternate;will-change:transform}
.sky:not(.has-photo)::after{content:"";position:absolute;inset:0;
  background:radial-gradient(520px circle at var(--mx) var(--my),var(--hx-accent-soft),transparent 70%),radial-gradient(var(--wy-dot) 1px,transparent 1.3px) 0 0/26px 26px;
  -webkit-mask-image:radial-gradient(75% 65% at 50% 38%,#000 30%,transparent 100%);mask-image:radial-gradient(75% 65% at 50% 38%,#000 30%,transparent 100%)}
@keyframes wyDrift{0%{transform:translate3d(-3%,-2%,0) rotate(0deg) scale(1)}50%{transform:translate3d(3%,2%,0) rotate(6deg) scale(1.08)}100%{transform:translate3d(-2%,4%,0) rotate(-5deg) scale(1.02)}}

/* ---- nav: a slim floating pill ---- */
.hx-nav{width:min(920px,calc(100% - 24px));height:56px;border-radius:999px;padding:0 8px 0 10px;
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-color:var(--hx-line2)}
.hx-brand{border-radius:999px}
.hx-brand span{font-family:var(--wy-display);font-weight:700;font-size:18px;letter-spacing:-.025em}
.hx-link{border-radius:999px;position:relative;font-weight:600}
.hx-link::after{content:"";position:absolute;left:50%;bottom:5px;width:0;height:2px;border-radius:2px;background:var(--hx-grad);transform:translateX(-50%);transition:width .3s var(--ease)}
.hx-link:hover::after{width:46%}
.hx-icon{border-radius:50%}
.hx-icon:hover{transform:rotate(-8deg) scale(1.06)}

/* ---- hero ---- */
.hx-greet{padding:6px 14px 6px 12px;border-radius:999px;background:var(--hx-glass);border:1px solid var(--hx-line);font-weight:600;font-size:14px}
.hx-dot{position:relative;background:var(--hx-accent)}
.hx-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--hx-accent);opacity:0;animation:wyPing 2.4s ease-out infinite}
@keyframes wyPing{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.welcome .hx-title{font-family:var(--wy-display);font-weight:800;letter-spacing:-.045em;line-height:1.02;font-size:clamp(40px,6.4vw,76px)}
.hx-title .l1{display:inline-block;animation:wyRise .8s var(--spring) backwards}
html .welcome .hx-title .l2{display:inline-block;background:var(--hx-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:none;animation:wyRise .8s var(--spring) .12s backwards,wyShine 7s linear 1s infinite}
@keyframes wyShine{to{background-position:-220% 0}}
@keyframes wyRise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}}
.hx-chip{border-radius:999px;height:42px;font-weight:600;background:var(--hx-glass);animation:wyRise .7s var(--spring) backwards;
  position:relative;overflow:hidden;isolation:isolate}
.hx-quick .hx-chip:nth-child(1){animation-delay:.25s}.hx-quick .hx-chip:nth-child(2){animation-delay:.32s}
.hx-quick .hx-chip:nth-child(3){animation-delay:.39s}.hx-quick .hx-chip:nth-child(4){animation-delay:.46s}.hx-quick .hx-chip:nth-child(5){animation-delay:.53s}
.hx-chip::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--hx-grad);opacity:0;transition:opacity .25s}
.hx-chip:hover{background:var(--hx-glass-strong);border-color:transparent;color:var(--hx-accent-ink);transform:translateY(-3px) rotate(-1deg)}
.hx-chip:hover::before{opacity:1}.hx-chip:hover svg{color:inherit}

/* ---- composer: glass + a conic ring that spins while focused ---- */

function titleFrom(text){
  let s = String(text || "").trim().replace(/\s+/g, " ");
  const m = s.match(/^\/(\S+)\s*(.*)$/);
  if (m) s = m[2] ? cap1(m[1]) + ": " + m[2] : cap1(m[1]);
  return s.length > 56 ? s.slice(0, 54).trimEnd() + "…" : (s || t("untitled"));
}
function saveChats(){
  let ids = Object.keys(chats).sort((a, b) => chats[b].updated - chats[a].updated);
  for (const id of ids.slice(LIMITS.chats)) if (id !== currentId) delete chats[id];
  for (const c of Object.values(chats)) if (c.messages.length > LIMITS.msgsPerChat) c.messages = c.messages.slice(-LIMITS.msgsPerChat);
  const clean = JSON.stringify(chats, (k, v) => k.startsWith("_") ? undefined : v);
  for (let tries = 0; tries < 40; tries++){
    try{ localStorage.setItem("wayyuh.chats", tries ? JSON.stringify(chats, (k, v) => k.startsWith("_") ? undefined : v) : clean); return true; }
    catch(e){
      const quota = e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22);
      if (!quota) return false;
      ids = Object.keys(chats).sort((a, b) => chats[a].updated - chats[b].updated);
      const victim = ids.find(id => id !== currentId);
      if (!victim) return false;
      delete chats[victim];
    }
  }
  return false;
}
const saveProjects = () => { store.set("projects", projects); store.set("activeProject", activeProject); };
function cur(){ return currentId ? chats[currentId] : null; }
function ensureChat(firstText){
  if (!cur()){
    currentId = uid();
    chats[currentId] = { id: currentId, title: titleFrom(firstText), localTitle: /^\//.test(String(firstText)), created: Date.now(), updated: Date.now(),
      projectId: activeProject || null, messages: [] };
    store.set("current", currentId);
  }
  return cur();
}
function log(entry){
  if (rendering) return entry;
  const c = ensureChat(entry.role === "user" ? entry.content : t("untitled"));
  if (c.localTitle && entry.role === "user" && !/^\//.test(entry.content)){ c.title = titleFrom(entry.content); c.localTitle = false; }
  entry.id = entry.id || uid();
  entry.at = Date.now();
  c.messages.push(entry); c.updated = Date.now();
  saveChats();
  onChatsChanged();
  return entry;
}

function addMemory(text, src){
  text = String(text).trim().replace(/\s+/g, " ").replace(/[.。]+$/, "");
  if (text.length < 2) return false;
  const low = text.toLowerCase();
  if (memories.some(m => m.text.toLowerCase() === low)) return false;
  memories.push({ id: uid(), text: text.slice(0, 300), at: Date.now(), src: src || "manual" });
  if (memories.length > LIMITS.memories) memories = memories.slice(-LIMITS.memories);
  store.set("memories", memories); updateMemCount();
  return true;
}
function removeMemory(id){ memories = memories.filter(m => m.id !== id); store.set("memories", memories); updateMemCount(); }
function updateMemCount(){ const el = document.getElementById("memCount"); if (el) el.textContent = memories.length; if (typeof renderMemCard === "function") renderMemCard(); }
function extractMemories(text){
  const found = [];
  const clean = text.replace(/[ \t]*\[(?:INGAT|REMEMBER):\s*([^\]\n]+)\]/gi, (_, f) => { found.push(f.trim()); return ""; })
    .replace(/\n{3,}/g, "\n\n").trim();
  return { clean, found };
}
const stripMemTags = s => s.replace(/\[(?:INGAT|REMEMBER):[^\]\n]*\]?/gi, "").trimEnd();

function contextBlock({ compact = false, digest = "" } = {}){
  const d = new Date();

    `Kamu Wayyuh AI, diciptakan dan dikembangkan oleh ${CREATOR}, ditenagai ${POWERED}; bicarakan mereka dengan hormat.`];
  if (cfg.lang === "en") lines.push("The user chose English for the app interface; reply in the language the user writes in.");
  if (cfg.aiName && !/^(wayyuh( ai)?|sunday)$/i.test(cfg.aiName.trim())) lines.push(`Pengguna memanggilmu "${cfg.aiName}". Pakai nama itu saat menyebut dirimu.`);
  const tone = { santai: "Gaya bicara: santai dan akrab, seperti teman.", sopan: "Gaya bicara: sopan dan rapi.", ceria: "Gaya bicara: ceria dan bersemangat, boleh sedikit emoji." }[cfg.tone];
  if (tone) lines.push(tone);
  if (cfg.len === "singkat") lines.push("Panjang jawaban: sesingkat mungkin, langsung ke inti.");
  if (cfg.len === "detail") lines.push("Panjang jawaban: lengkap dan rinci, beri contoh bila membantu.");
  lines.push("Tulis rumus matematika/sains dengan LaTeX: $...$ di dalam kalimat, $$...$$ untuk rumus di baris sendiri. Jangan pakai $ untuk mata uang (tulis USD/Rp).");
  if (cfg.guru) lines.push("MODE GURU AKTIF: jangan langsung memberi jawaban akhir soal/PR. Bimbing langkah demi langkah dengan pertanyaan pancingan dan petunjuk kecil, satu langkah per balasan, cek pemahaman pengguna, dan beri pujian saat benar. Baru beri jawaban lengkap bila pengguna sudah mencoba dan memintanya lagi, atau bila pertanyaannya bukan soal latihan.");
  { const w = typeof wxContext === "function" ? wxContext() : ""; if (w) lines.push(w); }
  if (seasonInfo()) lines.push(seasonInfo().ai);
  if (cfg.custom && cfg.custom.trim()) lines.push("Instruksi khusus dari pengguna (ikuti selama aman):\n" + cfg.custom.trim().slice(0, compact ? 600 : 1500));
  if (digest) lines.push("Topik sebelumnya di percakapan ini (bagian lama yang tidak ikut dikirim): " + digest);
  if (cfg.name){
    lines.push(`Nama panggilan pengguna: ${cfg.name}`);
  }
  const mem = compact ? memories.slice(-25) : memories.slice(-150);
  if (mem.length){ lines.push("Hal yang kamu ingat tentang pengguna:"); for (const m of mem) lines.push("- " + m.text); }
  if (memAuto) lines.push("Jika pengguna menyebut fakta baru yang penting dan tahan lama tentang dirinya, tulis di baris paling akhir jawabanmu: [INGAT: fakta singkat]. Jangan tulis baris itu bila tidak ada fakta baru.");
  lines.push("[Akhir konteks]");
  return lines.join("\n");
}

function phaseAt(h){ return h >= 6 && h < 10 ? "pagi" : h >= 10 && h < 16 ? "siang" : h >= 16 && h < 19 ? "sore" : "malam"; }

function applyThemeVars(){
  const ph = currentPhase(), root = document.documentElement;
  root.dataset.theme = PHASES[ph].mode; root.dataset.phase = ph;
  root.dataset.accent = cfg.accent; root.dataset.season = seasonKey();
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = seasonInfo() && PHASES[ph].mode === "dark" ? seasonInfo().bar : PHASES[ph].bar;
  return ph;
}
applyThemeVars();
/* Theme changes use a View Transition: a circle that grows from the button pressed (origin {x, y}),
   or a short crossfade. Browsers without it switch at once. true = no animation. */
function applyTheme(origin){
  const run = () => { applyThemeVars(); onThemeChanged(); };
  if (origin === true || reduced || !document.startViewTransition || document.hidden){ run(); return; }
  const root = document.documentElement, circle = origin && typeof origin === "object";
  root.classList.add(circle ? "vt-circle" : "vt-fade");
  const vt = document.startViewTransition(run);
  if (circle){
    const r = Math.hypot(Math.max(origin.x, innerWidth - origin.x), Math.max(origin.y, innerHeight - origin.y));
    vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${origin.x}px ${origin.y}px)`, `circle(${r}px at ${origin.x}px ${origin.y}px)`] },
      { duration: 700, easing: "cubic-bezier(.65,0,.35,1)", pseudoElement: "::view-transition-new(root)" })).catch(() => {});
  }
  vt.finished.finally(() => root.classList.remove("vt-circle", "vt-fade"));
}
try{ sysDark.addEventListener("change", () => { if (cfg.theme === "system") applyTheme(); }); }catch(e){}
function setTheme(v, origin){ if (!THEMES.includes(v)) return; cfg.theme = v; saveCfg(); applyTheme(origin); }
function setSeason(v, origin){ if (!["auto", "off", ...SEASON_KEYS].includes(v)) return; cfg.season = v; saveCfg(); applyTheme(origin || false); }

function toast(text, kind){
  const el = document.createElement("div"); el.className = "toast" + (kind === "err" ? " err" : "");
  el.setAttribute("role", "status"); el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2300);

function copyText(text){
  const done = () => toast(t("copied"));
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast(text.slice(0, 40)); }
    ta.remove();
  };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(e){ fallback(); }
}
function download(filename, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ================= markdown ================= */
const SAFE_URL = /^(https?:\/\/|mailto:)/i;
function mdInline(text){
  const codes = [];
  let s = String(text).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0001${codes.length - 1}\u0001`; });
  let h = esc(s);
  h = h.replace(/!?\[([^\]\n]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, label, url) => {
    const u = url.replace(/&amp;/g, "&");
    return SAFE_URL.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${label}</a>` : label;
  });
  h = h.replace(/(^|[\s(（])(https?:\/\/[^\s<]+[^\s<.,:;!?)\]'"”’])/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  h = h.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+?)__/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*\w])\*(?![\s*])([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>");
  h = h.replace(/(^|[^_\w])_(?![\s_])([^_\n]+?)_(?!\w)/g, "$1<em>$2</em>");
  h = h.replace(/~~([^~\n]+?)~~/g, "<del>$1</del>");

function linkSignals(...signals){

    if (!s) continue;
    if (s.aborted){ c.abort(); break; }
    s.addEventListener("abort", () => c.abort(), { once: true });

}
function pickText(data){

    data.data && (data.data.reply || data.data.text || data.data.content),
    data.choices && data.choices[0] && (data.choices[0].message ? data.choices[0].message.content : data.choices[0].text),
    data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p => p.text).join("")];

}
function errorFromStatus(status, data){
  if (status === 429) return new WayyuhError("busy", (data && data.error) || t("errBusy"), { status });
  if (status === 413) return new WayyuhError("tooLong", (data && data.error) || t("errTooLong", { max: (caps.maxMessage || 4000).toLocaleString(locale()) }));
  if (status === 400 && data && data.error) return new WayyuhError("bad", data.error);
  return new WayyuhError("server", (data && data.error) || t("errServer", { code: status }), { details: data && (data.details || data.error), status });
}
// Sends one request. While streaming, onDelta(textSoFar) is called. Resolves {text, meta}.
async function requestAI(body, { signal, onDelta, timeout = 60000 } = {}){
  if (!navigator.onLine) throw new WayyuhError("offline", t("errOffline"));
  const ctrl = new AbortController();
  let timer = setTimeout(() => ctrl.abort(), timeout);
  const bump = () => { clearTimeout(timer); timer = setTimeout(() => ctrl.abort(), 45000); };
  const sig = linkSignals(signal, ctrl.signal);
  const why = (partial) => signal && signal.aborted ? new WayyuhError("aborted", "aborted", { partial })
    : ctrl.signal.aborted ? new WayyuhError("timeout", t("errTimeout"), { partial }) : new WayyuhError("net", t("errNet"), { partial });
  let res;
  try{ res = await fetch(SERVER_URL, { method: "POST", headers: reqHeaders(), body: JSON.stringify(body), signal: sig }); }
  catch(e){ clearTimeout(timer); throw why(""); }
  if (!res.ok){
    clearTimeout(timer);
    const data = await res.json().catch(() => null);
    console.warn("[Wayyuh AI] server", res.status, data && data.error);
    throw errorFromStatus(res.status, data);
  }
  const ctype = res.headers.get("content-type") || "";
  let text = "", meta = {};
  if (ctype.includes("text/event-stream") && res.body){
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    sig.addEventListener("abort", () => { try{ reader.cancel(); }catch(e){} }, { once: true });
    try{
      for (;;){
        const { value, done } = await reader.read();
        if (done) break;
        bump();
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
          if (!line.startsWith("data:")) continue;
          const d = line.slice(5).trim(); if (!d || d === "[DONE]") continue;
          let j; try{ j = JSON.parse(d); }catch(e){ continue; }
          if (typeof j.t === "string"){ text += j.t; onDelta && onDelta(text); }
          else if (j.error) throw new WayyuhError("stream", j.error, { partial: text });
          else if (j.done) meta = j;
          else {
            const piece = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || (j.delta && j.delta.text) || j.text || "";
            if (piece){ text += piece; onDelta && onDelta(text); }
          }
        }
      }
    }catch(e){
      clearTimeout(timer);
      if (e instanceof WayyuhError && e.kind === "stream") throw e;
      throw why(text);
    }
    clearTimeout(timer);
    if (signal && signal.aborted) throw new WayyuhError("aborted", "aborted", { partial: text });
    return { text, meta };
  }
  let raw;
  try{ raw = await res.text(); }catch(e){ clearTimeout(timer); throw why(""); }
  clearTimeout(timer);
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return { text: raw, meta }; }
  if (data && (data.soal || data.questions)) return { text: JSON.stringify(data), meta };
  text = pickText(data);
  if (!text && data && data.error) throw new WayyuhError("server", data.error);
  return { text, meta: data || {} };
}
// body for a chat turn, shaped for the server version
function buildBody({ prompt, history, files = [], mode = "chat", search = false, digest = "" }){
  if (v2()){
    return { message: prompt, history, context: contextBlock({ digest }), mode, model: cfg.model, search: !!(search && caps.search), stream: !!caps.stream,
      files: files.map(f => ({ mime: f.mime, data: f.b64 })) };
  }

  const max = caps.maxMessage || 4000;

  let ctx = contextBlock({ compact: true, digest: digest.slice(0, 300) });
  if (ctx.length + prompt.length + 4 > max) ctx = ctx.split("\n").filter(l => !l.startsWith("- ")).join("\n");
  if (ctx.length + prompt.length + 4 > max) ctx = "";

}

function olderDigest(chat, entryId, sent){

// retries a request once or twice on network trouble, overload or server errors, but only if no text has arrived yet
async function requestWithRetry(body, opts, onRetry){
  for (let attempt = 0; ; attempt++){
    try{ return await requestAI(body, opts); }
    catch(e){
      const retryable = (e.kind === "net" || e.kind === "busy" || (e.kind === "server" && (!e.status || e.status >= 500))) && !(e.partial && e.partial.trim());
      if (!retryable || attempt >= 2 || (opts.signal && opts.signal.aborted)) throw e;
      if (onRetry) onRetry(attempt + 1);

        if (opts.signal) opts.signal.addEventListener("abort", () => { clearTimeout(tm); rej(new WayyuhError("aborted", "aborted", { partial: "" })); }, { once: true });
      });

function historyBefore(chat, entryId){
  const msgs = chat ? chat.messages : [];

  const list = (end < 0 ? msgs : msgs.slice(0, end)).filter(m => (m.role === "user" && !m.local && !m.failed) || (m.role === "assistant" && m.content));
  const out = []; let chars = 0;
  for (let i = list.length - 1; i >= 0 && out.length < LIMITS.ctxMsgs; i--){
    const m = list[i], content = String(m.prompt || m.content);
    chars += content.length;

  }

}

// calculator: recursive descent, no eval
function calc(expr){
  const s = expr.replace(/×/g, "*").replace(/÷/g, "/").replace(/,/g, ".").replace(/\s+/g, "");
  let i = 0;
  const peek = () => s[i];
  function num(){
    if (peek() === "("){ i++; const v = add(); if (s[i++] !== ")") throw 0; return v; }
    const fn = s.slice(i).match(/^(akar|sqrt|sin|cos|tan|log|ln|pi|π)/);
    if (fn){
      i += fn[0].length;
      if (fn[0] === "pi" || fn[0] === "π") return Math.PI;
      const v = num();
      return { akar: Math.sqrt, sqrt: Math.sqrt, sin: x => Math.sin(x * Math.PI / 180), cos: x => Math.cos(x * Math.PI / 180), tan: x => Math.tan(x * Math.PI / 180), log: Math.log10, ln: Math.log }[fn[0]](v);
    }
    const m = s.slice(i).match(/^\d*\.?\d+(e[+-]?\d+)?/i);
    if (!m) throw 0;
    i += m[0].length; let v = parseFloat(m[0]);
    if (peek() === "%"){ i++; v /= 100; }
    return v;
  }
  function unary(){ if (peek() === "-"){ i++; return -unary(); } if (peek() === "+"){ i++; return unary(); } return pow(); }
  function pow(){ const b = num(); if (peek() === "^"){ i++; return Math.pow(b, unary()); } return b; }
  function mul(){ let v = unary(); while (peek() === "*" || peek() === "/"){ const op = s[i++]; const r = unary(); v = op === "*" ? v * r : v / r; } return v; }
  function add(){ let v = mul(); while (peek() === "+" || peek() === "-"){ const op = s[i++]; const r = mul(); v = op === "+" ? v + r : v - r; } return v; }
  const v = add();
  if (i !== s.length || !isFinite(v)) throw 0;
  return v;
}

/* ---- tolerant quiz reader: JSON, broken/cut-off JSON, or plain text ---- */
function normItem(x){
  if (!x || typeof x !== "object") return null;
  const rawOpts = x.pilihan || x.options || x.choices || x.opsi || x.jawaban_pilihan;
  let options = [];
  if (Array.isArray(rawOpts)) options = rawOpts.map(o => String(o && typeof o === "object" ? (o.text || o.teks || Object.values(o)[0] || "") : o));
  else if (rawOpts && typeof rawOpts === "object") options = Object.keys(rawOpts).sort().map(k => String(rawOpts[k]));
  options = options.map(o => o.replace(/^\s*\(?[A-Da-d]\s*[.):]\s+/, "").trim()).filter(Boolean);
  let ans = x.jawaban ?? x.answer ?? x.correct ?? x.correct_index ?? x.correctIndex ?? x.kunci ?? x.jawaban_benar;
  if (typeof ans === "string"){
    const s = ans.trim();
    if (/^\(?[A-Da-d]\)?(?:[.):\s].*)?$/.test(s)) ans = s.replace(/^\(/, "").toUpperCase().charCodeAt(0) - 65;
    else if (/^\d+$/.test(s)) ans = +s;
    else ans = options.findIndex(o => o.toLowerCase() === s.toLowerCase());
  }
  const q = String(x.pertanyaan || x.question || x.soal || x.q || "").trim();
  if (!q || options.length < 2 || !Number.isInteger(ans) || ans < 0 || ans >= options.length) return null;
  return { q, options, answer: ans, hint: String(x.petunjuk || x.hint || "").trim(), explain: String(x.penjelasan || x.explanation || x.pembahasan || "").trim() };
}
function balancedChunks(t, open, close){
  // every balanced {…} or […] block, ignoring brackets inside strings
  const out = [], stack = []; let inStr = false, esc = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (inStr){ if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"'){ inStr = true; continue; }
    if (c === open) stack.push(i);
    else if (c === close && stack.length){ const s0 = stack.pop(); out.push({ start: s0, text: t.slice(s0, i + 1) }); }
  }
  return out;
}
function tryJSON(s){
  try{ return JSON.parse(s); }catch(e){}
  try{ return JSON.parse(s.replace(/,\s*([}\]])/g, "$1")); }catch(e){}
  return undefined;
}
function parseTextQuiz(raw){
  const lines = String(raw).replace(/\*\*|__/g, "").split(/\r?\n/).map(l => l.replace(/^[-•]\s+/, "").trim()).filter(Boolean);
  const items = []; let cur = null;
  const qStart = /^(?:soal\s*(?:no\.?\s*)?\d*\s*[:.)]|pertanyaan\s*\d*\s*[:.)]|q\d+\s*[:.)]|(\d{1,2})\s*[.)])\s*(.+)$/i;
  const optRe = /^\(?([A-Ea-e])\s*[.):]\s*(.+)$/;
  const ansRe = /^(?:jawaban(?:\s+(?:yang\s+)?benar)?|kunci(?:\s+jawaban)?|answer|correct)\s*[:=-]\s*\(?([A-Ea-e])\b/i;
  const hintRe = /^(?:petunjuk|hint|clue)\s*[:=-]\s*(.+)$/i;
  const expRe = /^(?:penjelasan|pembahasan|explanation|alasan)\s*[:=-]\s*(.+)$/i;
  for (const l of lines){
    let m;
    if (cur && (m = l.match(ansRe))){ cur.answer = m[1].toUpperCase().charCodeAt(0) - 65; continue; }
    if (cur && (m = l.match(hintRe))){ cur.hint = m[1]; continue; }
    if (cur && (m = l.match(expRe))){ cur.explain = m[1]; continue; }
    if (cur && cur.answer == null && (m = l.match(optRe)) && cur.options.length < 6){ cur.options.push(m[2].trim()); continue; }
    if ((m = l.match(qStart))){ cur = { q: m[2].trim(), options: [], answer: null, hint: "", explain: "" }; items.push(cur); continue; }
    if (cur && !cur.options.length) cur.q += " " + l;
    else if (cur && cur.explain) cur.explain += " " + l;
  }
  // a separate answer key at the end, e.g. "Kunci jawaban: 1. B  2. D"

function parseQuiz(text){
  const raw = String(text);
  const t = raw.replace(/```[a-z]*\s*/gi, "").replace(/[“”]/g, '"');
  const objs = balancedChunks(t, "{", "}");
  // 1) a whole quiz object
  for (const o of objs.slice().sort((a, b) => b.text.length - a.text.length)){
    const j = tryJSON(o.text); if (!j || typeof j !== "object") continue;
    const arr = j.soal || j.questions || j.items || j.quiz || j.pertanyaan;
    if (Array.isArray(arr)){
      const items = arr.map(normItem).filter(Boolean);
      if (items.length) return { title: String(j.judul || j.title || "Latihan soal").slice(0, 80), items };
    }
  }
  // 2) a bare array of questions
  for (const a of balancedChunks(t, "[", "]").sort((x, y) => y.text.length - x.text.length)){
    const j = tryJSON(a.text);
    if (Array.isArray(j)){ const items = j.map(normItem).filter(Boolean); if (items.length) return { title: "Latihan soal", items }; }
  }
  // 3) cut-off JSON: keep every complete question object
  const items = objs.sort((a, b) => a.start - b.start).map(o => normItem(tryJSON(o.text))).filter(Boolean);
  if (items.length){
    const tm = t.match(/"(?:judul|title)"\s*:\s*"([^"]+)"/);
    return { title: tm ? tm[1].slice(0, 80) : "Latihan soal", items };
  }
  // 4) plain text format
  const ti = parseTextQuiz(raw);
  if (ti.length) return { title: "Latihan soal", items: ti };
  throw Object.assign(new Error("unparsed"), { raw });
}

function startQuiz({ topic = "", count = 5, level = "", image = null }){
  if (image) lastQuizImage = image;
  const box = addBot("", { kind: "sys", html: true, persist: false });
  box.classList.add("quiz");
  const what = image ? L("dari fotomu", "from your photo") : L(`tentang ${topic}`, `about ${topic}`);
  box.innerHTML = `<div class="qz-load"><div class="meta"><span class="typing"><b></b><b></b><b></b></span><span></span></div>
    <div class="shim" style="width:72%"></div><div class="shim opt"></div><div class="shim opt"></div><div class="shim opt"></div><div class="shim opt"></div></div>`;
  const status = box.querySelector(".meta span:last-child");
  status.textContent = L(`Menyusun ${count} soal ${what}…`, `Writing ${count} questions ${what}…`);
  scrollDown();
  const ask = prompt => callAI({ message: prompt, prompt, mode: "quiz", messages: [{ role: "user", content: prompt }],
    images: image ? [image] : undefined, image: image || undefined, format: "json" });
  const opts = { topic, count, level, image };
  let lastRaw = "";
  ask(quizPrompt(opts))
    .then(text => { lastRaw = text; try{ return parseQuiz(text); }catch(e){
      // second try with a simple line format that almost any model follows
      status.textContent = L("Merapikan soal…", "Tidying up the questions…");
      return ask(quizTextPrompt(opts)).then(t2 => { lastRaw = t2; return parseQuiz(t2); });
    } })
    .then(quiz => {
      if (quiz.items.length > count) quiz.items = quiz.items.slice(0, count);
      if (quiz.title === "Latihan soal" && topic) quiz.title = cap1(topic).slice(0, 80);
      const entry = log({ role: "card", kind: "quiz", quiz, answers: quiz.items.map(() => null), hints: [], current: 0, done: false,
        source: { topic, count, level, image: !!image } });
      buildQuiz(box, entry);
    })
    .catch(err => {
      const net = !!err.userMsg;
      box.innerHTML = `<strong>${net ? L("Wayyuh AI belum bisa membuat soal", "Wayyuh AI couldn't make the questions") : L("Soalnya belum bisa dibaca", "The questions couldn't be read")}</strong>
        <div class="meta" style="margin-top:4px"></div>
        ${!net && lastRaw ? `<details class="qz-debug"><summary>${L("Lihat balasan server", "Show server reply")}</summary><pre><code></code></pre></details>` : ""}
        <div class="qz-foot" style="margin-top:12px"><button class="qz-btn primary" type="button">${t("retry")}</button></div>`;
      box.querySelector(".meta").textContent = net ? err.userMsg
        : L("Server membalas, tapi isinya bukan daftar soal. Biasanya model AI di server tidak mengikuti format, atau jawabannya terpotong karena batas panjang. Wayyuh AI sudah mencoba dua format.", "The server replied, but not with a list of questions. Usually the model didn't follow the format or the answer was cut off by the length limit. Wayyuh AI tried two formats.");
      const code = box.querySelector(".qz-debug code"); if (code) code.textContent = lastRaw.slice(0, 1500) + (lastRaw.length > 1500 ? "\n…" : "");
      box.querySelector(".qz-foot button").addEventListener("click", () => { box.parentElement.remove(); startQuiz(opts); });
    });
}
