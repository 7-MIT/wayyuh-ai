  --halo:rgba(59,130,246,.28);--halo-2:rgba(99,102,241,.13);--flare:rgba(219,234,254,.55);
  --title-m:#94A3B8;--title-a:#F8FAFC;--title-b:#C4B5FD;--title-c:#8B5CF6;--tile-ink:#FFFFFF;
  --mk-s0:#FFFFFF;--mk-s1:#7DD3FC;--mk-h:#60A5FA;--mk-a0:#3B82F6;--mk-a1:#E0F2FE;--mk-a2:#93C5FD;--mk-sp:#C4B5FD;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0B0F;--bg-2:#0D1117;--panel:rgba(12,16,26,.7);--surface:#111827;--surface-2:#151D2C;
  --line:rgba(148,163,184,.10);--line-2:rgba(148,163,184,.18);--ink:#E5E7EB;--muted:#9CA3AF;--faint:#6B7280;
  --blue:#3B82F6;--cyan:#22D3EE;--violet:#8B5CF6;--accent:#3B82F6;--accent-ink:#FFFFFF;--accent-soft:rgba(59,130,246,.16);
  --sun:#22D3EE;--sun-soft:rgba(34,211,238,.12);--ok:#34D399;--danger:#F87171;--warn:#FBBF24;--shadow:rgba(0,0,0,.55);--code-bg:#0A0F1C;
  --glass:rgba(17,24,39,.55);--glass-strong:rgba(13,18,30,.94);--glass-edge:rgba(148,163,184,.16);--glass-hi:rgba(255,255,255,.08);
  --sage:#5EEAD4;--coral:#FB7185;
  --space:#04060C;--frame:rgba(96,165,250,.32);--frame-glow:rgba(59,130,246,.42);--hl:rgba(255,255,255,.05);
  --planet:#02040A;--rim:rgba(219,234,254,.62);--rim-in:rgba(147,197,253,.5);--atmo:rgba(59,130,246,.34);--atmo-deep:rgba(30,64,175,.30);
  --halo:rgba(59,130,246,.28);--halo-2:rgba(99,102,241,.13);--flare:rgba(219,234,254,.55);
  --title-m:#94A3B8;--title-a:#F8FAFC;--title-b:#C4B5FD;--title-c:#8B5CF6;--tile-ink:#FFFFFF;
  --mk-s0:#FFFFFF;--mk-s1:#7DD3FC;--mk-h:#60A5FA;--mk-a0:#3B82F6;--mk-a1:#E0F2FE;--mk-a2:#93C5FD;--mk-sp:#C4B5FD;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent-soft)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* living sky, kept faint behind the app */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#skyCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.4s var(--ease)}
html.gl-on #skyCanvas{opacity:.55}
.grain{position:absolute;inset:0;opacity:.4;mix-blend-mode:overlay;background-size:140px 140px}

/* ---------------- shell ---------------- */
.shell{
  position:relative;z-index:1;height:100%;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px);transition:grid-template-columns .45s var(--ease);
}
.shell.sb-collapsed{grid-template-columns:0 minmax(0,1fr)}
.sidebar{
  min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;
  background:var(--panel);border-right:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  padding:12px 10px calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
}
.shell.sb-collapsed .sidebar{border-right-color:transparent;padding-left:0;padding-right:0}
.sb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 6px 6px}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:4px 6px 4px 2px;border-radius:10px;min-width:0}
.brand svg{width:26px;height:26px;flex:none}
.brand-word{font:italic 600 23px/1 var(--display);letter-spacing:.005em;white-space:nowrap}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;
  transition:background .2s,color .2s,transform .35s var(--spring);
}
.icon-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--ink)}
.icon-btn:active:not(:disabled){transform:scale(.92)}
.icon-btn:disabled{opacity:.4}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.new-chat{
  display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;box-shadow:0 1px 2px var(--shadow);
  transition:border-color .2s,transform .35s var(--spring);
}
.new-chat:hover{border-color:var(--accent)}
.new-chat:active{transform:scale(.98)}
.new-chat kbd{margin-left:auto}
kbd{font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line-2);border-radius:6px;padding:1px 5px;background:var(--surface-2)}
.sb-search{display:flex;align-items:center;gap:8px;border-radius:12px;padding:0 10px;background:var(--surface-2);border:1px solid transparent;transition:border-color .2s}
.sb-search:focus-within{border-color:var(--accent)}
.sb-search svg{color:var(--faint)}
.sb-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:8px 0;font-size:14px}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;margin:4px -6px 0;padding:0 6px}
.sb-label{display:flex;align-items:center;justify-content:space-between;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px}
.sb-label .icon-btn{width:24px;height:24px;border-radius:7px}
.sb-label .icon-btn svg{width:15px;height:15px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;
  padding:7px 8px;border-radius:10px;font-size:14px;color:var(--ink);min-width:0;transition:background .15s;
}
.nav-item:hover,.nav-item:focus-within{background:var(--accent-soft)}
.nav-item.active{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .c{font:11px var(--mono);color:var(--faint)}
.nav-item svg{color:var(--muted)}
.nav-item .more{opacity:0;width:26px;height:26px;border-radius:8px}
.nav-item:hover .more,.nav-item:focus-within .more,.nav-item.active .more{opacity:1}
@media (hover:none){.nav-item .more{opacity:.7}}
.nav-item.chat{padding:6px 4px 6px 10px}
.nav-group{font-size:11.5px;color:var(--faint);padding:10px 10px 3px}
.nav-empty{color:var(--faint);font-size:13px;padding:10px;line-height:1.5}
.proj-dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--violet)}
.inline-input{width:100%;border:1px solid var(--accent);border-radius:8px;background:var(--surface);padding:5px 8px;font-size:14px;outline:none}
.sb-foot{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--line)}
.who-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--blue));flex:none}
.who-row .n{font-size:13.5px;font-weight:600;line-height:1.2}
.who-row .s{font-size:11.5px;color:var(--faint)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(6,9,20,.38);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .3s var(--ease),visibility 0s}

/* ---------------- main ---------------- */
.main{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.topbar{
  display:flex;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px 12px;min-height:54px;
  border-bottom:1px solid transparent;transition:border-color .2s,background .2s;
}
.topbar.scrolled{border-bottom-color:var(--line);background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar .title{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:10px;
  font-weight:600;font-size:15px;
}
.topbar .title:hover:not(:disabled){background:var(--accent-soft)}
.topbar .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .title .badge{font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.badge .proj-dot{width:7px;height:7px}
.content{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .45s var(--ease)}
.content.ws-open{grid-template-columns:minmax(0,1fr) minmax(360px,46%)}
.chatcol{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}

.offline-bar{
  display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 12%,transparent);padding:6px 12px;border-bottom:1px solid var(--line);
}

/* ---------------- thread ---------------- */
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.thread-inner{
  max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:18px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
}
.msg{display:flex;flex-direction:column;gap:6px;min-width:0;animation:msgIn .45s var(--ease) both}
.msg.still{animation:none}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-items:flex-end}
.msg.user .bubble{
  max-width:min(85%,640px);background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 6px 18px;
  padding:10px 15px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px var(--shadow);
}
.msg.user .files{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:85%}
.file-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:5px 10px 5px 6px;font-size:12.5px;max-width:240px}
.file-chip img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.file-chip .fi{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.file-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file-chip .sz{color:var(--faint);font-size:11px}
.msg.user .user-img{max-width:220px;max-height:220px;border-radius:14px;border:1px solid var(--line);object-fit:cover}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.who .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--sun-soft)}
.who .dot i{width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:0 0 10px var(--sun)}
.who .model{font-weight:400;color:var(--faint);font-size:11.5px}
.msg.ai .body{min-width:0;padding-left:30px}
.msg.card .body{padding-left:30px}
.msg.card .bubble{border:1px solid var(--line);background:var(--glass);border-radius:var(--r-lg);padding:14px 18px;max-width:min(100%,640px);overflow-wrap:anywhere}
.msg-actions{display:flex;flex-wrap:wrap;gap:2px;padding-left:24px;opacity:0;transition:opacity .2s}
.msg.user .msg-actions{padding-left:0}
.msg:hover .msg-actions,.msg:focus-within .msg-actions,.msg.last .msg-actions{opacity:1}
@media (hover:none){.msg-actions{opacity:.85}}
.msg-actions .icon-btn{width:30px;height:30px;border-radius:8px}
.msg-actions .icon-btn svg{width:16px;height:16px}
.msg-actions .icon-btn.on{color:var(--accent)}
.status-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:30px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.status-note.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.status-note .grow{flex:1;min-width:160px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:500;transition:border-color .2s,background .2s,transform .35s var(--spring);
}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.danger.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn svg{width:16px;height:16px}

/* thinking + streaming */
.thinking{display:inline-flex;align-items:center;gap:10px;padding:4px 0 4px 30px;color:var(--muted);font-size:14px}
.orbit{position:relative;width:16px;height:16px;flex:none}
.orbit::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--sun);box-shadow:0 0 10px var(--sun);animation:pulse 1.6s ease-in-out infinite}
.orbit i{position:absolute;inset:0;animation:spin 1.3s linear infinite}
.orbit i::after{content:"";position:absolute;top:-1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--violet)}
.think-text{background:linear-gradient(90deg,var(--faint) 0%,var(--ink) 45%,var(--faint) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimtext 2.2s linear infinite;transition:opacity .3s}
@keyframes shimtext{from{background-position:120% 0}to{background-position:-100% 0}}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
.streaming > :last-child::after{content:"";display:inline-block;width:.45em;height:1em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--accent);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.rw{animation:rw .5s var(--ease) both}
@keyframes rw{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
.rw-block{animation:msgIn .5s var(--ease) both}

/* sources */
.sources{margin:10px 0 0 30px;display:flex;flex-direction:column;gap:6px}
.sources .lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.src-list{display:flex;flex-wrap:wrap;gap:6px}
.src{display:inline-flex;align-items:center;gap:7px;max-width:280px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:5px 10px 5px 6px;font-size:12.5px;color:var(--ink);text-decoration:none;transition:border-color .2s}
.src:hover{border-color:var(--accent)}
.src b{display:grid;place-items:center;min-width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 11px var(--mono)}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.src em{font-style:normal;color:var(--faint)}
.search-sugg{width:100%;max-width:640px;height:56px;border:0;border-radius:12px;background:transparent;margin-left:30px}
.mem-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sage);padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--sage) 14%,transparent);max-width:min(88%,620px);margin-left:30px}
.msg.user .mem-note{margin-left:0}
.mem-note svg{width:14px;height:14px}
.mem-note span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ws-suggest{margin-left:30px}

/* inline edit */
.edit-box{width:min(85%,640px);display:flex;flex-direction:column;gap:8px}
.edit-box textarea{width:100%;min-height:80px;max-height:320px;resize:vertical;border:1px solid var(--accent);border-radius:14px;background:var(--surface);padding:10px 14px;outline:none;line-height:1.5}
.edit-box .row{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.edit-box .row small{margin-right:auto;color:var(--faint);font-size:12px}

/* ---------------- markdown ---------------- */
.md{font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.md > :first-child{margin-top:0}
.md > :last-child{margin-bottom:0}
.md p{margin:0 0 .75em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:1.1em 0 .45em;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.md h1{font-size:1.45em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.2em 0 .8em;padding-left:1.4em}
.md li{margin:.2em 0}
.md li > ul,.md li > ol{margin:.2em 0}
.md li.task{list-style:none;margin-left:-1.3em}
.md li.task input{margin-right:8px;accent-color:var(--accent)}
.md a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.md blockquote{margin:.6em 0 .9em;padding:4px 14px;border-left:3px solid var(--violet);color:var(--muted);background:var(--accent-soft);border-radius:0 10px 10px 0}
.md hr{border:0;border-top:1px solid var(--line-2);margin:1.2em 0}
.md code{font:.88em var(--mono);background:var(--code-bg);border:1px solid var(--line);padding:.1em .38em;border-radius:6px}
.md strong{font-weight:700}
.md del{color:var(--faint)}
.table-wrap{overflow-x:auto;margin:.5em 0 1em;border:1px solid var(--line-2);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--surface-2)}
.md tr:last-child td{border-bottom:0}
.md tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.codeblock{margin:.6em 0 1em;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--code-bg)}
.cb-head{display:flex;align-items:center;gap:4px;padding:5px 6px 5px 14px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--faint)}
.cb-head .lang{flex:1}
.cb-head .icon-btn{width:28px;height:28px}
.cb-head .icon-btn svg{width:15px;height:15px}
.cb-head .btn{padding:3px 9px;font-size:12px;border-radius:8px;background:transparent}
.codeblock pre{margin:0;padding:12px 14px;overflow-x:auto;font:13px/1.6 var(--mono);tab-size:2}
.codeblock code{font:inherit;background:none;border:0;padding:0}
/* syntax colors (highlight.js classes) */
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-literal{color:var(--violet)}
.hljs-string,.hljs-attr .hljs-string,.hljs-regexp,.hljs-addition{color:var(--ok)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--sun)}
.hljs-title,.hljs-title.function_,.hljs-section,.hljs-name{color:var(--blue)}
.hljs-attr,.hljs-attribute,.hljs-property,.hljs-variable,.hljs-template-variable,.hljs-type{color:var(--coral)}
.hljs-comment,.hljs-quote,.hljs-meta{color:var(--faint);font-style:italic}
.hljs-deletion{color:var(--danger)}

/* ---------------- welcome ---------------- */
.welcome{
  flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
}
.welcome-inner{margin:auto;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:20px 18px}
.welcome-inner > *{animation:msgIn .7s var(--ease) both}
.welcome-inner > :nth-child(2){animation-delay:.06s}.welcome-inner > :nth-child(3){animation-delay:.12s}
.welcome-inner > :nth-child(4){animation-delay:.18s}.welcome-inner > :nth-child(5){animation-delay:.24s}
.sky-row{display:flex;align-items:center;gap:14px;color:var(--muted)}
.mini-sky{width:132px;height:auto;overflow:visible}
.clock-block{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.clock-time{font:600 30px/1 var(--body);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);display:inline-flex}
.clock-date{font-size:12px;color:var(--faint);margin-top:5px;letter-spacing:.02em}
.dg{position:relative;display:inline-block;overflow:hidden;height:1.05em}
.dg-in{display:block;animation:dgIn .7s var(--spring) both}
.dg-in.leave{position:absolute;inset:0;animation:dgOut .5s var(--ease-io) both}
@keyframes dgIn{from{transform:translateY(80%);opacity:0}to{transform:none;opacity:1}}
@keyframes dgOut{to{transform:translateY(-80%);opacity:0}}
.greet-line{font-size:14px;color:var(--muted);margin-top:14px}
.greet-line b{font-weight:600;color:var(--sun)}
.welcome h1{margin:0;font-size:clamp(26px,4.4vw,36px);line-height:1.15;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.welcome .sub{margin:0;color:var(--muted);font-size:15px;max-width:520px;text-wrap:pretty}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:18px}
.card-s{
  display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:border-color .2s,transform .4s var(--spring),box-shadow .3s;
}
.card-s:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--shadow)}
.card-s:active{transform:scale(.98)}
.card-s .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.card-s .ico svg{width:19px;height:19px}
.card-s .ico.a{background:var(--accent-soft);color:var(--violet)}
.card-s .ico.b{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.card-s .ico.c{background:var(--sun-soft);color:var(--sun)}
.card-s .ico.d{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card-s b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.card-s span{display:block;font-size:13px;color:var(--muted);line-height:1.45}

/* ---------------- composer ---------------- */
.dock{
  position:relative;padding:6px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
}
.dock-inner{max-width:800px;margin:0 auto;position:relative}
.composer{
  position:relative;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:22px;padding:10px 10px 8px 14px;
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 10px 30px -18px var(--shadow);transition:border-color .2s,box-shadow .2s;
}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 10px 30px -18px var(--shadow)}
.composer.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{width:100%;border:0;background:transparent;resize:none;outline:none;padding:4px 2px;max-height:220px;line-height:1.55;font-size:15px}
.composer textarea::placeholder{color:var(--faint)}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tray .file-chip{background:var(--surface)}
.tray .file-chip .x{border:0;background:none;color:var(--faint);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;margin-left:2px}
.tray .file-chip .x:hover{background:var(--accent-soft);color:var(--ink)}
.c-row{display:flex;align-items:center;gap:4px}
.c-row .spacer{flex:1}
.tool{
  height:34px;min-width:34px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-size:13px;
  transition:background .2s,color .2s,border-color .2s;
}
.tool:hover:not(:disabled){background:var(--accent-soft);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tool:disabled{opacity:.38}
.tool .lbl{white-space:nowrap}
.tool.slash{font:600 15px var(--mono);color:var(--sun)}
.tool.rec{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.tool.rec svg{animation:pulse 1.2s ease-in-out infinite}
.send{
  width:36px;height:36px;border-radius:11px;border:0;display:grid;place-items:center;flex:none;
  background:var(--accent);color:var(--accent-ink);transition:transform .35s var(--spring),opacity .2s,background .2s;
}
.send:disabled{opacity:.35}
.send:not(:disabled):hover{filter:brightness(1.08)}
.send:not(:disabled):active{transform:scale(.9)}
.send.stop{background:var(--ink);color:var(--bg)}
.send svg{width:18px;height:18px}
.footnote{text-align:center;font-size:11.5px;color:var(--faint);margin-top:7px}
.palette{
  position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:min(340px,48vh);overflow-y:auto;padding:6px;z-index:6;
  border:1px solid var(--line-2);background:var(--glass-strong);border-radius:16px;box-shadow:0 18px 40px -20px var(--shadow);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s var(--ease),transform .3s var(--ease),visibility 0s .3s;
}
.palette.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s var(--ease),transform .3s var(--ease),visibility 0s}
.pal-item{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:7px 10px}
.pal-item code{font:13px var(--mono);color:var(--sun);min-width:8em}
.pal-item span{color:var(--muted);font-size:13px}
.pal-item[aria-selected="true"]{background:var(--accent-soft)}
.to-bottom{
  position:absolute;left:50%;bottom:calc(100% + 8px);translate:-50% 6px;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 16px -8px var(--shadow);
  opacity:0;visibility:hidden;transition:opacity .25s,translate .35s var(--spring),visibility 0s .25s;z-index:5;
}
.to-bottom.show{opacity:1;visibility:visible;translate:-50% 0;transition:opacity .25s,translate .35s var(--spring),visibility 0s}

/* ---------------- workspace ---------------- */
.workspace{min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);overflow:hidden}
.content:not(.ws-open) .workspace{visibility:hidden}
.ws-head{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ws-head .t{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-head .t small{font:12px var(--mono);color:var(--faint);margin-left:6px;font-weight:400}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg button:disabled{opacity:.4}
.ws-body{flex:1;min-height:0;position:relative}
.ws-editor{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;outline:none;background:var(--code-bg);color:var(--ink);font:13px/1.6 var(--mono);padding:14px 16px;tab-size:2;white-space:pre;overflow:auto}
.ws-preview{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.ws-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--faint);padding:24px;gap:8px;font-size:14px}

/* ---------------- menus, sheets, toast ---------------- */
.menu{
  position:fixed;z-index:60;min-width:200px;max-width:280px;padding:5px;border-radius:14px;border:1px solid var(--line-2);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 44px -18px var(--shadow);
  animation:menuIn .18s var(--ease) both;
}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft);outline:none}
.menu button.danger{color:var(--danger)}
.menu button.on::after{content:"✓";margin-left:auto;color:var(--accent)}
.menu button small{margin-left:auto;color:var(--faint);font:11px var(--mono)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mlabel{font:600 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 10px 2px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,9,20,.4);opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s .25s}
.modal.open{opacity:1;visibility:visible;transition:opacity .25s var(--ease),visibility 0s}
.sheet{
  width:min(560px,100%);max-height:calc(100% - 8px);overflow-y:auto;border-radius:22px;border:1px solid var(--line-2);background:var(--glass-strong);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 30px 70px -30px var(--shadow);
  padding:22px;display:flex;flex-direction:column;gap:16px;transform:translateY(10px) scale(.98);transition:transform .35s var(--spring);
}
.modal.open .sheet{transform:none}
.sheet h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet h3{margin:6px 0 0;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sheet p.meta{margin:-8px 0 0;color:var(--muted);font-size:13.5px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--faint);font-size:12px}
.field input,.field select{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .seg{display:flex}
.field .seg button{flex:1;padding:6px 8px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.switch-row small{display:block;color:var(--faint);font-size:12px}
.switch{appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;flex:none;cursor:pointer;transition:background .3s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(17px)}
.cap-list{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cap{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13.5px;background:var(--surface)}
.cap + .cap{border-top:1px solid var(--line)}
.cap .st{margin-left:auto;font-size:12px;border-radius:999px;padding:1px 9px;white-space:nowrap}
.cap .st.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.cap .st.off{color:var(--faint);background:var(--surface-2)}
.cap .st.need{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.account-card{border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:12px;align-items:flex-start}
.account-card svg{color:var(--faint);margin-top:2px}
.sheet-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.sheet-actions .left{margin-right:auto}
.mem-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mem-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);transition:opacity .25s,transform .25s}
.mem-list li:last-child{border-bottom:0}
.mem-list li.leaving{opacity:0;transform:translateX(10px)}
.mem-list .n{font:12px var(--mono);color:var(--faint);min-width:1.8em}
.mem-text{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.mem-src{font-size:11px;color:var(--sage)}
.mem-empty{color:var(--faint);font-size:13px;justify-content:center;text-align:center;padding:18px 8px!important}
.mem-add{display:flex;gap:8px}
.mem-add input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;outline:none}
.mem-add input:focus{border-color:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:70;display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:12px;font-size:13.5px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -12px var(--shadow);
  animation:toast 2.2s var(--ease) both;
}
.toast.err{background:var(--danger);color:#fff}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
.confetti{position:fixed;width:7px;height:10px;border-radius:2px;pointer-events:none;z-index:80}

/* tool cards from slash commands */
.tiny{border:0;background:none;color:var(--muted);font-size:12px;padding:3px 8px;border-radius:8px}
.tiny:hover{color:var(--ink);background:var(--accent-soft)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px;margin-top:6px}
.feat-group{margin-top:12px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.feat{display:flex;gap:10px;padding:4px 0;font-size:13.5px;align-items:baseline}
.feat code{color:var(--sun);white-space:nowrap;font:12.5px var(--mono)}
.feat span{color:var(--muted)}
.big{font:600 32px/1.15 var(--body);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:6px}
.zones div{font-size:12px;color:var(--muted)}
.zones b{display:block;font:600 22px/1.2 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.pw{font:15px var(--mono);word-break:break-all}
.msg.card.static .bubble input,.msg.card.static .bubble button{pointer-events:none;opacity:.6}

/* ---------------- responsive ---------------- */
@media (max-width:900px){
  .shell,.shell.sb-collapsed{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(320px,86vw);transform:translateX(-102%);
    transition:transform .45s var(--ease);background:var(--glass-strong);box-shadow:0 0 50px -10px var(--shadow);
    padding-top:calc(12px + env(safe-area-inset-top,0px));
  }
  .shell.sb-open .sidebar{transform:none}
  .shell.sb-collapsed .sidebar{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
  .content.ws-open{grid-template-columns:minmax(0,1fr) 0}
  .content.ws-open .workspace{position:fixed;inset:0;z-index:45;visibility:visible;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
  .hide-m{display:none!important}
}
@media (min-width:901px){.show-m{display:none!important}}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .card-s{padding:12px}
  .msg.ai .body,.msg.card .body,.sources,.status-note,.thinking,.mem-note,.ws-suggest,.search-sugg{margin-left:0;padding-left:0}
  .msg-actions{padding-left:0}
  .tool .lbl{display:none}
  .grid2{grid-template-columns:1fr}
  .thread-inner{gap:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ---------- practice quiz ---------- */
.msg.sys .bubble.quiz{padding:18px 20px 16px;width:min(100%,620px)}
.quiz{display:flex;flex-direction:column;gap:14px}
.qz-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.qz-title{font:italic 500 21px/1.2 var(--display);min-width:0;overflow-wrap:anywhere}
.qz-count{font:12px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.qz-bar{display:flex;gap:4px}
.qz-bar i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .5s var(--ease),transform .5s var(--ease)}
.qz-bar i.cur{background:var(--sun);transform:scaleY(1.5)}
.qz-bar i.ok{background:var(--ok)}
.qz-bar i.no{background:var(--danger)}
.qz-stage{display:flex;flex-direction:column;gap:12px;animation:qin .5s var(--ease) both}
.qz-stage.out{animation:qout .22s var(--ease-io) both}
@keyframes qin{from{opacity:0;transform:translateX(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes qout{to{opacity:0;transform:translateX(-18px);filter:blur(4px)}}
.qz-q{font:500 19px/1.4 var(--body);margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.qz-opts{display:flex;flex-direction:column;gap:8px}
.qz-opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px 11px 11px;border-radius:16px;
  border:1px solid var(--glass-edge);background:var(--glass);font-size:14.5px;line-height:1.4;
  transition:transform .4s var(--ease),border-color .35s,background .35s,opacity .4s;
}
.qz-opt:hover:not(:disabled){transform:translateX(3px);border-color:var(--sun)}
.qz-opt:disabled{cursor:default}
.qz-letter{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:500 12px var(--mono);
  border:1px solid var(--line);background:var(--bg);transition:background .35s,color .35s,border-color .35s,transform .5s var(--ease);
}
.qz-letter svg{width:15px;height:15px}
.qz-text{flex:1;min-width:0;overflow-wrap:anywhere}
.qz-opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--glass))}
.qz-opt.correct .qz-letter{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.08)}
.qz-opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,var(--glass));animation:shake .45s var(--ease-io)}
.qz-opt.wrong .qz-letter{background:var(--danger);border-color:var(--danger);color:#fff}
.qz-opt.dim{opacity:.5}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.qz-reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),opacity .45s var(--ease)}
.qz-reveal.show{grid-template-rows:1fr;opacity:1}
.qz-reveal > div{overflow:hidden;min-height:0}
.qz-box{border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.5;margin-top:2px}
.qz-box b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.qz-hint{background:var(--sun-soft)}
.qz-hint b{color:var(--sun)}
.qz-exp.ok{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.qz-exp.ok b{color:var(--ok)}
.qz-exp.no{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.qz-exp.no b{color:var(--danger)}
.qz-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qz-btn{
  border:1px solid var(--glass-edge);background:var(--glass);border-radius:999px;padding:8px 16px;font-size:13.5px;
  display:inline-flex;align-items:center;gap:6px;transition:transform .4s var(--ease),opacity .3s,background .3s;
}
.qz-btn:active:not(:disabled){transform:scale(.95)}
.qz-btn:disabled{opacity:.35;cursor:default}
.qz-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qz-btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-left:6px}
.qz-btn.ghost:hover:not(:disabled){color:var(--ink)}
.qz-btn svg{width:16px;height:16px}
.qz-keys{font:11px var(--mono);color:var(--muted)}
.qz-result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0 2px;animation:qin .55s var(--ease) both}
.qz-ring{position:relative;width:132px;height:132px}
.qz-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.qz-ring .trk{fill:none;stroke:var(--line);stroke-width:9}
.qz-ring .arc{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.qz-ring.great .arc{stroke:var(--ok)}
.qz-ring div{position:absolute;inset:0;display:grid;place-content:center;line-height:1}
.qz-ring b{font:500 38px var(--display);font-variant-numeric:tabular-nums}
.qz-ring span{font-size:12px;color:var(--muted);margin-top:4px}
.qz-verdict{font:italic 500 24px/1.2 var(--display);margin:0}
.qz-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.qz-review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;animation:qin .45s var(--ease) both}
.qz-review li{border-radius:14px;padding:11px 14px;background:var(--glass);border:1px solid var(--glass-edge);border-left:3px solid var(--ok);font-size:13.5px;line-height:1.45}
.qz-review li.no{border-left-color:var(--danger)}
.qz-review .rq{font-weight:500;margin-bottom:4px}
.qz-review .ra{color:var(--muted)}
.qz-review .ra em{font-style:normal;color:var(--ink)}
.qz-debug{margin-top:10px;font-size:12.5px;color:var(--muted)}
.qz-debug summary{cursor:pointer;width:max-content;max-width:100%}
.qz-debug pre{max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:6px}
.qz-load{display:flex;flex-direction:column;gap:12px}
.qz-load .meta{display:flex;align-items:center;gap:8px}
.shim{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--line) 0%,var(--glass-hi) 50%,var(--line) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.shim.opt{height:46px;border-radius:16px}
@keyframes shim{to{background-position:-200% 0}}


/* lists rendered by local features */
.list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);animation:enter .5s var(--ease) both}
.list li:last-child{border-bottom:0}
.list .n{font:12px var(--mono);color:var(--muted);min-width:1.6em;font-variant-numeric:tabular-nums}
.list .done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sun)}
.list span{transition:color .4s}
.check{
  appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:6px;flex:none;transform:translateY(3px);cursor:pointer;
  display:grid;place-items:center;transition:background .3s var(--ease),border-color .3s,transform .35s var(--ease);
}
.check::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .35s var(--ease);margin-top:-2px}
.check:checked{background:var(--sage);border-color:var(--sage)}
.check:checked::after{transform:rotate(45deg) scale(1)}
.check:active{transform:translateY(3px) scale(.85)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px;margin-top:6px}
.feat-group{margin-top:12px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.feat-group:first-of-type{margin-top:8px}
.feat{display:flex;gap:10px;padding:4px 0;font-size:13.5px;align-items:baseline}
.feat code{background:none;padding:0;color:var(--sun);white-space:nowrap}
.feat span{color:var(--muted)}
.big{font:500 36px/1.1 var(--display);font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:6px}
.zones div{font-size:12px;color:var(--muted)}
.zones b{display:block;font:500 24px/1.2 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.pw{font:15px var(--mono);word-break:break-all}


/* sidebar row buttons */
.nav-item button.t{border:0;background:none;padding:2px 0;text-align:left;font:inherit;color:inherit;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item button.t:focus-visible{outline-offset:4px}
/* loader dots used by the quiz */
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing b{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:wave 1.3s var(--ease-io) infinite}
.typing b:nth-child(2){animation-delay:.16s}.typing b:nth-child(3){animation-delay:.32s}
@keyframes wave{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-4px);opacity:1}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.card .bubble.quiz{padding:18px 20px 16px;width:min(100%,640px)}
.qz-debug{margin-top:10px;font-size:12.5px;color:var(--muted)}
.qz-debug summary{cursor:pointer}
.qz-debug pre{max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:6px;font:12px var(--mono)}
.qz-title{font-family:var(--body)!important;font-style:normal!important;font-weight:700!important;font-size:17px!important}
.qz-verdict{font-family:var(--body)!important;font-style:normal!important;font-weight:600!important;font-size:19px!important}
.qz-ring b{font-family:var(--body)!important;font-weight:700!important}
.check{appearance:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:5px;flex:none;transform:translateY(3px);cursor:pointer;display:grid;place-items:center}
.check:checked{background:var(--accent);border-color:var(--accent)}
/* long sheets scroll instead of squashing their sections */
.sheet > *{flex-shrink:0}

/* ===================== Wayyuh AI Orbit layer ===================== */
body{background:var(--bg)}
.show-s{display:none!important}
@media (max-width:560px){.show-s{display:flex!important}}

/* ---------- the Wayyuh AI mark ---------- */
.mark{display:block;flex:none}
.mk-s0{stop-color:var(--mk-s0)}.mk-s1{stop-color:var(--mk-s1)}
.mk-h0{stop-color:var(--mk-h);stop-opacity:.55}.mk-h1{stop-color:var(--mk-h);stop-opacity:0}
.mk-a0{stop-color:var(--mk-a0);stop-opacity:.25}.mk-a1{stop-color:var(--mk-a1)}

/* ---------- sidebar ---------- */
.sidebar{background:transparent;border-right:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.brand{gap:10px}
.brand .mark{width:30px;height:30px}
.brand-word{font:500 15px/1 var(--display);letter-spacing:.26em;text-transform:uppercase;font-style:normal;padding-top:1px}
.new-chat{
  background:linear-gradient(180deg,#5B9BFF,#3B82F6);border:0;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(147,197,253,.35),0 10px 28px -10px rgba(59,130,246,.8);
}
.new-chat:hover{filter:brightness(1.08)}
.new-chat kbd{color:rgba(255,255,255,.78);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1)}
.sb-search{background:var(--surface);border:1px solid var(--line)}
.nav-item.active{background:linear-gradient(90deg,var(--accent-soft),transparent 95%);box-shadow:inset 2px 0 0 var(--blue)}
.avatar{background:linear-gradient(135deg,var(--violet),var(--blue) 60%,var(--cyan))}
@media (max-width:900px){.sidebar{background:var(--glass-strong)}}

/* ---------- framed main panel ---------- */
.main{position:relative;isolation:isolate;overflow:hidden;background:var(--space);grid-template-columns:minmax(0,1fr)}
.main > :not(.ambient){position:relative;z-index:1}
@media (min-width:901px){
  .main{
    margin:10px 10px 10px 0;height:calc(100% - 20px);border-radius:22px;border:1px solid var(--frame);
    box-shadow:0 0 0 1px rgba(59,130,246,.05),0 0 80px -26px var(--frame-glow),inset 0 1px 0 var(--hl);
  }
  .shell.sb-collapsed .main{margin-left:10px}
}

/* ---------- space: stars, nebula, planet horizon ---------- */
.ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit}
#starCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.nebula{
  position:absolute;inset:0;
  background:
    radial-gradient(55% 42% at 16% 10%,color-mix(in srgb,var(--violet) 16%,transparent),transparent 70%),
    radial-gradient(48% 40% at 86% 6%,color-mix(in srgb,var(--blue) 18%,transparent),transparent 70%),
    radial-gradient(40% 36% at 72% 64%,color-mix(in srgb,var(--cyan) 6%,transparent),transparent 70%);
}
.planet-wrap{position:absolute;inset:0;transition:transform 1.5s var(--ease),opacity 1.2s var(--ease);will-change:transform}
.planet{
  position:absolute;left:-25%;top:104%;width:260%;aspect-ratio:1/1;margin-top:-53.35%;border-radius:50%;background:var(--planet);
  box-shadow:
    inset 0 0 0 1.5px var(--rim),inset 0 0 22px 3px var(--rim-in),inset 0 0 90px 18px var(--atmo),inset 0 0 280px 70px var(--atmo-deep),
    0 0 0 1px var(--rim),0 0 26px 4px var(--rim-in),0 0 130px 36px var(--halo),0 0 340px 120px var(--halo-2);
}
.flare{
  position:absolute;left:97%;top:104%;margin-top:-53%;width:62%;aspect-ratio:2.4/1;transform:translate(-50%,-50%) rotate(-24deg);
  background:radial-gradient(closest-side,var(--flare),color-mix(in srgb,var(--blue) 30%,transparent) 42%,transparent 78%);
  filter:blur(8px);opacity:.9;
}
.main.in-chat .planet-wrap{transform:translateY(58%);opacity:.75}
@media (max-width:900px){
  .planet,.flare{top:27%}
  .main.in-chat .planet-wrap{transform:translateY(70%);opacity:.7}
}

/* ---------- topbar ---------- */
.topbar .title{font-family:var(--display);font-weight:500;letter-spacing:-.01em}
.topbar.scrolled{background:color-mix(in srgb,var(--space) 70%,transparent)}

/* ---------- welcome hero ---------- */
.welcome-inner{max-width:920px;gap:0;padding-block:clamp(22px,6vh,64px) 22px}
.hero-mark{width:64px;height:64px;margin-bottom:18px;display:grid;place-items:center;border-radius:20px;
  background:var(--glass);border:1px solid var(--line-2);box-shadow:0 0 40px -10px var(--frame-glow),inset 0 1px 0 var(--hl);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero-mark .mark{width:44px;height:44px}
.hero-pill{
  display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--glass);border-radius:999px;
  padding:4px 12px 4px 4px;font-size:12.5px;color:var(--muted);margin-bottom:24px;max-width:100%;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s,color .2s;
}
.hero-pill:hover{border-color:color-mix(in srgb,var(--blue) 60%,transparent);color:var(--ink)}
.hero-pill .tag{background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px;font-weight:600;font-size:11px;flex:none}
.hero-pill .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hero-pill svg{width:14px;height:14px}
.welcome .hero-title{margin:0;font:300 clamp(40px,6.2vw,78px)/1.02 var(--display);letter-spacing:-.04em;text-wrap:balance}
.hero-title span{
  display:block;padding:0 .04em .06em;-webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(100deg,var(--title-a) 28%,var(--title-b) 64%,var(--title-c) 100%);
}
.hero-title span:first-child{background-image:linear-gradient(100deg,var(--title-m) 0%,var(--title-a) 42%,var(--title-b) 100%)}
.hero-sub{margin:18px 0 0;font-size:16px;line-height:1.6;color:var(--muted);max-width:580px;text-wrap:pretty}
.hero-sub b{color:var(--ink);font-weight:600}
.hero-slot{width:100%;max-width:720px;margin-top:30px}
.try-label{width:100%;max-width:720px;justify-content:space-between;align-items:center;margin-top:26px;font-size:13px;font-weight:600;color:var(--muted)}
.try-label svg{width:16px;height:16px}
.hero-foot{margin:30px 0 0;font-size:11.5px;color:var(--faint)}
.cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:34px;max-width:920px}
.card-s{
  position:relative;background:var(--glass);border:1px solid var(--line-2);border-radius:14px;padding:14px 14px 15px;
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);box-shadow:inset 0 1px 0 var(--hl);
}
.card-s:hover{border-color:color-mix(in srgb,var(--blue) 55%,transparent);box-shadow:inset 0 1px 0 var(--hl),0 14px 30px -18px var(--frame-glow)}
.card-s .ico{
  --h:var(--blue);width:38px;height:38px;border-radius:10px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--h) 38%,transparent),color-mix(in srgb,var(--h) 6%,transparent));
  border:1px solid color-mix(in srgb,var(--h) 50%,transparent);color:color-mix(in srgb,var(--h) 40%,var(--tile-ink));
  box-shadow:0 0 22px -6px var(--h),inset 0 1px 0 rgba(255,255,255,.18);
}
.card-s .ico.a{--h:var(--blue)}.card-s .ico.b{--h:var(--cyan)}.card-s .ico.c{--h:var(--violet)}.card-s .ico.d{--h:#6366F1}
.card-s .tx{min-width:0}
.card-s b{font-size:14px;font-weight:600;color:var(--ink)}
.card-s .tx > span{font-size:12.5px;color:var(--muted)}
.card-s .go{margin-left:auto;align-self:center;color:var(--faint);opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .35s var(--spring);display:grid;place-items:center}
.card-s:hover .go,.card-s:focus-visible .go{opacity:1;transform:none}
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- composer: in the hero and docked ---------- */
.composer{
  background:var(--glass);border:1px solid var(--line-2);border-radius:18px;
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--hl),0 22px 50px -26px rgba(0,0,0,.65);
}
.composer:focus-within{
  border-color:color-mix(in srgb,var(--blue) 60%,transparent);
  box-shadow:inset 0 1px 0 var(--hl),0 0 0 3px var(--accent-soft),0 0 54px -14px var(--frame-glow);
}
.dock.in-hero{padding:0}
.dock.in-hero .footnote,.dock.in-hero .to-bottom{display:none}
.dock.in-hero .composer{padding:14px 12px 10px 18px;text-align:left}
.dock.in-hero .composer textarea{min-height:50px;font-size:15.5px}
.dock.in-hero .palette{bottom:auto;top:calc(100% + 8px);text-align:left}
.send{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#60A5FA,#3B82F6);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 0 0 1px rgba(147,197,253,.35),0 6px 18px -6px rgba(59,130,246,.85);
}
.send:disabled{opacity:.42;filter:saturate(.7)}
.send.stop{background:var(--ink);color:var(--bg);box-shadow:none}
.tool.slash{color:var(--cyan)}
.tool[aria-pressed="true"]{background:color-mix(in srgb,var(--blue) 16%,transparent);color:color-mix(in srgb,var(--blue) 55%,var(--ink));border-color:color-mix(in srgb,var(--blue) 45%,transparent)}

/* ---------- palette with tool tiles ---------- */
.pal-item{align-items:center;padding:6px 8px}
.pal-item .tile{--h:var(--blue);width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--h) 20%,transparent);border:1px solid color-mix(in srgb,var(--h) 35%,transparent);color:var(--h)}
.pal-item .tile svg{width:15px;height:15px}
.pal-item code{color:var(--ink);min-width:7.5em}

/* ---------- messages ---------- */
.msg.user .bubble{
  background:linear-gradient(180deg,#4F8EF7,#3B82F6);color:#fff;border:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 24px -14px rgba(59,130,246,.9);
}
.msg.user .bubble ::selection,.msg.user .bubble::selection{background:rgba(255,255,255,.3)}
.msg.ai .body{
  margin-left:30px;padding:14px 18px;border-radius:4px 18px 18px 18px;background:var(--glass);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--hl);
}
.msg.card .bubble{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--hl);border-color:var(--line-2)}
.who .dot{width:22px;height:22px;border-radius:7px;background:var(--glass);border:1px solid var(--line-2);display:grid;place-items:center}
.who .dot .mark{width:17px;height:17px}
.who .nm{font-family:var(--display);font-weight:500;letter-spacing:.02em}
.thinking{padding-left:30px}
.md h1,.md h2,.md h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em}
.codeblock{background:var(--code-bg)}

/* ---------- buttons ---------- */
.btn.primary{
  background:linear-gradient(180deg,#5B9BFF,#3B82F6);border:0;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(147,197,253,.35),0 8px 22px -10px rgba(59,130,246,.85);
}
.btn{background:var(--glass)}
.sheet,.menu,.palette{background:var(--glass-strong)}
.sheet h2{font-family:var(--display);font-weight:600}

/* ---------- small screens ---------- */
@media (max-width:560px){
  .msg.ai .body{margin-left:0;padding:12px 14px}
  .thinking{padding-left:0}
  .hero-pill{display:none}
  .welcome .hero-title{font-size:clamp(36px,11vw,48px)}
  .hero-sub{font-size:15px}
  .hero-slot{margin-top:24px}
  .cards{grid-template-columns:1fr;gap:8px;margin-top:10px}
  .card-s{padding:10px 12px;align-items:center;border-radius:12px}
  .card-s .ico{width:30px;height:30px;border-radius:8px;box-shadow:none}
  .card-s .ico svg{width:16px;height:16px}
  .card-s .tx > span{display:none}
  .card-s b{margin:0;font-weight:500;font-size:14px}
  .card-s .go{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){.planet-wrap{transition:none}}

/* ===================== Wayyuh AI 2.1 · Apple-inspired =====================
   Calm aura background in CSS gradients (one static layer, no animation), light glass only on the nav,
   the top bar and the composer, system type, 14–22px corners. Four time-of-day looks via html[data-phase]. */
:root{
  --hx-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  /* light: warm white, soft gray, a touch of lavender */
  --hx-bg:#FAF9F7;--hx-ink:#17161C;--hx-ink2:#46454F;--hx-ink3:#77757F;
  --hx-line:rgba(23,22,28,.07);--hx-line2:rgba(23,22,28,.12);
  --hx-glass:rgba(255,255,255,.6);--hx-glass-strong:rgba(255,255,255,.84);--hx-card:rgba(255,255,255,.72);--hx-solid:#FFFFFF;
  --hx-hover:rgba(23,22,28,.045);--hx-press:rgba(23,22,28,.08);
  --hx-accent:#7466E8;--hx-accent-ink:#FFFFFF;--hx-accent-soft:rgba(116,102,232,.1);
  --hx-grad:linear-gradient(100deg,#7466E8 0%,#A07BEA 100%);
  --hx-shadow:0 1px 2px rgba(23,22,28,.04),0 14px 34px -18px rgba(40,36,60,.2);
  --hx-shadow-lg:0 2px 6px rgba(23,22,28,.05),0 30px 70px -30px rgba(40,36,60,.32);
  --hx-veil:linear-gradient(180deg,rgba(250,249,247,.5),rgba(250,249,247,.82));
  --hx-halo:-16px -4px 42px -18px rgba(120,160,255,.6),16px -4px 42px -18px rgba(214,140,220,.55),0 18px 44px -20px rgba(255,176,130,.5),0 -14px 40px -20px rgba(150,130,250,.55);
  --aura:none;
}
html[data-theme="dark"]{
  /* dark: deep charcoal with soft purple and blue light */
  --hx-bg:#0F0F13;--hx-ink:#F2F1F6;--hx-ink2:rgba(236,234,245,.78);--hx-ink3:rgba(200,198,214,.55);
  --hx-line:rgba(255,255,255,.075);--hx-line2:rgba(255,255,255,.13);
  --hx-glass:rgba(30,30,37,.58);--hx-glass-strong:rgba(30,30,37,.86);--hx-card:rgba(30,30,38,.6);--hx-solid:#1A1A20;
  --hx-hover:rgba(255,255,255,.06);--hx-press:rgba(255,255,255,.1);
  --hx-accent:#B2A5FF;--hx-accent-ink:#17161C;--hx-accent-soft:rgba(178,165,255,.14);
  --hx-grad:linear-gradient(100deg,#B2A5FF 0%,#D3B1FF 100%);
  --hx-shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -20px rgba(0,0,0,.65);
  --hx-shadow-lg:0 2px 8px rgba(0,0,0,.35),0 34px 80px -30px rgba(0,0,0,.8);
  --hx-veil:linear-gradient(180deg,rgba(15,15,19,.4),rgba(15,15,19,.72));
  --hx-halo:-16px -4px 42px -18px rgba(120,160,255,.42),16px -4px 42px -18px rgba(214,140,220,.36),0 18px 44px -20px rgba(255,176,130,.3),0 -14px 40px -20px rgba(150,130,250,.42);
}
/* Morning Glow 06–10 */
html[data-phase="pagi"]{--hx-bg:#FBF8F4;--aura:
  radial-gradient(60% 50% at 8% 2%,rgba(255,200,160,.42),transparent 70%),
  radial-gradient(50% 44% at 94% 8%,rgba(200,188,250,.38),transparent 70%),
  radial-gradient(70% 54% at 50% 106%,rgba(250,214,226,.36),transparent 70%)}
/* Daylight 10–16 */
html[data-phase="siang"]{--hx-bg:#FAF9F7;--aura:
  radial-gradient(56% 48% at 92% 4%,rgba(204,196,252,.42),transparent 70%),
  radial-gradient(56% 48% at 6% 10%,rgba(214,226,246,.5),transparent 70%),
  radial-gradient(64% 50% at 50% 108%,rgba(232,226,250,.5),transparent 70%)}
/* Sunset 16–19 */
html[data-phase="sore"]{--hx-bg:#151217;--hx-glass:rgba(36,30,38,.58);--hx-glass-strong:rgba(36,30,38,.86);--hx-card:rgba(38,31,40,.6);--hx-solid:#1F1A21;
  --hx-accent:#F0B7A6;--hx-accent-soft:rgba(240,183,166,.14);--hx-grad:linear-gradient(100deg,#F3BFA6 0%,#C9A8FF 100%);
  --hx-veil:linear-gradient(180deg,rgba(21,18,23,.4),rgba(21,18,23,.72));--aura:
  radial-gradient(70% 52% at 50% 112%,rgba(232,128,96,.3),transparent 70%),
  radial-gradient(46% 42% at 4% 86%,rgba(190,96,160,.22),transparent 70%),
  radial-gradient(60% 50% at 50% -14%,rgba(110,86,190,.32),transparent 70%)}
/* Midnight 19–06 */
html[data-phase="malam"]{--hx-bg:#0F0F13;--aura:
  radial-gradient(58% 50% at 14% -6%,rgba(110,84,210,.3),transparent 70%),
  radial-gradient(50% 44% at 98% 26%,rgba(70,96,200,.22),transparent 70%),
  radial-gradient(70% 54% at 50% 112%,rgba(90,70,170,.18),transparent 70%)}

/* base */
.shell.home{font-family:var(--hx-font);--body:var(--hx-font);--display:var(--hx-font);--accent:var(--hx-accent);--accent-soft:var(--hx-accent-soft);--ink:var(--hx-ink);--muted:var(--hx-ink3)}
.shell.home .main{color:var(--hx-ink);background:var(--hx-bg);color-scheme:light}
html[data-theme="dark"] .shell.home .main{color-scheme:dark}
.mk-a2{stop-color:var(--mk-a2)}
.mk-sp{fill:var(--mk-sp)}
.ambient{position:absolute;inset:0;z-index:0;pointer-events:none}
.aura{position:absolute;inset:0;background:var(--aura),var(--hx-bg)}
.scene-veil{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);background:var(--hx-veil)}
.main.in-chat .scene-veil{opacity:1}
.nebula,.planet-wrap{display:none}

/* layout: full-bleed page; the sidebar (Library) is a drawer */
.shell.home{grid-template-columns:minmax(0,1fr)}
.shell.home .main{grid-column:1;margin:0!important;height:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important;grid-template-rows:minmax(0,1fr)}
.shell.home .main.in-chat{grid-template-rows:auto minmax(0,1fr)}
.shell.home .topbar{display:none}
.shell.home .sidebar{
  position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(320px,86vw);transform:translateX(-102%);
  transition:transform .45s var(--ease);box-shadow:0 0 60px -10px rgba(0,0,0,.35);
  background:var(--hx-solid);border-right:1px solid var(--hx-line);color:var(--hx-ink);
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;
}
.shell.home.sb-open .sidebar{transform:none}

/* ---------- home ---------- */
.shell.home .welcome{padding:0;position:relative;z-index:1}
.welcome-inner.home{margin:0;width:100%;max-width:none;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:0;color:var(--hx-ink)}
.welcome-inner.home > *{animation:none}
.hx-nav{
  position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;gap:8px;
  width:min(1080px,calc(100% - 32px));height:60px;margin:12px auto 0;padding:0 10px 0 14px;border-radius:20px;
  background:var(--hx-glass);border:1px solid var(--hx-line);box-shadow:var(--hx-shadow);
}
.hx-brand{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--hx-ink);padding:6px 8px;border-radius:14px;flex:none}
.hx-brand:hover{background:var(--hx-hover)}
.hx-brand .mark{width:28px;height:28px}
.hx-brand span{font:650 18px/1 var(--hx-font);letter-spacing:-.02em}
.hx-links{flex:1;display:flex;justify-content:center;gap:2px}
.hx-link{border:0;background:none;color:var(--hx-ink2);font:500 14.5px var(--hx-font);padding:9px 16px;border-radius:14px;transition:background .2s,color .2s}
.hx-link:hover{background:var(--hx-hover);color:var(--hx-ink)}
.hx-right{display:flex;gap:4px;margin-left:auto}
.hx-icon{width:42px;height:42px;border-radius:14px;border:0;background:none;color:var(--hx-ink2);display:grid;place-items:center;transition:background .2s,color .2s,transform .3s var(--spring)}
.hx-icon:hover{background:var(--hx-hover);color:var(--hx-ink)}
.hx-icon:active{transform:scale(.92)}
.hx-icon svg{width:20px;height:20px}

.hx-hero{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;
  padding:clamp(48px,13vh,150px) max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.hx-greet{display:inline-flex;align-items:center;gap:8px;font:500 15px/1.3 var(--hx-font);color:var(--hx-ink2)}
.hx-dot{width:8px;height:8px;border-radius:50%;background:var(--hx-accent);box-shadow:0 0 0 4px var(--hx-accent-soft)}
.hx-sep{color:var(--hx-ink3)}
#hPhase{color:var(--hx-ink3)}
.welcome .hx-title{margin:14px 0 0;font:700 clamp(36px,5.2vw,62px)/1.07 var(--hx-font);letter-spacing:-.035em;color:var(--hx-ink);text-wrap:balance}
.hx-title .l2{background:var(--hx-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.shell.home .hero-slot{width:100%;max-width:760px;margin-top:34px}
.hx-quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.hx-chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 13px;border-radius:14px;border:1px solid var(--hx-line);
  background:var(--hx-card);color:var(--hx-ink);font:500 14px var(--hx-font);box-shadow:0 1px 2px rgba(15,23,42,.04);transition:background .2s,transform .3s var(--spring),border-color .2s}
.hx-chip svg{width:16px;height:16px;color:var(--hx-accent)}
.hx-chip:hover{background:var(--hx-glass-strong);border-color:var(--hx-line2);transform:translateY(-1px)}
.hx-chip:active{transform:scale(.96)}

.hx-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;gap:16px;width:min(1080px,calc(100% - 32px));margin:22px auto 0;text-align:left}
.hx-side{display:grid;gap:16px;align-content:start}
.hx-card{background:var(--hx-card);border:1px solid var(--hx-line);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--hx-shadow);min-width:0}
.hx-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hx-card h2{display:flex;align-items:center;gap:8px;margin:0;font:600 15px/1.2 var(--hx-font);color:var(--hx-ink);letter-spacing:-.01em}
.hx-card h2 svg{width:17px;height:17px;color:var(--hx-accent)}
.hx-meta{font-size:12.5px;color:var(--hx-ink3);margin:0}
.hx-text-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--hx-accent);font:500 13.5px var(--hx-font);padding:6px 8px;border-radius:12px;margin-right:-6px}
.hx-text-btn:hover{background:var(--hx-accent-soft)}
.hx-text-btn svg{width:15px;height:15px;transition:transform .3s var(--spring)}
.hx-text-btn:hover svg{transform:translateX(2px)}
.hx-recent-list{display:flex;flex-direction:column;gap:2px}
.hx-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:14px;color:var(--hx-ink);transition:background .2s}
.hx-row:hover{background:var(--hx-hover)}
.hx-row-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--hx-accent-soft);color:var(--hx-accent)}
.hx-row-ic svg{width:17px;height:17px}
.hx-row-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hx-row-t b{font:600 14.5px/1.3 var(--hx-font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-row-t small{font-size:13px;color:var(--hx-ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-row-time{font-size:12px;color:var(--hx-ink3);flex:none;font-variant-numeric:tabular-nums}
.hx-empty{display:flex;gap:12px;align-items:flex-start;padding:10px;color:var(--hx-ink2)}
.hx-empty svg{width:22px;height:22px;color:var(--hx-accent);flex:none;margin-top:2px}
.hx-empty b{display:block;font-weight:600;color:var(--hx-ink)}
.hx-empty span{display:block;font-size:13.5px;color:var(--hx-ink3);margin-top:2px}
.hx-quote{margin:0 0 8px;font:500 18px/1.45 var(--hx-font);letter-spacing:-.01em;color:var(--hx-ink);text-wrap:pretty}
.hx-mem-n{margin:0 0 4px;font:600 15.5px/1.35 var(--hx-font);color:var(--hx-ink)}
.hx-mem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.hx-switch{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--hx-ink2);cursor:pointer}
.hx-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;width:min(1080px,calc(100% - 32px));
  margin:auto auto 0;padding:34px 0 calc(24px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--hx-ink2)}
.hx-foot-brand{display:inline-flex;align-items:center;gap:7px;color:var(--hx-ink)}
.hx-foot-brand .mark{width:18px;height:18px}
.hx-foot-dim{color:var(--hx-ink3)}

/* ---------- composer: one large rounded field, tools underneath ---------- */
.shell.home .dock{position:relative;z-index:3}
.shell.home .composer{
  gap:4px;border-radius:22px;padding:12px 10px 10px 18px;background:var(--hx-glass-strong);border:1px solid var(--hx-line2);
  box-shadow:var(--hx-shadow);transition:border-color .3s,box-shadow .3s,background .3s;
}
/* Apple Intelligence-style halo on focus: coloured shadows outside the field only (painted once, no animation loop) */
.shell.home .composer:focus-within{background:var(--hx-solid);border-color:color-mix(in srgb,var(--hx-accent) 40%,transparent);box-shadow:var(--hx-halo)}
.shell.home .composer.drag{border-color:var(--hx-accent)}
.shell.home .composer textarea{font:400 16px/1.5 var(--hx-font);color:var(--hx-ink);padding:4px 2px;min-height:26px}
.shell.home .composer textarea::placeholder{color:var(--hx-ink3)}
.shell.home .dock.in-hero .composer{padding:16px 12px 12px 20px}
.shell.home .dock.in-hero .composer textarea{font-size:17.5px;min-height:56px}
.shell.home .c-row{gap:2px;margin-left:-8px}
.shell.home .c-row #searchBtn,.shell.home .c-row #modelBtn,.shell.home .c-row #slashBtn{display:none}
.shell.home .tool{width:38px;height:38px;min-width:38px;padding:0;border-radius:12px;color:var(--hx-ink2)}
.shell.home .tool svg{width:19px;height:19px}
.shell.home .tool:hover:not(:disabled){background:var(--hx-hover);color:var(--hx-ink)}
.shell.home .tool.dim{opacity:.45}
.shell.home .tool.plus.on{color:var(--hx-accent);background:var(--hx-accent-soft)}
.shell.home #micBtn{display:inline-flex}
.shell.home #micBtn[hidden]{display:none}
.shell.home .send{width:40px;height:40px;border-radius:14px;background:var(--hx-accent);color:var(--hx-accent-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--hx-accent) 80%,transparent);transition:transform .35s var(--spring),opacity .2s}
.shell.home .send:disabled{opacity:.35;box-shadow:none}
.shell.home .send.stop{background:var(--hx-ink);color:var(--hx-bg)}
.shell.home .dock.in-hero{padding:0}
.shell.home .dock.in-hero .footnote,.shell.home .dock.in-hero .to-bottom{display:none}
.shell.home .dock.in-hero .palette{bottom:auto;top:calc(100% + 8px);text-align:left}
.shell.home .dock .footnote{color:var(--hx-ink3)}
.shell.home .palette{background:var(--hx-solid);border-color:var(--hx-line2);box-shadow:var(--hx-shadow-lg)}
.shell.home .tray .file-chip,.shell.home .file-chip{background:var(--hx-card);border-color:var(--hx-line2);color:var(--hx-ink)}
/* smart suggestions under the empty composer */
.smart{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:7;text-align:left;padding:8px;border-radius:20px;
  background:var(--hx-solid);border:1px solid var(--hx-line);box-shadow:var(--hx-shadow-lg);animation:popIn .3s cubic-bezier(.16,1,.3,1)}
.smart[hidden]{display:none}
.smart-h{display:flex;align-items:center;gap:7px;font:600 12px var(--hx-font);letter-spacing:.06em;text-transform:uppercase;color:var(--hx-ink3);padding:6px 10px 6px}
.smart-h svg{width:14px;height:14px;color:var(--hx-accent)}
.smart button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:14px;color:var(--hx-ink);font:400 15px/1.35 var(--hx-font)}
.smart button:hover{background:var(--hx-hover)}
.smart button svg{width:18px;height:18px;color:var(--hx-accent);flex:none}
.smart button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- chat ---------- */
.shell.home .main.in-chat .topbar{
  display:flex;position:relative;z-index:4;margin:10px auto 0;width:min(1000px,calc(100% - 24px));min-height:56px;border-radius:20px;padding:6px;gap:2px;
  background:var(--hx-glass);border:1px solid var(--hx-line);box-shadow:var(--hx-shadow);
}
.shell.home .topbar .icon-btn{width:42px;height:42px;border-radius:14px;color:var(--hx-ink2)}
.shell.home .topbar .icon-btn:hover:not(:disabled){background:var(--hx-hover);color:var(--hx-ink)}
.shell.home .topbar .icon-btn svg{width:19px;height:19px}
.shell.home .topbar .top-home .mark{width:26px;height:26px}
.shell.home .topbar .title{font:600 15.5px/1.2 var(--hx-font);color:var(--hx-ink);letter-spacing:-.01em;border-radius:12px}
.shell.home .topbar .title:hover:not(:disabled){background:var(--hx-hover)}
.shell.home #themeBtn,.shell.home #topMore,.shell.home #menuBtn{display:grid}
.shell.home #menuBtn[hidden]{display:none}
.shell.home #newChatTop.show-m{display:grid!important}
.shell.home .content{position:relative;z-index:2}
.shell.home .thread-inner{max-width:780px;padding-top:26px;gap:26px}
.shell.home .msg.user .bubble{background:var(--hx-accent);color:var(--hx-accent-ink);border:0;border-radius:20px 20px 6px 20px;padding:11px 16px;box-shadow:0 8px 20px -14px color-mix(in srgb,var(--hx-accent) 90%,transparent)}
.shell.home .msg.ai .body{color:var(--hx-ink);font-size:16px;line-height:1.65;margin-left:0;padding:0 0 0 30px;background:none;border:0;border-radius:0;box-shadow:none}
.shell.home .msg.ai .body.streaming{box-shadow:none}
.shell.home .msg.card .bubble{background:var(--hx-card);border:1px solid var(--hx-line);border-radius:20px;color:var(--hx-ink);box-shadow:var(--hx-shadow)}
.shell.home .who{color:var(--hx-ink3)}
.shell.home .who .nm{color:var(--hx-ink)}
.shell.home .who .dot{background:var(--hx-accent-soft);border:0}
.shell.home .msg-actions .icon-btn{color:var(--hx-ink3);border-radius:10px}
.shell.home .msg-actions .icon-btn:hover:not(:disabled){color:var(--hx-ink);background:var(--hx-hover)}
.shell.home .status-note{background:var(--hx-card);border-color:var(--hx-line)}
.shell.home .codeblock{background:var(--hx-solid);border:1px solid var(--hx-line2);border-radius:16px}
.shell.home .md th{background:var(--hx-hover)}
.shell.home .md table{border-color:var(--hx-line2)}
.shell.home .src,.shell.home .btn{background:var(--hx-card);border-color:var(--hx-line2);color:var(--hx-ink);border-radius:12px}
.shell.home .btn.primary,.sheet .btn.primary{background:var(--hx-accent);color:var(--hx-accent-ink);border-color:transparent}
.shell.home .dock:not(.in-hero){padding-top:8px}
.shell.home .dock:not(.in-hero) .dock-inner{max-width:780px}
.shell.home .to-bottom{background:var(--hx-solid);border-color:var(--hx-line2);color:var(--hx-ink)}
.shell.home .workspace{background:var(--hx-solid);border-left:1px solid var(--hx-line)}
.shell.home .thinking{color:var(--hx-ink3)}
.shell.home .streaming > :last-child::after{background:var(--hx-grad)}

/* ---------- overlays ---------- */
.modal{background:rgba(15,23,42,.24)}
html[data-theme="dark"] .modal{background:rgba(0,0,0,.5)}
.sheet{background:var(--hx-solid);color:var(--hx-ink);border:1px solid var(--hx-line);border-radius:22px;box-shadow:var(--hx-shadow-lg);font-family:var(--hx-font)}
.menu,.palette{background:var(--hx-solid);border:1px solid var(--hx-line2);border-radius:16px;box-shadow:var(--hx-shadow-lg);color:var(--hx-ink);font-family:var(--hx-font)}
.menu button{border-radius:10px}
.sheet.about{align-items:flex-start}
.sheet.about .mark{width:56px;height:56px}
.sheet.about h2{font:700 24px var(--hx-font);letter-spacing:-.02em}
.sheet.about p{margin:0;color:var(--hx-ink2);line-height:1.6}
.sheet.about .facts{width:100%}
.sheet.explore{max-width:760px;width:min(760px,calc(100vw - 24px))}
.ex-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:6px;max-height:min(62vh,640px);overflow-y:auto;padding-right:4px}
.ex-group h3{margin:0 0 6px;font:600 12px var(--hx-font);letter-spacing:.06em;text-transform:uppercase;color:var(--hx-ink3)}
.ex-list{display:flex;flex-direction:column;gap:2px}
.ex-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;color:var(--hx-ink)}
.ex-item:hover{background:var(--hx-hover)}
.ex-item b{font:600 14px var(--hx-font);color:var(--hx-accent)}
.ex-item span{font-size:13px;color:var(--hx-ink3)}
.keys{display:flex;flex-direction:column;margin-top:6px}
.key-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px solid var(--hx-line);font-size:14.5px}
.key-row:last-child{border-bottom:0}
.kbds{display:inline-flex;gap:5px;flex:none}
kbd{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--hx-line2);border-bottom-width:2px;
  background:var(--hx-bg);font:500 12.5px var(--hx-font);color:var(--hx-ink)}

/* appearance popover */
.theme-pop{
  position:fixed;z-index:80;width:300px;max-width:calc(100vw - 16px);border-radius:20px;padding:10px;font-family:var(--hx-font);
  background:var(--hx-solid);border:1px solid var(--hx-line2);color:var(--hx-ink);box-shadow:var(--hx-shadow-lg);
  animation:popIn .3s cubic-bezier(.16,1,.3,1);transform-origin:top right;
}
@keyframes popIn{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
.theme-pop.still{animation:none}
.tp-head{padding:4px 6px 8px}
.tp-head b{font:600 15px var(--hx-font)}
.tp-now{display:flex;align-items:center;gap:10px;margin:0 2px 8px;padding:10px 12px;border-radius:16px;color:#fff;position:relative;overflow:hidden}
.tp-now::before{content:"";position:absolute;inset:0;z-index:0}
.tp-now > *{position:relative;z-index:1}
.tp-now .tp-ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.24)}

.tp-opts{display:flex;flex-direction:column;gap:2px}
.tp-opts button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:12px;background:none;color:var(--hx-ink);font:500 14px var(--hx-font);padding:10px 12px;text-align:left;transition:background .2s}
.tp-opts button:hover{background:var(--hx-hover)}
.tp-opts button span{flex:1}
.tp-opts button svg{width:18px;height:18px;flex:none;color:var(--hx-ink3)}
.tp-opts button svg:last-child{opacity:0;color:var(--hx-accent)}

.tp-phases{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;padding-top:10px;border-top:1px solid var(--hx-line)}
