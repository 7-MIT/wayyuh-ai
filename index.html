function buildQuiz(box, st){
  const items = st.quiz.items, n = items.length;
  if (!Array.isArray(st.answers) || st.answers.length !== n) st.answers = items.map(() => null);
  if (!Array.isArray(st.hints)) st.hints = [];
  const save = () => saveChats();
  box.innerHTML = `<div class="qz-head"><div class="qz-title"></div><div class="qz-count"></div></div><div class="qz-bar">${items.map(() => "<i></i>").join("")}</div><div class="qz-body"></div>`;
  box.querySelector(".qz-title").textContent = st.quiz.title;
  const body = box.querySelector(".qz-body"), count = box.querySelector(".qz-count"), bars = [...box.querySelectorAll(".qz-bar i")];
  const paintBar = () => bars.forEach((b, i) => {
    const a = st.answers[i];
    b.className = a == null ? (i === st.current && !st.done ? "cur" : "") : (a === items[i].answer ? "ok" : "no");
  });

  function question(animate){
    const i = st.current, it = items[i], answered = st.answers[i] != null;
    count.textContent = L(`Soal ${i + 1} dari ${n}`, `Question ${i + 1} of ${n}`);
    paintBar();
    body.innerHTML = `<div class="qz-stage"${animate ? "" : ' style="animation:none"'}>
      <p class="qz-q"></p>
      <div class="qz-opts"></div>
      <div class="qz-reveal hint"><div><div class="qz-box qz-hint"><b>${L("Petunjuk", "Hint")}</b><span></span></div></div></div>
      <div class="qz-reveal exp"><div><div class="qz-box qz-exp"><b></b><span></span></div></div></div>
      <div class="qz-foot">
        <button class="qz-btn ghost" type="button" data-act="hint">${I_BULB}${L("Petunjuk", "Hint")}</button>
        <span class="qz-keys">${L("Tekan", "Press")} 1–${it.options.length}</span>
        <button class="qz-btn primary" type="button" data-act="next" disabled>${i === n - 1 ? L("Lihat hasil", "See results") : L("Berikutnya", "Next")}${I_NEXT}</button>
      </div></div>`;
    body.querySelector(".qz-q").textContent = it.q;
    const hintBox = body.querySelector(".qz-reveal.hint"), expBox = body.querySelector(".qz-reveal.exp");
    const hintBtn = body.querySelector('[data-act="hint"]'), nextBtn = body.querySelector('[data-act="next"]'), keys = body.querySelector(".qz-keys");
    hintBox.querySelector("span").textContent = it.hint || L("Baca lagi pertanyaannya pelan-pelan dan coret pilihan yang jelas salah.", "Read the question again slowly and rule out the options that are clearly wrong.");
    const opts = body.querySelector(".qz-opts");
    const btns = it.options.map((o, k) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "qz-opt";
      b.innerHTML = `<span class="qz-letter">${LETTERS[k]}</span><span class="qz-text"></span>`;
      b.querySelector(".qz-text").textContent = o;

      exp.querySelector("span").textContent = it.explain || (ok ? L("Mantap, lanjutkan.", "Nice, keep going.") : L(`Jawaban yang benar: ${it.options[it.answer]}.`, `The right answer: ${it.options[it.answer]}.`));

        <button class="qz-btn" type="button" data-act="retry">${L("Ulangi", "Retry")}</button>
        <button class="qz-btn primary" type="button" data-act="more">${L("Soal baru", "New questions")}</button>

function revealWords(root){
  // reveal a fresh answer block by block (paragraphs, lists, code), using only opacity/transform;

  [...root.children].slice(0, 14).forEach((el, i) => { el.classList.add("rw-block"); el.style.animationDelay = (i * 70) + "ms"; });
}

// confetti
function burst(x, y, n = 16, power = 1){
  if (reduced) return;
  const colors = [cssVar("--sun"), cssVar("--ok"), cssVar("--coral"), "#9DB4F2", "#F6D27A"];
  for (let i = 0; i < n; i++){
    const p = document.createElement("i"); p.className = "confetti";
    p.style.left = x + "px"; p.style.top = y + "px"; p.style.background = colors[i % colors.length];
    if (i % 3 === 0){ p.style.borderRadius = "50%"; p.style.width = p.style.height = "7px"; }
    document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2, v = (50 + Math.random() * 110) * power;
    const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v - 70 * power, rot = Math.random() * 900 - 450;
    const anim = p.animate([
      { transform: "translate(-50%,-50%) rotate(0deg) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx * .8}px), calc(-50% + ${dy * .8}px)) rotate(${rot * .5}deg) scale(1)`, opacity: 1, offset: .4 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 160 * power}px)) rotate(${rot}deg) scale(.6)`, opacity: 0 }
    ], { duration: 1000 + Math.random() * 600, easing: "cubic-bezier(.2,.6,.35,1)", fill: "forwards" });
    anim.onfinish = () => p.remove();
  }
}

const ic = (name, cls) => `<svg class="i${cls ? " " + cls : ""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;

/* the Wayyuh AI mark: a sun cut by two waves that form an "S", on a dusk-coloured tile (same art as the app icon).
   Colours come from CSS variables so seasonal themes can recolour it. */
function wyMark(k, mode){   // Wayyuh Pulse mark: a "W" drawn as one heartbeat line, plus an amber spark
  const W = "M13 21L22.5 45L32 27L41.5 45L51 21";
  const flow = mode === "think" ? `<animate attributeName="stroke-dashoffset" values="0;-100" dur="1.5s" repeatCount="indefinite"/>` : "";
  const draw = mode === "rise" ? `<animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.2s" dur="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>` : "";
  const dash = mode === "think" ? `stroke-dasharray="26 74"` : mode === "rise" ? `stroke-dasharray="100" stroke-dashoffset="100"` : "";
  const ghost = mode === "think" ? `<path d="${W}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>` : "";
  return `<svg class="tile" viewBox="0 0 64 64" aria-hidden="true"><defs>` +
    `<linearGradient id="lb${k}" x1="6" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--tl0,#052A1F)"/><stop offset=".62" style="stop-color:var(--tl1,#0E9F6E)"/><stop offset="1" style="stop-color:var(--tl3,#B6F35A)"/></linearGradient>` +
    `<radialGradient id="lg${k}" cx="46" cy="14" r="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".55"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient></defs>` +
    `<rect width="64" height="64" fill="url(#lb${k})"/><rect width="64" height="64" fill="url(#lg${k})"/>` + ghost +
    `<path d="${W}" pathLength="100" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" ${dash}>${flow}${draw}</path>` +
    `<circle cx="51" cy="21" r="3.6" fill="#FFC857"><animate attributeName="r" values="3.6;4.8;3.6" dur="2.4s" repeatCount="indefinite"/></circle></svg>`;
}
function tile(){ return wyMark(++tileN, ""); }

    `<radialGradient id="mkH${k}" cx="60" cy="74" r="50" gradientUnits="userSpaceOnUse"><stop offset="0" class="mk-h0"/><stop offset="1" class="mk-h1"/></radialGradient>` +

/* ================= menus ================= */
let openMenuEl = null;
function closeMenu(focusAnchor){
  if (!openMenuEl) return;
  const a = openMenuEl._anchor, hadFocus = openMenuEl.contains(document.activeElement);
  openMenuEl.remove(); openMenuEl = null;
  // only return focus when the chosen action didn't move it elsewhere (e.g. into a rename field)
  if (focusAnchor && hadFocus && a && a.isConnected) a.focus();
}
function showMenu(anchor, items){
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu"); m._anchor = anchor;
  for (const it of items){
    if (!it) continue;
    if (it === "sep"){ m.appendChild(document.createElement("hr")); continue; }
    if (it.header){ const h = document.createElement("div"); h.className = "mlabel"; h.textContent = it.header; m.appendChild(h); continue; }
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "menuitem");
    b.className = (it.danger ? "danger " : "") + (it.on ? "on" : "");
    b.innerHTML = (it.icon ? ic(it.icon) : "") + `<span></span>` + (it.hint ? `<small>${esc(it.hint)}</small>` : "");
    b.querySelector("span").textContent = it.label;
    if (it.disabled){ b.disabled = true; b.style.opacity = .45; }
    b.addEventListener("click", () => { const keep = it.onClick && it.onClick(b); if (!keep) closeMenu(true); });
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.left, innerWidth - mw - 8), y = r.bottom + 6;
  if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 6);
  m.style.left = Math.max(8, x) + "px"; m.style.top = y + "px";
  openMenuEl = m;
  const first = m.querySelector("button:not(:disabled)"); if (first) first.focus({ preventScroll: true });
  m.addEventListener("keydown", e => {
    const btns = [...m.querySelectorAll("button:not(:disabled)")], i = btns.indexOf(document.activeElement);
    if (e.key === "ArrowDown"){ e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
    else if (e.key === "Escape"){ e.preventDefault(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
  });
}
document.addEventListener("pointerdown", e => {
  if (openMenuEl && !openMenuEl.contains(e.target) && !(openMenuEl._anchor && openMenuEl._anchor.contains(e.target))) closeMenu();
}, true);
addEventListener("resize", () => closeMenu());

const shell = () => $("#shell");
const isMobile = () => matchMedia("(max-width: 900px)").matches;
const drawerMode = () => isMobile() || shell().classList.contains("home");
function setHome(on){
  const sh = shell();
  if (sh.classList.contains("home") === on) return;
  sh.classList.toggle("home", on);
  sh.classList.remove("sb-open"); $("#sbScrim").classList.remove("open");
  $("#sidebar").inert = drawerMode() || sh.classList.contains("sb-collapsed");
  updateMenuBtn();
}
function openSidebar(open){
  if (drawerMode()){
    shell().classList.toggle("sb-open", open);
    $("#sbScrim").classList.toggle("open", open);
    $("#sidebar").inert = !open;
    if (open) setTimeout(() => $("#sbSearch").focus({ preventScroll: true }), 300);
  } else {
    shell().classList.toggle("sb-collapsed", !open);
    store.set("sbCollapsed", !open);
    $("#sidebar").inert = !open;
  }
  updateMenuBtn();
}
function sidebarOpen(){ return drawerMode() ? shell().classList.contains("sb-open") : !shell().classList.contains("sb-collapsed"); }
function updateMenuBtn(){ $("#menuBtn").hidden = !drawerMode() && sidebarOpen(); }

function dayGroup(ts){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(ts); day.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / 86400000);
  return diff <= 0 ? t("today") : diff === 1 ? t("yesterday") : diff < 7 ? t("last7") : diff < 30 ? t("last30") : t("older");
}
function renderProjects(){
  const host = $("#projList"); if (!host) return;

  if (!list.length){ host.innerHTML = `<div class="nav-empty">${esc(t("noProjects"))}</div>`; return; }
  if (activeProject){
    const all = document.createElement("button"); all.type = "button"; all.className = "nav-item";
    all.innerHTML = ic("chat" in ICONS ? "chat" : "folder") + `<span class="t"></span>`;
    all.innerHTML = ic("sparkle") + `<span class="t"></span>`; all.querySelector(".t").textContent = t("allChats");

      { label: t("del"), icon: "trash", danger: true, onClick: btn => {

function inlineRename(el, value, save){
  const inp = document.createElement("input"); inp.className = "inline-input"; inp.value = value; inp.id = "rename-" + uid();
  el.replaceWith(inp); inp.focus(); inp.select();
  inp.addEventListener("click", e => e.stopPropagation());   // the field can sit inside a button; clicks in it must not start another rename
  let done = false;
  const finish = ok => { if (done) return; done = true; const v = inp.value.trim(); if (inp.isConnected) inp.replaceWith(el); if (ok && v && v !== value){ save(v.slice(0, 80)); toast(t("renamed")); } else onChatsChanged(); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); finish(true); } if (e.key === "Escape"){ e.stopPropagation(); finish(false); } });
  inp.addEventListener("blur", () => finish(true));
}
function renderChatList(){

function chatToMarkdown(c){
  let out = `# ${c.title}\n\n`;
  for (const m of c.messages){
    if (m.role === "user") out += `**${cfg.name || t("you")}:**\n\n${m.content}\n\n`;
    else if (m.role === "assistant") out += `**${botName()}:**\n\n${stripMemTags(m.content)}\n\n` + (m.sources && m.sources.length ? `${t("sources")}:\n` + m.sources.map((s, i) => `${i + 1}. [${s.title}](${s.url})`).join("\n") + "\n\n" : "");
    else if (m.kind === "quiz" && m.quiz) out += `**${botName()}:** ${L("Latihan soal", "Practice quiz")} "${m.quiz.title}" (${m.quiz.items.length})\n\n` + m.quiz.items.map((it, i) => `${i + 1}. ${it.q}\n` + it.options.map((o, k) => `   ${"ABCDEFGH"[k]}. ${o}${k === it.answer ? " ✓" : ""}`).join("\n")).join("\n") + "\n\n";
    else if (!m.html && m.content) out += `**${botName()}:**\n\n${m.content}\n\n`;
  }
  return out.trim() + "\n";
}
function htmlDoc(title, bodyHtml){
  return `<!doctype html><html lang="${cfg.lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
<style>body{font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#151a33;background:#fff}
h1{font-size:1.6em;line-height:1.25}pre{background:#f3f4fa;border:1px solid #e3e5f0;border-radius:12px;padding:12px 14px;overflow-x:auto}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}p code,li code{background:#f3f4fa;padding:.1em .35em;border-radius:5px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #e3e5f0;padding:6px 10px;text-align:left}blockquote{border-left:3px solid #6b5cf0;margin:0;padding:2px 14px;color:#555}
.turn{margin:22px 0}.who{font-weight:700;font-size:.85em;color:#6b5cf0;text-transform:uppercase;letter-spacing:.06em}.u .who{color:#596182}a{color:#2f6bea}
footer{margin-top:40px;color:#888;font-size:.85em}</style></head><body>${bodyHtml}<footer>Wayyuh AI · ${esc(new Date().toLocaleString(locale()))}</footer></body></html>`;

const cleanHtml = md => { const d = document.createElement("div"); d.innerHTML = renderMarkdown(md); d.querySelectorAll(".cb-head").forEach(h => h.remove()); return d.innerHTML; };
function exportChat(c, fmtName){
  if (!c) return toast(t("exportEmpty"));
  const md = chatToMarkdown(c), name = safeName(c.title);
  if (fmtName === "md") return download(name + ".md", md, "text/markdown;charset=utf-8");
  if (fmtName === "txt") return download(name + ".txt", mdToText(md), "text/plain;charset=utf-8");
  let body = `<h1>${esc(c.title)}</h1>`;
  for (const m of c.messages){
    if (m.role === "user") body += `<div class="turn u"><div class="who">${esc(cfg.name || t("you"))}</div>${cleanHtml(m.content)}</div>`;
    else if (m.role === "assistant") body += `<div class="turn"><div class="who">${esc(botName())}</div>${cleanHtml(stripMemTags(m.content))}</div>`;
    else if (!m.html && m.content) body += `<div class="turn"><div class="who">${esc(botName())}</div>${cleanHtml(m.content)}</div>`;

const ws = { code: "", original: "", lang: "", title: "", view: "code" };
const PREVIEWABLE = ["html", "htm", "svg", "md", "markdown", "xml"];
function guessLang(code){
  const s = code.trim();
  if (/^<!doctype html|^<html[\s>]/i.test(s) || /<\/(div|body|section|p)>/i.test(s)) return "html";
  if (/^<svg[\s>]/i.test(s)) return "svg";
  return "";
}
function openWorkspace({ code, lang, title }){
  ws.code = ws.original = code; ws.lang = (lang || guessLang(code) || "txt").toLowerCase(); ws.title = title || "Wayyuh AI";
  ws.view = PREVIEWABLE.includes(ws.lang) ? "preview" : "code";
  $("#wsEditor").value = code;
  $("#wsTitle").innerHTML = ""; $("#wsTitle").append(ws.title);
  const sm = document.createElement("small"); sm.textContent = ws.lang; $("#wsTitle").append(sm);
  $("#wsEmpty").hidden = true;
  setWsView(ws.view);
  showWorkspace(true);
}
function showWorkspace(open){
  $("#content").classList.toggle("ws-open", open);
  $("#wsToggle").setAttribute("aria-pressed", String(open));
  $("#workspace").inert = !open;
  if (!ws.code){ $("#wsEmpty").hidden = false; $("#wsEditor").hidden = true; $("#wsPreview").hidden = true; }
}
function setWsView(v){
  const canPreview = PREVIEWABLE.includes(ws.lang);
  ws.view = v === "preview" && canPreview ? "preview" : "code";
  $$("#wsSeg button").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.v === ws.view)); if (b.dataset.v === "preview") b.disabled = !canPreview; });
  $("#wsEditor").hidden = ws.view !== "code" || !ws.code;
  $("#wsPreview").hidden = ws.view !== "preview" || !ws.code;
  if (ws.view === "preview") refreshPreview();
}
function previewDoc(){
  const code = ws.code;
  if (ws.lang === "svg") return `<!doctype html><html><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#fff">${code}</body></html>`;
  if (ws.lang === "md" || ws.lang === "markdown") return htmlDoc(ws.title, cleanHtml(code));
  if (ws.lang === "xml") return `<!doctype html><pre style="font:13px monospace;white-space:pre-wrap">${esc(code)}</pre>`;
  return code;
}
let previewTimer = null;
function refreshPreview(){ clearTimeout(previewTimer); previewTimer = setTimeout(() => { $("#wsPreview").srcdoc = previewDoc(); }, 250); }
function initWorkspace(){
  const ed = $("#wsEditor");
  ed.addEventListener("input", () => { ws.code = ed.value; if (ws.view === "preview") refreshPreview(); });
  ed.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); const s = ed.selectionStart; ed.setRangeText("  ", s, ed.selectionEnd, "end"); ws.code = ed.value; }
  });
  $$("#wsSeg button").forEach(b => b.addEventListener("click", () => setWsView(b.dataset.v)));
  $("#wsCopy").addEventListener("click", () => ws.code && copyText(ws.code));
  $("#wsDownload").addEventListener("click", () => ws.code && download(`${safeName(ws.title)}.${LANG_EXT[ws.lang] || ws.lang || "txt"}`, ws.code));
  $("#wsReset").addEventListener("click", () => { if (!ws.code) return; ws.code = ws.original; ed.value = ws.code; if (ws.view === "preview") refreshPreview(); toast(t("wsReset2")); });
  $("#wsClose").addEventListener("click", () => showWorkspace(false));
  $("#wsToggle").addEventListener("click", () => showWorkspace(!$("#content").classList.contains("ws-open")));
}

function thinkingView(kind){
  const el = document.createElement("div"); el.className = "msg ai";
  el.appendChild(whoRow());
  const th = document.createElement("div"); th.className = "thinking";
  th.innerHTML = `<span class="think-logo">${liveTile("think")}</span><span class="think-text"></span>`;
  const sk = document.createElement("div"); sk.className = "skel"; sk.setAttribute("aria-hidden", "true"); sk.innerHTML = "<i></i><i></i><i></i>";
  el.appendChild(th); el.appendChild(sk); threadInner.appendChild(el); scrollDown(true);
  const txt = th.querySelector(".think-text");
  const lines = [kind === "search" ? t("searching") : kind === "files" ? t("reading") : t("thinking", { name: botName() }), t("thinking2"), t("thinking3"), t("thinking4")];
  let k = 0; txt.textContent = lines[0];
  const iv = setInterval(() => {
    if (!th.isConnected) return clearInterval(iv);
    k = Math.min(k + 1, lines.length - 1); txt.style.opacity = 0;
    setTimeout(() => { txt.textContent = lines[k]; txt.style.opacity = 1; }, 250);
  }, 3600);
  /* smooth streaming: text arrives in bursts, so it is revealed at a steady pace (faster when far behind)
     and the markdown is re-rendered at most every ~70ms */
  let body = null, latest = "", shown = 0, loop = 0, lastRender = 0, settleCb = null;
  const render = () => { const stick = nearBottom(); body.innerHTML = renderMarkdown(stripMemTags(latest.slice(0, shown))); if (stick) scrollDown(true); };
  const tick = now => {
    loop = 0;
    if (!body || !body.isConnected) return;
    const behind = latest.length - shown;
    if (behind > 0){
      shown = reduced ? latest.length : Math.min(latest.length, shown + Math.max(2, Math.ceil(behind / 7)));
      if (now - lastRender > 70 || shown === latest.length){ lastRender = now; render(); }
    }
    if (shown < latest.length) loop = requestAnimationFrame(tick);
    else if (settleCb){ const cb = settleCb; settleCb = null; cb(); }
  };
  return {
    el,
    status(text){ if (txt) txt.textContent = text; },
    stream(text){
      latest = text;
      if (!body){ clearInterval(iv); th.remove(); sk.remove(); body = document.createElement("div"); body.className = "body md streaming"; el.appendChild(body); }
      if (!loop) loop = requestAnimationFrame(tick);
    },
    settle(){ return new Promise(res => { if (!body || shown >= latest.length) return res(); settleCb = res; if (!loop) loop = requestAnimationFrame(tick); setTimeout(() => { shown = latest.length; res(); }, 1500); }); },
    remove(){ clearInterval(iv); if (loop) cancelAnimationFrame(loop); el.remove(); }
  };
}
async function askAI(prompt, { entry, mode = "chat", files = [], search = cfg.search } = {}){
  if (active) return;
  const chat = cur();
  let body;
  try{
    const history = historyBefore(chat, entry && entry.id), sent = v2() ? history.length : Math.min(6, history.length);
    body = buildBody({ prompt, history, files, mode, search, digest: olderDigest(chat, entry && entry.id, sent) });
  }
  catch(e){ failEntry(entry, e); return; }
  if (entry){
    if (prompt !== entry.content) entry.prompt = prompt;
    entry.mode = mode; entry.search = !!(search && caps.search); entry.failed = false; saveChats();
  }
  const view = thinkingView(search && caps.search ? "search" : files.length ? "files" : "");
  const ctrl = new AbortController();
  active = { ctrl, view, entry }; setBusy(1);
  let streamed = false;
  try{
    const { text, meta } = await requestWithRetry(body, { signal: ctrl.signal, onDelta: s => { streamed = true; view.stream(s); } }, n => view.status(t("retrying", { n })));
    if (streamed) await view.settle();
    if (!text.trim()) throw new WayyuhError("server", L("Server membalas tanpa teks. Coba lagi.", "The server replied without text. Try again."));
    finishAnswer(view, text, meta, { streamed });
    if (chat || cur()) autoTitle(chat || cur());
  }catch(e){
    if (e.kind === "aborted"){ if (e.partial && e.partial.trim()) finishAnswer(view, e.partial, {}, { streamed: true, stopped: true }); else view.remove(); }
    else if (e.partial && e.partial.trim()) finishAnswer(view, e.partial, {}, { streamed: true, partialError: e.message });
    else { view.remove(); failEntry(entry, e); }
  }finally{
    active = null; setBusy(-1);
  }
}

const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|js|mjs|ts|tsx|jsx|py|java|kt|c|h|cpp|cs|go|rs|php|rb|swift|dart|lua|sql|html|htm|css|scss|xml|yaml|yml|toml|ini|log|sh|bat|env\.example)$/i;
let pending = [];   // attachments waiting in the composer
function send(raw, opts = {}){
  const fromComposer = raw == null;
  const text = String(fromComposer ? input.value : raw).trim();
  const files = opts.files || (fromComposer ? pending.slice() : []);
  if (!text && !files.length) return;

  if (!navigator.onLine && !/^\//.test(text)){ toast(t("errOffline"), "err"); return; }

    return;
  }
  const bin = files.filter(f => f.kind !== "text"), txt = files.filter(f => f.kind === "text");
  const meta = files.map(f => ({ name: f.name, mime: f.mime, size: f.size, kind: f.kind, thumb: f.thumb }));
  const quizM = text.match(/^\/(latihan|kuis|practice|quiz)\b\s*([\s\S]*)$/i);
  enterChat(() => {
    if (quizM){
      const entry = addUser(text, { files: meta }); entry.local = true; saveChats();
      const img = bin.find(f => f.kind === "image");
      if (!quizM[2].trim() && !img){
        return addBot(L("Tulis topiknya, misalnya `/latihan fotosintesis` atau `/latihan 10 sulit sejarah kemerdekaan`. Bisa juga lampirkan foto catatan atau soal lalu tekan **Latihan soal**.",
          "Write the topic, e.g. `/practice photosynthesis` or `/practice 10 hard world war 2`. You can also attach a photo of notes or questions, then tap **Practice quiz**."), { kind: "sys" });
      }
      return startQuiz({ ...parseQuizArgs(quizM[2]), image: img ? `data:${img.mime};base64,${img.b64}` : null });
    }
    const entry = addUser(text || L("(lampiran)", "(attachment)"), { files: meta });
    if (bin.length) sessionFiles.set(entry.id, bin);
    const fileText = txt.map(f => `\n\n--- ${f.name} ---\n\`\`\`\n${f.text}\n\`\`\``).join("");
    dispatch(text, entry, { bin, fileText });
  });
}
function dispatch(text, entry, { bin = [], fileText = "" } = {}){
  const m = text.match(/^\/(\S+)\s*([\s\S]*)$/);
  if (m){
    const c = CMD_BY[m[1].toLowerCase()], arg = m[2].trim();
    if (!c){ entry.local = true; saveChats(); return addBot(L(`Perintah \`/${m[1]}\` belum ada. Ketik \`/bantuan\` untuk melihat daftarnya.`, `There's no \`/${m[1]}\` command. Type \`/help\` to see the list.`), { kind: "sys" }); }
    if (c.type === "ai"){
      if (c.argId && !arg && !fileText){ entry.local = true; saveChats(); return addBot(L(`Tambahkan ${c.argId} setelah perintahnya, misalnya \`/${c.id} ${c.argId}\`.`, `Add ${c.argEn} after the command, e.g. \`/${c.en} ${c.argEn}\`.`), { kind: "sys" }); }
      return askAI(AI_PROMPTS[c.id](arg + fileText), { entry, mode: c.id, files: bin });
    }
    entry.local = true; saveChats();
    if (c.id === "memori") return openMemory();
    if (c.id === "riwayat") return openSidebar(true);
    if (c.id === "baru") return newChat();
    return runCommand(c.id, arg);
  }
  const nat = text.match(/^(?:tolong\s+)?(?:ingat(?:lah)?|remember)[,\s]+(?:ya[,\s]+|bahwa\s+|kalau\s+|that\s+)?([\s\S]{3,})$/i);
  if (nat){ const saved = nat[1].split("\n")[0].trim(); if (addMemory(saved, "manual")){ memNote(entry._el, [saved]); entry.memo = saved; saveChats(); } }
  const prompt = (text || (bin.length ? L("Jelaskan isi lampiran ini.", "Describe what's in this attachment.") : "")) + fileText;
  askAI(prompt, { entry, files: bin, search: cfg.search });
}

let lastAuto = -1;
let autoQueued = false;
function autosize(){
  // measured at most once per frame, and only when the text could have changed line count
  if (autoQueued) return;
  autoQueued = true;
  requestAnimationFrame(() => {
    autoQueued = false;
    const v = input.value;
    if (!v.includes("\n") && v.length < 20 && lastAuto !== -1 && lastAuto <= 48) return;
    const before = input.offsetHeight;
    input.style.height = "auto";
    lastAuto = Math.min(input.scrollHeight, 220);
    input.style.height = lastAuto + "px";
    if (before !== input.offsetHeight && nearBottom()) scrollDown(true);
  });
}

const readAs = (file, how) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; how === "text" ? r.readAsText(file) : r.readAsDataURL(file); });
async function scaleImage(file){
  const url = URL.createObjectURL(file);

    const img = new Image(); img.src = url; await img.decode();
    const draw = (max, q) => {
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", q);
    };
    return { full: draw(1600, .85), thumb: draw(200, .7) };
  } finally { URL.revokeObjectURL(url); }
}
const TEXT_ACCEPT = ".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.kt,.c,.cpp,.cs,.go,.rs,.php,.rb,.sql,.xml,.yaml,.yml,text/*";
const FILE_ACCEPT = "image/*,application/pdf," + TEXT_ACCEPT;
async function addFiles(list){

    if (pending.length >= 6 || (file.type.startsWith("image/") || file.type === "application/pdf") && pending.filter(f => f.kind !== "text").length >= maxBin){ toast(t("maxFiles", { n: maxBin }), "err"); break; }
    const isText = file.type.startsWith("text/") || file.type === "application/json" || TEXT_EXT.test(file.name);
    try{
      if (file.type.startsWith("image/")){
        if (!canFile("image/jpeg")){ toast(t("filesNeedServer"), "err"); continue; }
        if (file.size > 20e6){ toast(t("fileTooBig", { max: "20 MB" }), "err"); continue; }
        let full, thumb, mime = "image/jpeg";
        try{ ({ full, thumb } = await scaleImage(file)); }
        catch(e){

      } else if (file.type === "application/pdf"){

        if (file.size > 7e6){ toast(t("fileTooBig", { max: "7 MB" }), "err"); continue; }
        const d = await readAs(file);

      } else if (isText){

        pending.push({ kind: "text", name: file.name, mime: "text/plain", size: file.size, text: (await readAs(file, "text")).slice(0, v2() ? 60000 : 3000) });
      } else toast(t("fileUnsupported"), "err");

const GROUP_LOOK = { learn: ["cap", "var(--cyan)"], write: ["write", "var(--blue)"], plan: ["sparkle", "var(--violet)"], notes: ["file", "#60A5FA"],
  time: ["clock", "#38BDF8"], tools: ["grid", "#A78BFA"], memory: ["brain", "#34D399"], sunday: ["sun", "var(--cyan)"] };

function updatePalette(){

  const q = m[1].toLowerCase();
  palItems = CMDS.filter(c => c.id.startsWith(q) || c.en.startsWith(q) || cmdDesc(c).toLowerCase().includes(q));
  if (!palItems.length){ setPal(false); return; }
  palIndex = Math.min(palIndex, palItems.length - 1);
  const p = $("#palette"); p.innerHTML = "";
  palItems.forEach((c, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "pal-item"; b.setAttribute("role", "option"); b.setAttribute("aria-selected", String(i === palIndex));

    b.addEventListener("mousedown", e => { e.preventDefault(); choosePal(c); });

/* voice input */
let rec = null;
function initVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = $("#micBtn");
  if (!SR){ btn.hidden = true; return; }
  btn.hidden = false;
  btn.addEventListener("click", () => {
    if (rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = cfg.lang === "en" ? "en-US" : "id-ID"; rec.interimResults = true; rec.continuous = false;
    const base = input.value ? input.value.replace(/\s*$/, " ") : "";
    rec.onresult = e => { let s = ""; for (const r of e.results) s += r[0].transcript; input.value = base + s; autosize(); updateSend(); };
    rec.onend = rec.onerror = () => { rec = null; btn.classList.remove("rec"); btn.setAttribute("aria-label", t("voice")); btn.title = t("voice"); input.focus(); };
    try{ rec.start(); btn.classList.add("rec"); btn.setAttribute("aria-label", t("voiceStop")); btn.title = t("voiceStop"); }

        onClick: () => { cfg.search = !cfg.search; saveCfg(); renderComposerTools(); toast(cfg.search ? t("webSearchOn") : t("webSearch")); } },
      { label: t("guruMode"), icon: "cap", on: !!cfg.guru, hint: t("guruHint"), onClick: () => { toggleGuru(); } },
      { label: t("modelPick"), icon: "sparkle", hint: curM.id === "smart" ? t("modelSmart") : t("modelFast"), onClick: () => { modelMenu(btn); return true; } },
      { label: t("tools"), icon: "grid", onClick: () => { input.value = "/"; input.focus(); palIndex = 0; updatePalette(); updateSend(); } }
    ]);
  });
  input.addEventListener("input", () => { autosize(); updateSend(); if (palOpen || input.value.startsWith("/")){ palIndex = 0; updatePalette(); } });
  input.addEventListener("keydown", e => {
    if (palOpen){
      if (e.key === "ArrowDown"){ e.preventDefault(); palIndex = (palIndex + 1) % palItems.length; updatePalette(); return; }
      if (e.key === "ArrowUp"){ e.preventDefault(); palIndex = (palIndex - 1 + palItems.length) % palItems.length; updatePalette(); return; }
      if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)){ e.preventDefault(); choosePal(palItems[palIndex]); return; }
      if (e.key === "Escape"){ setPal(false); return; }
    }
    if (e.key === "Escape" && active){ active.ctrl.abort(); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); if (!active) send(); }
  });
  input.addEventListener("paste", e => {
    const files = [...(e.clipboardData && e.clipboardData.files || [])];

  });
  $("#composer").addEventListener("submit", e => { e.preventDefault(); if (active) active.ctrl.abort(); else send(); });

  $("#imageBtn").addEventListener("click", () => {

  });
  input.addEventListener("focus", () => showSmart());
  input.addEventListener("blur", () => setTimeout(hideSmart, 120));
  input.addEventListener("input", () => { if (input.value) hideSmart(); else showSmart(); });
  $("#fileInput").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
  $("#searchBtn").addEventListener("click", () => { cfg.search = !cfg.search; saveCfg(); renderComposerTools(); });
  $("#modelBtn").addEventListener("click", e => modelMenu(e.currentTarget));
  $("#slashBtn").addEventListener("click", () => { if (palOpen){ setPal(false); return; } if (!input.value.startsWith("/")) input.value = "/"; palIndex = 0; input.focus(); updatePalette(); updateSend(); });
  const comp = $("#composer");
  let depth = 0;
  comp.addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")){ depth++; comp.classList.add("drag"); } });
  comp.addEventListener("dragleave", () => { if (--depth <= 0){ depth = 0; comp.classList.remove("drag"); } });
  comp.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  comp.addEventListener("drop", e => { e.preventDefault(); depth = 0; comp.classList.remove("drag"); addFiles([...e.dataTransfer.files]); });
  initVoice(); renderComposerTools(); updateSend();
}

/* ================= sky and mountains, following the real clock =================
   The sky colours, the sun and the moon follow the local time (or a fixed hour for Light/Dark).
   Everything is painted once and updated once a minute, so nothing animates while you type. */
const SKY_KEYS = [
  // hour, sky top, sky middle, horizon, mountains far → near, mist, stars
  [0,     "#060914", "#0D1430", "#1B2448", "#1A2140", "#141A35", "#0F142A", "#0A0E1E", "#2A3560", 1],
  [4.5,   "#0A0F26", "#1A2145", "#34355E", "#20264A", "#191F3E", "#121730", "#0C1022", "#3A3D6A", .9],
  [5.5,   "#1E2B5C", "#5A5684", "#C98A86", "#3A3C66", "#2E3058", "#232548", "#171A34", "#8A6F8A", .4],
  [6.5,   "#5C78B8", "#D2AFC0", "#FFD0A6", "#8C8AAE", "#73769A", "#5A6084", "#40486A", "#F2C4B0", 0],
  [8,     "#6FA0DE", "#B9D2EE", "#F6E6D2", "#A3B4CF", "#8AA0C0", "#7089AE", "#56708F", "#EDF1F7", 0],
  [12,    "#4A8CDC", "#93C0EF", "#DCEDFB", "#AFC2DB", "#93ABCB", "#7893B9", "#5D7B9E", "#E8F1FB", 0],
  [15,    "#5590D8", "#A0C6EC", "#E6EFF7", "#A9BCD6", "#8DA5C6", "#7290B5", "#57779A", "#EAF0F7", 0],
  [16.5,  "#5367AE", "#B494B6", "#F6BC8C", "#8C86AE", "#706C98", "#565580", "#3D3D63", "#F0C2A6", 0],
  [17.75, "#2F2F6E", "#B05A78", "#F59A5C", "#6B4F7E", "#533E6C", "#3D2E58", "#281F40", "#E39A86", .1],
  [19,    "#141A42", "#3A2F66", "#7A4F72", "#2E2850", "#252246", "#1C1A38", "#141228", "#5A4670", .6],
  [20.5,  "#080C22", "#121A3C", "#222B55", "#1C2244", "#161C3A", "#10152E", "#0B0F22", "#2C3662", 1],
  [24,    "#060914", "#0D1430", "#1B2448", "#1A2140", "#141A35", "#0F142A", "#0A0E1E", "#2A3560", 1]
];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
function skyHour(){
  if (seasonNight() && (cfg.theme === "auto" || cfg.theme === "system")) return 22;
  if (cfg.theme === "light") return 12.5;
  if (cfg.theme === "dark") return 22;
  if (cfg.theme === "system") return sysDark.matches ? 22 : 12.5;
  const d = new Date(); return d.getHours() + d.getMinutes() / 60;
}
function skyAt(h){
  let i = 0; while (i < SKY_KEYS.length - 2 && SKY_KEYS[i + 1][0] <= h) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
  const e = t * t * (3 - 2 * t);   // smoothstep: colours ease between keyframes
  const c = k => mixHex(a[k], b[k], e);
  return { s1: c(1), s2: c(2), s3: c(3), m: [c(4), c(5), c(6), c(7)], mist: c(8), stars: a[9] + (b[9] - a[9]) * e };
}
function ridgePath(seed, base, amp, step, freq, w){
  let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const pts = [];
  for (let x = -40; x <= w + 40; x += step){
    const y = base - amp * (.55 * Math.sin(x * freq + seed) + .3 * Math.sin(x * freq * 2.3 + seed * .7) + .15 * Math.sin(x * freq * 5.1)) - r() * amp * .14;
    pts.push([x, y]);
  }
  let d = `M-40 520L${pts[0][0]} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++){
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    d += `Q${x0} ${y0.toFixed(1)} ${((x0 + x1) / 2).toFixed(1)} ${((y0 + y1) / 2).toFixed(1)}`;
  }
  return d + `L${w + 40} 520Z`;
}
function buildSky(){
  const amb = document.querySelector(".ambient");
  if (!amb || $("#sky")) return;
  // stars: fixed pattern, drawn once
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let stars = "";
  for (let i = 0; i < 150; i++){
    const big = r() > .93;
    stars += `<circle cx="${(r() * 1600).toFixed(0)}" cy="${(r() * 560).toFixed(0)}" r="${big ? (1.3 + r()).toFixed(1) : (.5 + r() * .7).toFixed(1)}" opacity="${(.35 + r() * .65).toFixed(2)}"/>`;
  }
  const W = 1600;
  const sky = document.createElement("div");
  sky.className = "sky"; sky.id = "sky"; sky.setAttribute("aria-hidden", "true");
  sky.innerHTML = `
    <div class="sky-grad"></div>
    <svg class="sky-stars" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice"><g fill="#FFFFFF">${stars}</g></svg>
    <div class="sky-glow"></div>
    <div class="sky-moon"></div>
    <div class="sky-sun"></div>
    <svg class="sky-mtn" viewBox="0 0 ${W} 500" preserveAspectRatio="xMidYMax slice">
      <defs><linearGradient id="skyMist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mist);stop-opacity:0"/><stop offset="1" style="stop-color:var(--mist);stop-opacity:.55"/></linearGradient></defs>
      <path class="m1" d="${ridgePath(3, 250, 120, 80, .0036, W)}"/>
      <rect x="-40" y="190" width="${W + 80}" height="170" fill="url(#skyMist)"/>
      <path class="m2" d="${ridgePath(11, 320, 90, 60, .0052, W)}"/>
      <rect x="-40" y="270" width="${W + 80}" height="150" fill="url(#skyMist)" opacity=".7"/>
      <path class="m3" d="${ridgePath(23, 385, 70, 50, .0071, W)}"/>
      <path class="m4" d="${ridgePath(41, 445, 46, 40, .0096, W)}"/>
    </svg>
    <div class="sky-shade"></div>
    <div class="sky-wx"></div>
    <div class="sky-hw">
      <div class="hw-grade"></div>
      <div class="hw-moon"><i></i></div>
      <svg class="hw-web hw-web-l" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
        <path d="M0 0L118 38M0 0L92 92M0 0L38 118M0 0L120 4M0 0L4 120"/>
        <path d="M30 2Q24 12 28 21Q18 22 10 29Q12 20 2 30"/><path d="M62 4Q50 24 56 42Q36 44 21 57Q24 38 4 62"/><path d="M94 6Q78 38 84 63Q54 66 33 84Q38 56 6 94"/></g></svg>
      <svg class="hw-web hw-web-r" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" transform="translate(120 0) scale(-1 1)">
        <path d="M0 0L118 38M0 0L92 92M0 0L38 118M0 0L120 4M0 0L4 120"/>
        <path d="M30 2Q24 12 28 21Q18 22 10 29Q12 20 2 30"/><path d="M62 4Q50 24 56 42Q36 44 21 57Q24 38 4 62"/><path d="M94 6Q78 38 84 63Q54 66 33 84Q38 56 6 94"/></g>
        <path d="M100 0V46" stroke="currentColor" stroke-width="1"/><g transform="translate(100 52)" fill="currentColor"><ellipse rx="5.5" ry="6.5"/><circle cy="-7" r="3.6"/>
        <path d="M-4-2L-12-8M-4 1L-13 0M-4 4L-12 9M4-2L12-8M4 1L13 0M4 4L12 9" stroke="currentColor" stroke-width="1.2"/></g></svg>
    </div>`;
  amb.insertBefore(sky, amb.firstChild);
  updateSky();
}
function updateSky(){
  const sky = $("#sky"); if (!sky) return;
  const h = skyHour(), c = skyAt(h), st = sky.style;
  st.setProperty("--s1", c.s1); st.setProperty("--s2", c.s2); st.setProperty("--s3", c.s3); st.setProperty("--mist", c.mist);
  c.m.forEach((v, i) => st.setProperty("--m" + (i + 1), v));
  st.setProperty("--stars", c.stars.toFixed(2));
  // sun: rises 6:00 in the east (left), sets 18:00 in the west (right); the moon from 18:30 to 5:30
  // rises steeply near the horizon, then glides high across the top, clear of the headline
  const arc = t => { const alt = Math.sin(Math.PI * Math.min(1, Math.max(0, t))); return { x: 8 + 84 * t, alt, lift: Math.pow(alt, .35) }; };
  const ts = (h - 6) / 12, sunUp = ts > -.03 && ts < 1.03, sp = arc(ts);
  const tm = ((h - 18.5 + 24) % 24) / 11, moonUp = tm > -.03 && tm < 1.03, mp = arc(tm);
  st.setProperty("--sun-x", sp.x.toFixed(2) + "%"); st.setProperty("--sun-alt", sp.lift.toFixed(3)); st.setProperty("--sun-o", sunUp ? 1 : 0);
  st.setProperty("--sun-c", mixHex("#FFB46B", "#FFF6DD", Math.min(1, sp.alt * 2.2)));
  st.setProperty("--moon-x", mp.x.toFixed(2) + "%"); st.setProperty("--moon-alt", mp.lift.toFixed(3)); st.setProperty("--moon-o", moonUp ? 1 : 0);
  // warm glow on the horizon around sunrise and sunset
  const low = sunUp ? Math.max(0, 1 - sp.alt * 2.4) : 0;
  st.setProperty("--glow-x", sp.x.toFixed(2) + "%"); st.setProperty("--glow-o", (low * .9).toFixed(2)); st.setProperty("--glow-c", c.s3);
  st.setProperty("--shade", cfg.wallpaper && wallpaper ? "0" : photoShade(h).toFixed(3));
  showPhoto(currentPhase());
}

function dailyPhoto(){
  const n = ID_PHOTOS.length, d = new Date();
  const day = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  const shuffled = cycle => {
    let seed = ((cycle * 2654435761) + 12345) >>> 0;
    const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

    for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    return o;
  };

  if (cycle > 0 && order[0] === shuffled(cycle - 1)[n - 1]) [order[0], order[1]] = [order[1], order[0]];   // never the same photo two days in a row

/* ---------- ambient sound, generated in the browser (no audio files) ---------- */
const amb = { ctx: null, out: null, nodes: [], timers: [], kind: "off" };
function noiseBuffer(ctx, color){
  const len = ctx.sampleRate * 3, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0, b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    if (color === "brown"){ last = (last + .02 * w) / 1.02; d[i] = last * 3.2; }
    else if (color === "pink"){ b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .16; }
    else d[i] = w * .5;
  }
  return buf;
}
function ambKindAuto(){
  const k = wxOn() && wx && wx.d ? wxInfo(wx.d.cur.code, wx.d.cur.day).kind : "";
  if (["rain", "drizzle", "storm"].includes(k)) return "rain";
  return currentPhase() === "malam" ? "night" : "waves";
}
function ambStop(){
  amb.timers.forEach(clearInterval); amb.timers = [];
  amb.nodes.forEach(n => { try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }); amb.nodes = [];
  amb.kind = "off";
}
function ambPlay(kind){
  ambStop();
  if (!kind || kind === "off") return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC){ toast(L("Browser ini belum mendukung suara latar.", "This browser can't play ambient sound."), "err"); return; }
  const ctx = amb.ctx || (amb.ctx = new AC()); if (ctx.state === "suspended") ctx.resume();
  if (!amb.out){ amb.out = ctx.createGain(); amb.out.connect(ctx.destination); }
  amb.out.gain.setTargetAtTime(cfg.ambVol ?? .5, ctx.currentTime, .3);
  const real = kind === "auto" ? ambKindAuto() : kind; amb.kind = kind;
  const src = color => { const s = ctx.createBufferSource(); s.buffer = noiseBuffer(ctx, color); s.loop = true; s.start(); amb.nodes.push(s); return s; };
  const filt = (type, f, q) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; amb.nodes.push(n); return n; };
  const gain = v => { const g = ctx.createGain(); g.gain.value = v; amb.nodes.push(g); return g; };
  const blip = (freq, dur, vol, type = "sine") => { const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime; o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .005); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g).connect(amb.out); o.start(t0); o.stop(t0 + dur + .02); };
  if (real === "rain"){
    src("white").connect(filt("highpass", 500)).connect(filt("lowpass", 7000)).connect(gain(.35)).connect(amb.out);
    src("brown").connect(filt("lowpass", 300)).connect(gain(.25)).connect(amb.out);
    amb.timers.push(setInterval(() => { if (Math.random() < .55) blip(2200 + Math.random() * 3000, .03, .025, "triangle"); }, 90));
  } else if (real === "waves"){
    const g = gain(.18); src("brown").connect(filt("lowpass", 700)).connect(g).connect(amb.out);
    const lfo = ctx.createOscillator(), depth = gain(.16); lfo.frequency.value = .085; lfo.connect(depth).connect(g.gain); lfo.start(); amb.nodes.push(lfo);
    src("pink").connect(filt("bandpass", 1600, .6)).connect(gain(.05)).connect(amb.out);
  } else if (real === "night"){
    src("brown").connect(filt("lowpass", 260)).connect(gain(.12)).connect(amb.out);
    amb.timers.push(setInterval(() => { if (Math.random() < .7){ const f = 4300 + Math.random() * 500; [0, 70, 140].forEach(d => setTimeout(() => blip(f, .035, .045), d)); } }, 1100));
  } else if (real === "cafe"){
    src("pink").connect(filt("lowpass", 900)).connect(filt("highpass", 120)).connect(gain(.32)).connect(amb.out);
    amb.timers.push(setInterval(() => { if (Math.random() < .35) blip(2400 + Math.random() * 1400, .45, .02); }, 1700));
  }
}
function setAmbient(kind){ cfg.amb = kind; saveCfg(); ambPlay(kind); }
function setAmbVol(v){ cfg.ambVol = v; saveCfg(); if (amb.out && amb.ctx) amb.out.gain.setTargetAtTime(v, amb.ctx.currentTime, .1); }

/* ---------- focus mode with a simple Pomodoro ---------- */
const focusOn = () => document.documentElement.classList.contains("focus");
const pomo = { len: 25, left: 25 * 60, run: false, tm: 0 };
function setFocus(on){
  document.documentElement.classList.toggle("focus", !!on);
  if (!on){ clearInterval(pomo.tm); pomo.run = false; }
  if ($("#thread").hidden){ seasonUI(); drawFocus(); }
  if (on && !$("#thread").hidden) newChat();
}
function drawFocus(){
  const slot = $("#heroSlot"); if (!slot) return;
  let box = $("#focusBox");
  if (!focusOn()){ if (box) box.remove(); return; }
  if (!box){ box = document.createElement("div"); box.id = "focusBox"; box.className = "focus-box"; slot.after(box); }
  const mm = String(Math.floor(pomo.left / 60)).padStart(2, "0"), ss = String(pomo.left % 60).padStart(2, "0");
  box.innerHTML = `<div class="fb-time" role="timer" aria-live="off">${mm}:${ss}</div>
    <div class="fb-row"><button type="button" class="btn primary" data-f="go">${esc(pomo.run ? L("Jeda", "Pause") : L("Mulai", "Start"))}</button>
    <button type="button" class="btn" data-f="reset">${esc(L("Ulang", "Reset"))}</button>
    ${[15, 25, 50].map(n => `<button type="button" class="fb-len${pomo.len === n ? " on" : ""}" data-len="${n}">${n}′</button>`).join("")}
    <button type="button" class="hx-text-btn" data-f="exit">${esc(L("Keluar fokus", "Exit focus"))}</button></div>`;
  box.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    const f = b.dataset.f;
    if (f === "go"){ pomo.run = !pomo.run; clearInterval(pomo.tm);
      if (pomo.run) pomo.tm = setInterval(() => { pomo.left = Math.max(0, pomo.left - 1); const tEl = $("#focusBox .fb-time"); if (tEl) tEl.textContent = `${String(Math.floor(pomo.left / 60)).padStart(2, "0")}:${String(pomo.left % 60).padStart(2, "0")}`;
        if (!pomo.left){ clearInterval(pomo.tm); pomo.run = false; chime(); toast(L("Waktu fokus selesai. Istirahat 5 menit dulu ya!", "Focus time's up. Take a 5-minute break!")); pomo.left = pomo.len * 60; drawFocus(); } }, 1000);
      drawFocus(); }
    else if (f === "reset"){ clearInterval(pomo.tm); pomo.run = false; pomo.left = pomo.len * 60; drawFocus(); }
    else if (f === "exit") setFocus(false);
  }));
  box.querySelectorAll("[data-len]").forEach(b => b.addEventListener("click", () => { clearInterval(pomo.tm); pomo.run = false; pomo.len = +b.dataset.len; pomo.left = pomo.len * 60; drawFocus(); }));
}

/* ================= Wayyuh Pulse motion: cursor spotlight + card tilt ================= */
(function pulseFx(){
  if (reduced || !matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  const root = document.documentElement; let raf = 0, px = 0, py = 0;
  addEventListener("pointermove", e => {
    px = e.clientX; py = e.clientY;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; root.style.setProperty("--mx", px + "px"); root.style.setProperty("--my", py + "px"); });
    const c = e.target.closest && e.target.closest(".hx-card, .hx-chip");
    if (!c) return;
    const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    c.style.setProperty("--cx", x + "px"); c.style.setProperty("--cy", y + "px");
    if (c.classList.contains("hx-card")){
      c.style.setProperty("--ry", ((x / r.width - .5) * 5).toFixed(2) + "deg");
      c.style.setProperty("--rx", ((.5 - y / r.height) * 4).toFixed(2) + "deg");
    }
  }, { passive: true });
  addEventListener("pointerout", e => { const c = e.target.closest && e.target.closest(".hx-card"); if (c && !c.contains(e.relatedTarget)){ c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); } }, { passive: true });
})();

  $("#chatTitle").addEventListener("click", () => { const c = cur(); if (c && $("#chatTitleText")) inlineRename($("#chatTitleText"), c.title, v => { c.title = v; c.localTitle = false; c.userTitle = true; saveChats(); onChatsChanged(); }); });
  $$(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModal("#" + m.id); }));
  addEventListener("resize", () => { updateMenuBtn(); renderComposerTools(); if ($("#thread").hidden && $("#heroSlot")) placeDock(!phoneHome()); if (!drawerMode()){ shell().classList.remove("sb-open"); $("#sbScrim").classList.remove("open"); $("#sidebar").inert = shell().classList.contains("sb-collapsed"); } });
  thread.addEventListener("scroll", () => {
    $("#topbar").classList.toggle("scrolled", thread.scrollTop > 4);
    $("#toBottom").classList.toggle("show", thread.scrollHeight - thread.scrollTop - thread.clientHeight > 300);
  }, { passive: true });
  $("#toBottom").addEventListener("click", () => thread.scrollTo({ top: thread.scrollHeight, behavior: reduced ? "auto" : "smooth" }));
  threadInner.addEventListener("click", e => {
    const cp = e.target.closest(".cb-copy"), wsb = e.target.closest(".cb-ws");
    if (cp){ const code = cp.closest(".codeblock").querySelector("code").textContent; copyText(code); cp.innerHTML = ic("check"); setTimeout(() => cp.innerHTML = ic("copy"), 1400); }
    if (wsb){ const cb = wsb.closest(".codeblock"); openWorkspace({ code: cb.querySelector("code").textContent, lang: cb.dataset.lang, title: (cur() && cur().title) || "Wayyuh AI" }); }
  });
  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "k"){ e.preventDefault(); openSidebar(true); $("#sbSearch").focus(); }
    else if (mod && e.shiftKey && e.key.toLowerCase() === "o"){ e.preventDefault(); newChat(); }
    else if (e.key === "Escape"){
      if (themePopEl) closeThemePop(true);
      else if ($("#exploreModal").classList.contains("open")) closeModal("#exploreModal");
      else if ($("#keysModal").classList.contains("open")) closeModal("#keysModal");
      else if ($("#aboutModal").classList.contains("open")) closeModal("#aboutModal");
      else if ($("#memModal").classList.contains("open")) closeModal("#memModal");
      else if ($("#settingsModal").classList.contains("open")) closeModal("#settingsModal");
      else if (drawerMode() && sidebarOpen()) openSidebar(false);
      else if (isMobile() && $("#content").classList.contains("ws-open")) showWorkspace(false);
    }
    else if (e.key === "/" && document.activeElement === document.body){ e.preventDefault(); input.focus(); input.value = "/"; updatePalette(); updateSend(); }
  });
  // highlight.js arrives later from the CDN
  const hl = $("#hljsScript"); if (hl) hl.addEventListener("load", () => highlightIn(threadInner));
  // restore the last conversation if it was active in the last 30 minutes
  const lastId = store.get("current", null), last = lastId && chats[lastId];
  if (last && last.messages.length && Date.now() - last.updated < 30 * 60000){ currentId = last.id; renderChat(); }
  else { store.set("current", null); showThread(false); }
  onChatsChanged(); updateOnline();
  // follow the clock in Auto mode
  const phaseCheck = () => { if (cfg.theme === "auto" && currentPhase() !== document.documentElement.dataset.phase) applyTheme(); };
  setInterval(() => { tickClock(); phaseCheck(); updateSky(); refreshWeather(); }, 30000);
  refreshWeather();
  plusBoot();
  addEventListener("online", () => refreshWeather());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshWeather(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ phaseCheck(); tickClock(); updateSky(); } });
  probeCaps();
})();

})();
</script>
</body>
</html>
