<style>
/* Wayyuh AI Aurora
   Layout: persistent sidebar | chat column (thread + fixed composer) | optional workspace panel.
   Midnight navy base, violet + electric blue for interaction, Wayyuh AI's sun gold kept as the brand mark. */
/* Wayyuh AI Orbit
   Layout: sidebar on the midnight page | a framed, softly glowing main panel holding a starfield and a planet horizon.
   Palette: midnight, slate, blue, cyan, violet. Type: Space Grotesk for display, Inter for reading. */
:root{
  --bg:#F3F5FA;--bg-2:#E9EDF6;--panel:rgba(255,255,255,.72);--surface:#FFFFFF;--surface-2:#EEF2F8;
  --line:rgba(15,23,42,.08);--line-2:rgba(15,23,42,.14);--ink:#0F172A;--muted:#475569;--faint:#94A3B8;
  --blue:#2563EB;--cyan:#0891B2;--violet:#7C3AED;--accent:#2563EB;--accent-ink:#FFFFFF;--accent-soft:rgba(37,99,235,.10);
  --sun:#0891B2;--sun-soft:rgba(8,145,178,.12);--ok:#059669;--danger:#DC2626;--warn:#B45309;--shadow:rgba(15,23,42,.12);--code-bg:#F1F5F9;
  --glass:rgba(255,255,255,.66);--glass-strong:rgba(255,255,255,.94);--glass-edge:rgba(15,23,42,.10);--glass-hi:rgba(255,255,255,.9);
  --sage:#0D9488;--coral:#E11D48;
  --space:#F6F8FE;--frame:rgba(37,99,235,.20);--frame-glow:rgba(59,130,246,.16);--hl:rgba(255,255,255,.75);
  --planet:#FFFFFF;--rim:rgba(37,99,235,.42);--rim-in:rgba(96,165,250,.32);--atmo:rgba(147,197,253,.26);--atmo-deep:rgba(219,234,254,.5);
  --halo:rgba(96,165,250,.22);--halo-2:rgba(167,139,250,.10);--flare:rgba(255,255,255,.95);
  --title-m:#64748B;--title-a:#0F172A;--title-b:#4F46E5;--title-c:#7C3AED;--tile-ink:#0F172A;
  --mk-s0:#38BDF8;--mk-s1:#2563EB;--mk-h:#93C5FD;--mk-a0:#2563EB;--mk-a1:#1D4ED8;--mk-a2:#4F46E5;--mk-sp:#7C3AED;
  --display:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.9,.25,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.34,1.4,.64,1);

  --sbw:284px;
  color-scheme:light;
}
